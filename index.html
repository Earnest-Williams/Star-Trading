    // =====================================================
    // TRADE ROUTES
    // =====================================================
    function normaliseTradeRoutes() {
        if (!Array.isArray(tradeRoutes)) tradeRoutes = [];
        tradeRoutes.forEach(route => {
            if (typeof route.id !== "number") route.id = nextTradeRouteId++;
            if (!route.status) route.status = "active";
            if (typeof route.amount !== "number") route.amount = BALANCE.TRADE_ROUTE_BASE_AMOUNT;
            if (typeof route.intervalDays !== "number") route.intervalDays = BALANCE.TRADE_ROUTE_INTERVAL_DAYS;
            if (typeof route.nextRunDay !== "number") route.nextRunDay = player.time.day + 1;
            if (typeof route.runs !== "number") route.runs = 0;
            if (typeof route.failures !== "number") route.failures = 0;
            if (typeof route.profit !== "number") route.profit = 0;
            if (typeof route.heat !== "number") route.heat = 0;
            if (typeof route.reliability !== "number") route.reliability = 50;
            if (typeof route.escortCaptainId === "undefined") route.escortCaptainId = null;
        });
        nextTradeRouteId = Math.max(nextTradeRouteId, tradeRoutes.reduce((best, r) => Math.max(best, r.id + 1), 1));
    }

    function getLogisticsNode(sectorId) {
        const port = ports[sectorId];
        const planet = planets[sectorId];
        if (port) {
            const type = PORT_TYPES[port.typeKey];
            return {
                sectorId, kind: "port",
                name: `${type.name} S${sectorId}`,
                factionId: port.factionId || type.factionId,
                stock: port.stock, maxStock: port.maxStock,
                sells: type.sells.slice(), buys: type.buys.slice()
            };
        }
        if (planet && planet.owner === "Player") {
            return {
                sectorId, kind: "colony",
                name: `Player Colony S${sectorId}`,
                factionId: planet.factionId || "colonists",
                stock: planet.stock,
                maxStock: makeStock(9000, 9000, 9000),
                sells: COMMODITIES.slice(), buys: COMMODITIES.slice()
            };
        }
        return null;
    }

    function getAllLogisticsNodes() {
        return Object.keys(universe).map(Number).map(getLogisticsNode).filter(Boolean).sort((a, b) => a.sectorId - b.sectorId);
    }

    function routeExists(originSector, destinationSector, commodity) {
        return tradeRoutes.some(r => r.status !== "closed" && r.originSector === originSector && r.destinationSector === destinationSector && r.commodity === commodity);
    }

    function findShortestPath(start, goal) {
        if (start === goal) return [start];
        const queue = [[start]];
        const seen = new Set([start]);
        while (queue.length > 0) {
            const path = queue.shift();
            const here = path[path.length - 1];
            const sector = universe[here];
            if (!sector) continue;
            for (const next of sector.warps) {
                if (seen.has(next)) continue;
                const newPath = path.concat([next]);
                if (next === goal) return newPath;
                seen.add(next);
                queue.push(newPath);
            }
        }
        return [start, goal];
    }

    function getRoutePath(route) { return findShortestPath(route.originSector, route.destinationSector); }
    function getRouteDistance(originSector, destinationSector) { return Math.max(1, findShortestPath(originSector, destinationSector).length - 1); }

    function getRouteCommodityOptions(originSector, destinationSector) {
        const origin = getLogisticsNode(originSector);
        const destination = getLogisticsNode(destinationSector);
        if (!origin || !destination || originSector === destinationSector) return [];
        return COMMODITIES.filter(c => origin.sells.includes(c) && destination.buys.includes(c));
    }

    function getRouteSetupCost(originSector, destinationSector) {
        const distance = getRouteDistance(originSector, destinationSector);
        const risk = getRouteRiskForSectors(originSector, destinationSector);
        return BALANCE.TRADE_ROUTE_BASE_COST + distance * 220 + risk * 130;
    }

    function getRouteRiskForSectors(originSector, destinationSector) {
        const path = findShortestPath(originSector, destinationSector);
        return path.reduce((sum, sectorId) => {
            const sector = universe[sectorId];
            if (!sector) return sum;
            const dominant = getDominantInfluence(sectorId);
            let risk = sector.pirateThreat || 0;
            if (sector.region === "Badlands") risk += 1;
            if (dominant === "vc") risk += 1;
            if (dominant === "sda") risk -= 1;
            return sum + Math.max(0, risk);
        }, 0);
    }

    function getRouteRisk(route) {
        return getRouteRiskForSectors(route.originSector, route.destinationSector) + Math.max(0, route.heat || 0) / 12;
    }

    function getRouteEscortPower(route) {
        const captain = route.escortCaptainId ? captains[route.escortCaptainId] : null;
        if (!captain || captain.status !== "active") return 0;
        const relation = captain.relationshipToPlayer || { opinion: 0, trust: 0, rivalry: 0 };
        return (captain.ship.combatRating || 0) / 14 + Math.max(0, relation.trust || 0) / 8 + Math.max(0, relation.opinion || 0) / 25;
    }

    function getRouteMarketValue(sectorId, commodity, mode) {
        const node = getLogisticsNode(sectorId);
        if (!node) return 0;
        const stock = Math.max(0, node.stock[commodity] || 0);
        const maxStock = Math.max(1, node.maxStock[commodity] || 1);
        const ratio = Math.max(0, Math.min(1, stock / maxStock));
        const base = node.kind === "port" ? ports[sectorId].basePrices[commodity] : { ore: 85, org: 160, eq: 320 }[commodity];
        if (mode === "buy") return Math.max(BALANCE.MIN_TRADE_PRICE, Math.round(base * (0.72 + (1 - ratio) * 0.65)));
        return Math.max(BALANCE.MIN_TRADE_PRICE, Math.round(base * (0.70 + (1 - ratio) * 1.10)));
    }

    function estimateRouteProfit(originSector, destinationSector, commodity, amount = BALANCE.TRADE_ROUTE_BASE_AMOUNT) {
        const buyValue = getRouteMarketValue(originSector, commodity, "buy");
        const sellValue = getRouteMarketValue(destinationSector, commodity, "sell");
        const spread = Math.max(8, sellValue - buyValue);
        return Math.max(25, Math.floor(spread * amount * 0.38));
    }

    function createTradeRoute(destinationSector, commodity) {
        destinationSector = parseInt(destinationSector, 10);
        const originSector = player.currentSector;
        const origin = getLogisticsNode(originSector);
        const destination = getLogisticsNode(destinationSector);
        if (!origin || !destination) { log("Trade routes need a port or player colony at both ends."); return; }
        if (!getRouteCommodityOptions(originSector, destinationSector).includes(commodity)) { log("That route does not have a useful commodity flow."); return; }
        if (routeExists(originSector, destinationSector, commodity)) { log("That route already exists."); return; }
        const cost = getRouteSetupCost(originSector, destinationSector);
        if (player.credits < cost) { log(`Opening that route requires ${formatCredits(cost)} credits.`); return; }
        if (!spendTime(180, "opened a persistent trade route")) return;
        player.credits -= cost;
        const route = {
            id: nextTradeRouteId++,
            name: `${formatCommodity(commodity)} ${originSector}->${destinationSector}`,
            originSector, destinationSector, commodity,
            amount: BALANCE.TRADE_ROUTE_BASE_AMOUNT,
            intervalDays: BALANCE.TRADE_ROUTE_INTERVAL_DAYS,
            nextRunDay: player.time.day + 1,
            factionId: destination.factionId || origin.factionId || "traders",
            escortCaptainId: null,
            status: "active",
            runs: 0, failures: 0, profit: 0, heat: 0, reliability: 55
        };
        tradeRoutes.push(route);
        addFactionRep("traders", 3, "opened a persistent route");
        addFactionTrust("traders", 1, "route brokerage");
        addSectorInfluence(originSector, getFactionPoliticalPole(origin.factionId || "traders"), 1, "new logistics route");
        addSectorInfluence(destinationSector, getFactionPoliticalPole(destination.factionId || "traders"), 1, "new logistics route");
        addWorldEvent({
            type: "route_opened", sectorId: destinationSector, factionId: route.factionId,
            text: `You opened a persistent ${formatCommodity(commodity)} route from sector ${originSector} to sector ${destinationSector}.`,
            importance: 2, alert: true
        });
        updateUI();
    }
    registerAction("createTradeRoute", createTradeRoute);

    function toggleTradeRoute(routeId) {
        routeId = parseInt(routeId, 10);
        const route = tradeRoutes.find(r => r.id === routeId);
        if (!route || route.status === "closed") return;
        route.status = route.status === "active" ? "paused" : "active";
        addWorldEvent({ type: "route_status", text: `${route.name} is now ${route.status}.`, sectorId: route.destinationSector, importance: 1, alert: false });
        updateUI();
    }
    registerAction("toggleTradeRoute", toggleTradeRoute);

    function closeTradeRoute(routeId) {
        routeId = parseInt(routeId, 10);
        const route = tradeRoutes.find(r => r.id === routeId);
        if (!route || route.status === "closed") return;
        route.status = "closed";
        route.escortCaptainId = null;
        addWorldEvent({ type: "route_closed", text: `${route.name} was closed.`, sectorId: route.destinationSector, importance: 1, alert: true });
        updateUI();
    }
    registerAction("closeTradeRoute", closeTradeRoute);

    function assignCaptainToRoute(routeId, captainId) {
        routeId = parseInt(routeId, 10);
        const route = tradeRoutes.find(r => r.id === routeId);
        const captain = getCaptain(captainId);
        if (!route || !captain || route.status === "closed") return;
        const relation = captain.relationshipToPlayer || { opinion: 0, trust: 0, rivalry: 0 };
        const cost = Math.max(350, Math.floor(450 + (captain.ship.combatRating || 10) * 8 - Math.max(0, relation.opinion || 0) * 4));
        if (player.credits < cost) { log(`Hiring ${captain.name} for convoy escort requires ${formatCredits(cost)} credits.`); return; }
        if (!spendTime(45, "negotiated convoy escort")) return;
        tradeRoutes.forEach(r => { if (r.escortCaptainId === captainId) r.escortCaptainId = null; });
        player.credits -= cost;
        route.escortCaptainId = captainId;
        captain.known = true;
        nudgeCaptainRelation(captainId, { opinion: 4, trust: 2, debt: 1 }, `took escort duty on ${route.name}`);
        addWorldEvent({
            type: "route_escort", captainId, sectorId: route.originSector,
            text: `${captain.name} joined the convoy wing for ${route.name}.`,
            importance: 2, alert: true
        });
        updateUI();
    }
    registerAction("assignCaptainToRoute", assignCaptainToRoute);

    function unassignRouteEscort(routeId) {
        routeId = parseInt(routeId, 10);
        const route = tradeRoutes.find(r => r.id === routeId);
        if (!route) return;
        route.escortCaptainId = null;
        updateUI();
    }
    registerAction("unassignRouteEscort", unassignRouteEscort);

    function runTradeRoutesDaily() {
        normaliseTradeRoutes();
        tradeRoutes.forEach(route => {
            if (route.status !== "active") return;
            if (route.nextRunDay > player.time.day) return;
            runTradeRoute(route);
            route.nextRunDay = player.time.day + route.intervalDays;
        });
    }

    function runTradeRoute(route) {
        const origin = getLogisticsNode(route.originSector);
        const destination = getLogisticsNode(route.destinationSector);
        if (!origin || !destination) {
            route.status = "paused";
            addWorldEvent({ type: "route_paused", text: `${route.name} paused because one endpoint is no longer valid.`, importance: 2, alert: true });
            return;
        }
        const available = Math.max(0, origin.stock[route.commodity] || 0);
        const capacity = Math.max(0, (destination.maxStock[route.commodity] || 9999) - (destination.stock[route.commodity] || 0));
        const amount = Math.min(route.amount, available, capacity);
        if (amount <= 0) {
            route.failures += 1;
            route.reliability = clampRange(route.reliability - 3, 0, 100);
            addWorldEvent({
                type: "route_shortage", sectorId: route.originSector, factionId: route.factionId,
                text: `${route.name} missed a run because ${formatCommodity(route.commodity)} was unavailable or the destination was full.`,
                importance: 1, alert: false
            });
            return;
        }
        const risk = getRouteRisk(route);
        const escortPower = getRouteEscortPower(route);
        const failureChance = Math.max(0.02, Math.min(0.55, 0.04 + risk * 0.035 - escortPower * 0.025));
        const escortCaptain = route.escortCaptainId ? captains[route.escortCaptainId] : null;
        if (Math.random() < failureChance) {
            route.failures += 1;
            route.heat = Math.min(100, route.heat + 3 + Math.floor(risk));
            route.reliability = clampRange(route.reliability - 8, 0, 100);
            const hotSector = getRoutePath(route).sort((a, b) => (universe[b].pirateThreat || 0) - (universe[a].pirateThreat || 0))[0] || route.destinationSector;
            if (universe[hotSector]) universe[hotSector].pirateThreat = Math.min(6, (universe[hotSector].pirateThreat || 0) + 1);
            if (escortCaptain) nudgeCaptainRelation(escortCaptain.id, { opinion: 1, trust: 1, rivalry: 1 }, `fought through a failed convoy run on ${route.name}`);
            addWorldEvent({
                type: "route_raid", sectorId: hotSector,
                captainId: escortCaptain ? escortCaptain.id : null,
                factionId: "vc",
                text: `${route.name} was hit en route. Pirate pressure increased near sector ${hotSector}.`,
                importance: 3, alert: true
            });
            return;
        }
        origin.stock[route.commodity] -= amount;
        destination.stock[route.commodity] = Math.min(destination.maxStock[route.commodity] || 9999, (destination.stock[route.commodity] || 0) + amount);
        const profit = estimateRouteProfit(route.originSector, route.destinationSector, route.commodity, amount);
        player.credits += profit;
        route.profit += profit;
        route.runs += 1;
        route.heat = Math.max(0, route.heat - 1);
        route.reliability = clampRange(route.reliability + 2, 0, 100);
        addFactionRep("traders", 1, "route income");
        addSectorInfluence(route.originSector, getFactionPoliticalPole(origin.factionId || "traders"), 1, "regular logistics traffic");
        addSectorInfluence(route.destinationSector, getFactionPoliticalPole(destination.factionId || route.factionId || "traders"), 1, "regular logistics traffic");
        maybeRoutePoliticalSideEffect(route, amount, escortCaptain);
        if (escortCaptain && route.runs % 3 === 0) {
            nudgeCaptainRelation(escortCaptain.id, { opinion: 2, trust: 1 }, `kept ${route.name} running`);
        }
        addWorldEvent({
            type: "route_success", sectorId: route.destinationSector,
            captainId: escortCaptain ? escortCaptain.id : null, factionId: route.factionId,
            text: `${route.name} delivered ${amount} ${formatCommodity(route.commodity)} and earned ${formatCredits(profit)} credits.`,
            importance: route.runs % 3 === 0 ? 2 : 1, alert: false
        });
    }

    function maybeRoutePoliticalSideEffect(route, amount, escortCaptain) {
        const destination = getLogisticsNode(route.destinationSector);
        if (!destination) return;
        const pole = getFactionPoliticalPole(destination.factionId || "traders");
        if (route.commodity === "eq" && pole === "hc") addFactionTrust("hc", 1, "equipment route reliability");
        if (route.commodity === "org" && planets[route.destinationSector]) addFactionTrust("colonists", 1, "colony food route");
        if (route.commodity === "ore" && pole === "hc") addFactionRep("miners", 1, "ore route throughput");
        if (escortCaptain && escortCaptain.preferredFaction === "smugglers" && Math.random() < 0.15) {
            route.heat = Math.min(100, route.heat + 2);
            addFactionRep("vc", 1, "quiet convoy side business", "private");
        }
    }

    function getColonyDailyNeeds(planet) {
        if (!planet || planet.owner !== "Player") return makeStock(0, 0, 0);
        return makeStock(
            Math.floor((planet.buildings.factory * 3 + planet.buildings.defense * 2 + planet.colonists / 180)),
            Math.max(1, Math.floor(planet.colonists / 95 + planet.buildings.habitat)),
            Math.floor(planet.buildings.habitat + planet.buildings.mine + planet.buildings.farm + planet.buildings.defense * 2 + planet.colonists / 220)
        );
    }

    function updateColonyNeedsDaily() {
        Object.entries(planets).forEach(([sectorIdText, planet]) => {
            if (planet.owner !== "Player") return;
            if (typeof planet.satisfaction !== "number") planet.satisfaction = 60;
            if (!planet.shortages) planet.shortages = makeStock(0, 0, 0);
            const sectorId = Number(sectorIdText);
            const needs = getColonyDailyNeeds(planet);
            let shortageCount = 0;
            COMMODITIES.forEach(c => {
                const need = needs[c] || 0;
                const used = Math.min(planet.stock[c] || 0, need);
                planet.stock[c] -= used;
                const missing = Math.max(0, need - used);
                planet.shortages[c] = missing;
                if (missing > 0) shortageCount += 1;
            });
            if (shortageCount === 0) {
                planet.satisfaction = clampRange(planet.satisfaction + 3, 0, 100);
                if (planet.satisfaction >= 80 && Math.random() < 0.18) addFactionRep("colonists", 1, "well-supplied colony");
                return;
            }
            planet.satisfaction = clampRange(planet.satisfaction - shortageCount * 7, 0, 100);
            if (planet.satisfaction < 25) {
                const lost = Math.max(1, Math.floor(planet.colonists * 0.02));
                planet.colonists = Math.max(20, planet.colonists - lost);
                addWorldEvent({
                    type: "colony_shortage", sectorId, factionId: planet.factionId || "colonists",
                    text: `Colony S${sectorId} is undersupplied. Satisfaction fell to ${planet.satisfaction}, and ${lost} colonists left.`,
                    importance: 3, alert: true
                });
            } else {
                addWorldEvent({
                    type: "colony_shortage", sectorId, factionId: planet.factionId || "colonists",
                    text: `Colony S${sectorId} reported shortages: ${COMMODITIES.filter(c => planet.shortages[c] > 0).map(c => `${formatCommodity(c)} ${planet.shortages[c]}`).join(", ")}.`,
                    importance: 2, alert: false
                });
            }
        });
    }

    function getRouteEscortCandidates() {
        return getKnownCaptains()
            .filter(c => c.status === "active")
            .filter(c => c.archetype === "mercenary" || c.archetype === "trader" || c.archetype === "smuggler" || c.ship.combatRating >= 20)
            .sort((a, b) => (b.ship.combatRating || 0) - (a.ship.combatRating || 0));
    }

    function renderLogisticsScreen() {
        normaliseTradeRoutes();
        let html = `<h4>Trade Routes & Convoy Wings</h4>`;
        html += `<div class="small muted">Persistent routes turn one-off trades into lane control. They move stock daily, earn passive income, feed colonies, shift sector influence, and create convoy work for named captains.</div>`;
        html += renderRouteCreationPanel();
        html += renderActiveRoutesPanel();
        html += renderColonyNeedsPanel();
        return html;
    }

    function renderRouteCreationPanel() {
        const origin = getLogisticsNode(player.currentSector);
        let html = `<div class="commodity-row"><strong>Open Route From Current Sector</strong>`;
        if (!origin) return html + `<div class="muted">This sector needs a port or one of your colonies before it can anchor a persistent route.</div></div>`;
        html += `<div>Origin: ${escapeHtml(origin.name)}</div>`;
        const candidates = getAllLogisticsNodes().filter(n => n.sectorId !== player.currentSector);
        let found = false;
        candidates.forEach(node => {
            const commodities = getRouteCommodityOptions(player.currentSector, node.sectorId).filter(c => !routeExists(player.currentSector, node.sectorId, c));
            if (commodities.length === 0) return;
            found = true;
            const distance = getRouteDistance(player.currentSector, node.sectorId);
            const risk = getRouteRiskForSectors(player.currentSector, node.sectorId);
            html += `<div class="mission"><strong>${escapeHtml(node.name)}</strong> <span class="muted">${distance} jumps, risk ${risk}</span><br>`;
            commodities.forEach(commodity => {
                const cost = getRouteSetupCost(player.currentSector, node.sectorId);
                const profit = estimateRouteProfit(player.currentSector, node.sectorId, commodity);
                html += `<button data-action="createTradeRoute" data-arg0="${node.sectorId}" data-arg1="${commodity}">Open ${formatCommodity(commodity)} Route (${formatCredits(cost)}c, est ${formatCredits(profit)}c/day)</button>`;
            });
            html += `</div>`;
        });
        if (!found) html += `<div class="muted">No useful unscheduled flows from this sector. Try a port that exports goods, or build colony production first.</div>`;
        html += `</div>`;
        return html;
    }

    function renderActiveRoutesPanel() {
        const active = tradeRoutes.filter(r => r.status !== "closed");
        let html = `<div class="commodity-row"><strong>Existing Routes</strong>`;
        if (active.length === 0) return html + `<div class="muted">No persistent routes yet.</div></div>`;
        const escorts = getRouteEscortCandidates();
        active.forEach(route => {
            const origin = getLogisticsNode(route.originSector);
            const destination = getLogisticsNode(route.destinationSector);
            const faction = route.factionId && FACTIONS[route.factionId] ? FACTIONS[route.factionId] : null;
            const escort = route.escortCaptainId ? captains[route.escortCaptainId] : null;
            html += `<div class="card"><strong>${escapeHtml(route.name)}</strong> ${faction ? `<span style="color:${faction.color}">${faction.icon} ${faction.short}</span>` : ""}<br>`;
            html += `${origin ? escapeHtml(origin.name) : "Missing origin"} -> ${destination ? escapeHtml(destination.name) : "Missing destination"}<br>`;
            html += `Status: ${route.status} | Next run: Day ${route.nextRunDay} | Reliability ${route.reliability} | Heat ${route.heat}<br>`;
            html += `Runs ${route.runs} / Failures ${route.failures} / Lifetime profit ${formatCredits(route.profit)}<br>`;
            html += `Risk ${getRouteRisk(route).toFixed(1)} | Escort: ${escort ? escapeHtml(captainDisplayName(escort)) : "none"}<br>`;
            html += `<button data-action="toggleTradeRoute" data-arg0="${route.id}">${route.status === "active" ? "Pause" : "Resume"}</button>`;
            html += `<button data-action="closeTradeRoute" data-arg0="${route.id}">Close</button>`;
            if (escort) html += `<button data-action="unassignRouteEscort" data-arg0="${route.id}">Release Escort</button>`;
            html += `<div class="compact-actions">`;
            escorts.slice(0, 5).forEach(captain => {
                if (route.escortCaptainId === captain.id) return;
                html += `<button data-action="assignCaptainToRoute" data-arg0="${route.id}" data-arg1="${captain.id}">Hire ${escapeHtml(captain.callsign)}</button>`;
            });
            html += `</div></div>`;
        });
        html += `</div>`;
        return html;
    }

    function renderColonyNeedsPanel() {
        const playerColonies = Object.entries(planets).filter(([, p]) => p.owner === "Player");
        let html = `<div class="commodity-row"><strong>Colony Supply Needs</strong>`;
        if (playerColonies.length === 0) return html + `<div class="muted">Found a colony to unlock supply pressure.</div></div>`;
        playerColonies.forEach(([sectorIdText, planet]) => {
            const needs = getColonyDailyNeeds(planet);
            const shortages = planet.shortages || makeStock(0, 0, 0);
            html += `<div class="mission"><strong>Colony S${sectorIdText}</strong> Satisfaction ${planet.satisfaction || 0}<br>`;
            html += `Daily needs: ${COMMODITIES.map(c => `${formatCommodity(c)} ${needs[c]}`).join(" / ")}<br>`;
            html += `Stock: ${COMMODITIES.map(c => `${formatCommodity(c)} ${planet.stock[c] || 0}`).join(" / ")}<br>`;
            html += `Shortages: ${COMMODITIES.map(c => `${formatCommodity(c)} ${shortages[c] || 0}`).join(" / ")}</div>`;
        });
        html += `</div>`;
        return html;
    }

    // =====================================================
    // DAILY WORLD SIMULATION
    // =====================================================
    function produceColonies() {
        Object.entries(planets).forEach(([sectorIdText, planet]) => {
            if (planet.owner !== "Player") return;
            const sectorId = Number(sectorIdText);
            const type = PLANET_TYPES[planet.typeKey];
            const habitat = planet.buildings.habitat;
            const capacity = Math.max(100, habitat * 250);
            let growthMultiplier = type.growth;
            if (planet.policy && planet.policy.registration === "informal") growthMultiplier *= 1.08;
            if (planet.policy && planet.policy.security === "sda_patrol") growthMultiplier *= 0.97;
            if (planet.factionId === "colonists") growthMultiplier *= 1 + getGuildTier("colonists") * 0.05;
            const growth = Math.floor((4 + habitat * 3) * growthMultiplier);
            planet.colonists = Math.min(capacity, planet.colonists + growth);
            const dominant = getDominantInfluence(sectorId);
            const hcIndustrialBonus = dominant === "hc" ? 1.08 : 1.0;
            const fuColonyBonus = dominant === "fu" ? 1.07 : 1.0;
            const vcShadowBonus = planet.policy && planet.policy.security === "cartel_protection" ? 1.06 : 1.0;
            planet.stock.ore += Math.floor((planet.buildings.mine * 14 + planet.colonists / 60) * type.ore * hcIndustrialBonus * vcShadowBonus * getColonyProductionMultiplier(planet, "ore"));
            planet.stock.org += Math.floor((planet.buildings.farm * 14 + planet.colonists / 70) * type.org * fuColonyBonus * getColonyProductionMultiplier(planet, "org"));
            planet.stock.eq += Math.floor((planet.buildings.factory * 10 + planet.colonists / 100) * type.eq * hcIndustrialBonus * getColonyProductionMultiplier(planet, "eq"));
            const major = planet.factionId && FACTIONS[planet.factionId] && FACTIONS[planet.factionId].majorAffinity ? FACTIONS[planet.factionId].majorAffinity : planet.factionId;
            if (MAJOR_FACTIONS.includes(major)) addSectorInfluence(sectorId, major, 1, "");
            if (planet.policy && planet.policy.security === "cartel_protection") addSectorInfluence(sectorId, "vc", 1, "");
        });
    }

    function updatePortsDaily() {
        Object.values(ports).forEach(port => {
            const type = PORT_TYPES[port.typeKey];
            COMMODITIES.forEach(c => {
                if (type.sells.includes(c)) {
                    const refill = Math.ceil(port.maxStock[c] * (0.06 + Math.random() * 0.05));
                    port.stock[c] = Math.min(port.maxStock[c], port.stock[c] + refill);
                }
                if (type.buys.includes(c)) {
                    const consumption = Math.ceil(port.maxStock[c] * (0.03 + Math.random() * 0.04));
                    port.stock[c] = Math.max(0, port.stock[c] - consumption);
                }
            });
        });
    }

    function updateThreatsDaily() {
        Object.values(universe).forEach(sector => {
            if (sector.region === "Core") return;
            let chance = sector.region === "Badlands" ? 0.22 : 0.12;
            const spread = getInfluenceSpread(sector.id);
            const top = spread[0] ? spread[0].id : "fu";
            if (top === "sda") chance -= 0.06;
            if (top === "fu") chance -= 0.02;
            if (top === "vc") chance += 0.07;
            const planet = planets[sector.id];
            if (planet && planet.owner === "Player") {
                chance -= planet.buildings.defense * 0.04;
                if (planet.policy && planet.policy.security === "cartel_protection") chance -= 0.05;
                if (planet.policy && planet.policy.security === "sda_patrol") chance -= 0.06;
            }
            chance *= getPirateIncidentMultiplier();
            if (Math.random() < Math.max(0.02, chance)) {
                sector.pirateThreat = Math.min(6, sector.pirateThreat + 1);
                if (top === "vc") addSectorInfluence(sector.id, "vc", 1, "");
            }
        });
    }

    function expireMissions() {
        missions.forEach(m => {
            if ((m.status === "available" || m.status === "accepted" || m.status === "captain_taken") && m.expiresDay < player.time.day) {
                m.status = "expired";
            }
        });
        ensureFactionState();
        player.factions.asks.forEach(ask => {
            const wasAccepted = ask.status === "accepted";
            if ((ask.status === "available" || ask.status === "accepted") && ask.expiresDay < player.time.day) {
                ask.status = "expired";
                if (wasAccepted) addFactionTrust(ask.factionId, -2, "missed political ask");
            }
        });
        const openCount = missions.filter(m => m.status === "available").length;
        if (openCount < 6) generateMissionPool(6 - openCount);
    }

    function updateFactionsDaily() {
        ensureFactionState();
        MAJOR_FACTIONS.forEach(id => {
            if (getFactionHeat(id) > 0 && Math.random() < 0.45) player.factions.heat[id] = Math.max(0, player.factions.heat[id] - 1);
            if (getFactionLeverage(id) > 0 && Math.random() < 0.12) player.factions.leverage[id] = Math.max(0, player.factions.leverage[id] - 1);
        });
        GUILD_FACTIONS.forEach(id => {
            if (getFactionTrust(id) > 0 && Math.random() < 0.08) player.factions.trust[id] -= 1;
        });
        if (getFactionHeat("sda") >= 70 && Math.random() < 0.35) {
            const fine = Math.min(player.credits, 400 + Math.floor(Math.random() * 900));
            player.credits -= fine;
            addFactionHeat("sda", -12, "inspection fine paid");
            addFactionLeverage("sda", 2, "cargo audit file");
            recordFactionMemory("sda", "unpaidFines", fine > 0 ? 0 : 1);
            log(`SDA inspection sweep hit your records. Paid ${formatCredits(fine)} credits; heat dropped.`);
            Notifications.show(`SDA inspection: paid ${formatCredits(fine)}c fine`, 3);
        }
        if (Math.random() < 0.30) {
            const pair = Math.random() < 0.5 ? ["sda", "vc"] : ["fu", "hc"];
            const delta = pair[0] === "sda" ? -1 : (Math.random() < 0.5 ? -1 : 1);
            FACTION_RELATIONS[pair[0]][pair[1]] = Math.max(-100, Math.min(100, FACTION_RELATIONS[pair[0]][pair[1]] + delta));
            FACTION_RELATIONS[pair[1]][pair[0]] = Math.max(-100, Math.min(100, FACTION_RELATIONS[pair[1]][pair[0]] + delta));
            if (delta < 0 && pair.includes("vc")) {
                Object.values(universe).forEach(sector => {
                    if (sector.region !== "Core" || Math.random() > 0.10) return;
                    sector.pirateThreat = Math.min(4, sector.pirateThreat + 1);
                    addSectorInfluence(sector.id, "vc", 1, "");
                });
                log("Faction news: SDA–VC tensions flare. Core pirate probes increased slightly.");
            }
        }
        runSectorPoliticsDaily();
        runFactionExpansion();
        maybeGrantPoliticalIntel();
        player.factions.intel = player.factions.intel.filter(item => item.expiresDay >= player.time.day);
        generateFactionAsks();
    }

    function getSectorPoliticalMemory(sector) {
        if (!sector.politicalMemory) {
            sector.politicalMemory = {
                dominantFactionId: getDominantInfluence(sector.id),
                status: getSectorStatusLabel(sector.id),
                contestedDays: 0
            };
        }
        return sector.politicalMemory;
    }

    function adjustFactionRelation(a, b, delta, reason) {
        if (!FACTION_RELATIONS[a] || typeof FACTION_RELATIONS[a][b] !== "number") return;
        FACTION_RELATIONS[a][b] = clampRange(FACTION_RELATIONS[a][b] + delta, -100, 100);
        if (FACTION_RELATIONS[b] && typeof FACTION_RELATIONS[b][a] === "number") {
            FACTION_RELATIONS[b][a] = clampRange(FACTION_RELATIONS[b][a] + delta, -100, 100);
        }
        if (reason && Math.abs(delta) >= 2) {
            addWorldEvent({
                type: "faction_relations", factionId: a,
                text: `${FACTIONS[a].short} relations with ${FACTIONS[b].short} shifted ${delta > 0 ? "+" : ""}${delta}: ${reason}.`,
                importance: 2, alert: false
            });
        }
    }

    function recordDominanceChange(sector, before, after, reason) {
        if (!sector || !before || !after || before === after) return;
        addWorldEvent({
            type: "dominance_change", factionId: after, sectorId: sector.id,
            text: `Sector ${sector.id} shifted from ${FACTIONS[before].short} to ${FACTIONS[after].short} dominance after ${reason}.`,
            importance: 4, alert: true
        });
        adjustFactionRelation(after, before, -2, `sector ${sector.id} changed hands`);
        const memory = getSectorPoliticalMemory(sector);
        memory.dominantFactionId = after;
        memory.status = getSectorStatusLabel(sector.id);
    }

    function runSectorPoliticsDaily() {
        Object.values(universe).forEach(sector => {
            normaliseSectorInfluence(sector);
            const memory = getSectorPoliticalMemory(sector);
            const beforeDominant = getDominantInfluence(sector.id);
            const beforeStatus = getSectorStatusLabel(sector.id);
            updateFrontDaily(sector);
            processContestedSector(sector);
            applyFactionSectorEffects(sector);
            const afterDominant = getDominantInfluence(sector.id);
            const afterStatus = getSectorStatusLabel(sector.id);
            if (beforeStatus === "Contested" || afterStatus === "Contested") memory.contestedDays = (memory.contestedDays || 0) + 1;
            else memory.contestedDays = 0;
            memory.status = afterStatus;
            recordDominanceChange(sector, beforeDominant, afterDominant, "daily political pressure");
        });
    }

    function processContestedSector(sector) {
        const spread = getInfluenceSpread(sector.id);
        if (spread.length < 2) return false;
        const first = spread[0], second = spread[1];
        const gap = first.value - second.value;
        if (gap > BALANCE.CONTESTED_GAP) return false;
        const memory = getSectorPoliticalMemory(sector);
        const contestedDays = memory.contestedDays || 0;
        const topPair = [first.id, second.id];
        if (topPair.includes("vc") && sector.pirateThreat < 6 && Math.random() < 0.14 + contestedDays * 0.015) {
            sector.pirateThreat = Math.min(6, sector.pirateThreat + 1);
            addWorldEvent({ type: "pirate_surge", factionId: "vc", sectorId: sector.id, text: `Contested control in sector ${sector.id} gave raiders room to surge. Pirate threat is now ${sector.pirateThreat}.`, importance: 3, alert: sector.id === player.currentSector });
        }
        if (topPair.includes("sda") && sector.pirateThreat > 0 && Math.random() < 0.18 + Math.max(0, getFactionRep("sda")) / 4000) {
            sector.pirateThreat = Math.max(0, sector.pirateThreat - 1);
            addSectorInfluence(sector.id, "sda", 1, "patrol response in contested space");
        }
        const politicalOpen = missions.filter(m => m.status === "available" && m.kind === "political_contest").length;
        if (politicalOpen < BALANCE.POLITICAL_MISSION_LIMIT && Math.random() < 0.18 + contestedDays * 0.01) {
            const sponsor = Math.random() < 0.58 ? first.id : second.id;
            const rival = sponsor === first.id ? second.id : first.id;
            const mission = makeContestMission(sector, sponsor, rival);
            if (mission) {
                missions.push(prepareMissionOpportunity(mission));
                addWorldEvent({ type: "political_mission", factionId: sponsor, sectorId: sector.id, text: `${FACTIONS[sponsor].short} posted a conflict contract over sector ${sector.id}: ${mission.title}.`, importance: 3, alert: sector.id === player.currentSector });
            }
        }
        return true;
    }

    function applyFactionSectorEffects(sector) {
        normaliseSectorInfluence(sector);
        const sda = sector.influence.sda || 0;
        const fu = sector.influence.fu || 0;
        const hc = sector.influence.hc || 0;
        const vc = sector.influence.vc || 0;
        if (sda >= 55 && sector.pirateThreat > 0 && Math.random() < Math.min(0.45, (sda - 45) / 130)) {
            sector.pirateThreat = Math.max(0, sector.pirateThreat - 1);
        }
        if (hc >= 55 && sector.asteroids) {
            if (typeof sector.asteroids.maxOre !== "number") sector.asteroids.maxOre = Math.max(sector.asteroids.ore, 2500);
            const regen = Math.floor((12 + hc * 0.65) * (sector.asteroids.richness || 1));
            sector.asteroids.ore = Math.min(sector.asteroids.maxOre, sector.asteroids.ore + regen);
        }
        const planet = planets[sector.id];
        if (fu >= 55 && planet && planet.owner && planet.colonists > 0 && Math.random() < 0.28) {
            const growth = 1 + Math.floor(fu / 35);
            planet.colonists += growth;
            if (typeof planet.satisfaction === "number") planet.satisfaction = Math.min(100, planet.satisfaction + 1);
        }
        if (vc >= 50 && Math.random() < Math.min(0.32, (vc - 40) / 150) && sector.pirateThreat < 6) {
            sector.pirateThreat = Math.min(6, sector.pirateThreat + 1);
        }
        const port = ports[sector.id];
        if (vc >= 58 && port && !port.hiddenFactionId && Math.random() < 0.055) {
            port.hiddenFactionId = "vc";
            sector.front = { publicFactionId: port.publicFactionId || port.factionId, hiddenFactionId: "vc", suspicion: 12 + Math.floor(Math.random() * 18) };
        }
    }

    function updateFrontDaily(sector) {
        const port = ports[sector.id];
        if (!sector.front && port && port.hiddenFactionId) sector.front = { publicFactionId: port.publicFactionId || port.factionId, hiddenFactionId: port.hiddenFactionId, suspicion: 10 + Math.floor(Math.random() * 15) };
        if (!sector.front) return;
        const front = sector.front;
        if (!FACTIONS[front.hiddenFactionId]) { sector.front = null; return; }
        const hiddenInfluence = sector.influence[front.hiddenFactionId] || 0;
        const publicInfluence = sector.influence[front.publicFactionId] || 0;
        let suspicionGain = 1 + Math.floor(hiddenInfluence / 30);
        if (sector.surveyed) suspicionGain += 1;
        if (sector.pirateThreat >= 3 && front.hiddenFactionId === "vc") suspicionGain += 1;
        if (publicInfluence > hiddenInfluence + 20 && Math.random() < 0.45) suspicionGain -= 1;
        front.suspicion = clampRange((front.suspicion || 0) + suspicionGain, 0, 100);
        if (front.suspicion >= BALANCE.FRONT_EXPOSURE_THRESHOLD && Math.random() < (sector.surveyed ? 0.68 : 0.38)) exposeFrontOperation(sector);
    }

    function exposeFrontOperation(sector) {
        if (!sector.front) return;
        const front = sector.front;
        const hiddenId = front.hiddenFactionId;
        const publicId = front.publicFactionId;
        const port = ports[sector.id];
        if (port && port.hiddenFactionId === hiddenId) port.hiddenFactionId = null;
        sector.front = null;
        normaliseSectorInfluence(sector);
        sector.influence[hiddenId] = clampRange((sector.influence[hiddenId] || 0) - 9, 0, 100);
        if (MAJOR_FACTIONS.includes(publicId)) addSectorInfluence(sector.id, publicId, 4, "front operation exposed");
        if (hiddenId === "vc") addSectorInfluence(sector.id, "sda", 2, "anti-front enforcement action");
        adjustFactionRelation(publicId, hiddenId, -3, `front exposed in sector ${sector.id}`);
        addWorldEvent({ type: "front_exposed", factionId: hiddenId, sectorId: sector.id, text: `${FACTIONS[hiddenId].short} front activity in sector ${sector.id} was exposed and publicly dismantled.`, importance: 4, alert: true });
    }

    function runFactionExpansion() {
        Object.values(universe).forEach(source => {
            const spread = getInfluenceSpread(source.id);
            if (spread.length === 0) return;
            const strongest = spread[0];
            if (strongest.value < BALANCE.FACTION_EXPANSION_MIN_INFLUENCE) return;
            source.warps.forEach(targetId => {
                const target = universe[targetId];
                if (!target) return;
                const before = getDominantInfluence(targetId);
                if (before === strongest.id && (target.influence[strongest.id] || 0) >= 72) return;
                let chance = (strongest.value - 58) / 260;
                if (strongest.id === "sda" && source.region === "Core") chance += 0.025;
                if (strongest.id === "fu" && target.region === "Frontier") chance += 0.035;
                if (strongest.id === "hc" && (target.asteroids || ports[targetId])) chance += 0.035;
                if (strongest.id === "vc" && target.region === "Badlands") chance += 0.055;
                if (getSectorStatusLabel(targetId) === "Contested") chance += 0.035;
                if (Math.random() > Math.min(0.32, chance)) return;
                addSectorInfluence(targetId, strongest.id, strongest.value >= 82 ? 2 : 1, "");
                const after = getDominantInfluence(targetId);
                if (after !== before) recordDominanceChange(target, before, after, `expansion pressure from sector ${source.id}`);
            });
        });
    }

    function makeContestMission(sector, sponsorId, rivalId) {
        if (!sector || !FACTIONS[sponsorId]) return null;
        const originCandidates = activePortSectors().sort((a, b) => Math.abs(a - sector.id) - Math.abs(b - sector.id));
        const origin = ports[sector.id] ? sector.id : originCandidates[0];
        if (!origin) return null;
        const templates = {
            sda: { verb: "Run patrol pressure", operation: "patrol", minutes: 90, reward: 1900 },
            fu: { verb: "Rally frontier support", operation: "rally", minutes: 75, reward: 1750 },
            hc: { verb: "Secure industrial claims", operation: "claims", minutes: 90, reward: 2050 },
            vc: { verb: "Disrupt official control", operation: "disrupt", minutes: 75, reward: 2200 }
        };
        const template = templates[sponsorId] || templates.fu;
        const m = makeBaseMission(`${template.verb} in sector ${sector.id}`, origin, template.reward + (sector.pirateThreat || 0) * 220 + sector.id * 12, 4);
        m.type = "contest";
        m.kind = "political_contest";
        m.factionId = sponsorId;
        m.rivalFactionId = rivalId;
        m.targetSector = sector.id;
        m.operation = template.operation;
        m.operationMinutes = template.minutes;
        m.rewardRep = 3;
        m.visibility = sponsorId === "vc" ? "quiet" : "public";
        m.risk = getSectorStatusLabel(sector.id).toLowerCase();
        m.title = `${FACTIONS[sponsorId].short}: ${template.verb} in sector ${sector.id}`;
        m.context = FACTIONS[rivalId] ? `${FACTIONS[sponsorId].name} wants leverage against ${FACTIONS[rivalId].name}.` : `${FACTIONS[sponsorId].name} wants local leverage.`;
        return m;
    }

    function applyContestMissionOutcome(mission, actor, captain = null) {
        const targetId = mission.targetSector || mission.destinationSector || mission.originSector;
        const sector = universe[targetId];
        if (!sector || !mission.factionId) return;
        const sponsorPole = getFactionPoliticalPole(mission.factionId);
        const rivalPole = mission.rivalFactionId ? getFactionPoliticalPole(mission.rivalFactionId) : null;
        if (MAJOR_FACTIONS.includes(sponsorPole)) addSectorInfluence(targetId, sponsorPole, actor === "player" ? 4 : 3, `${actor} completed political operation`);
        if (rivalPole && MAJOR_FACTIONS.includes(rivalPole)) {
            normaliseSectorInfluence(sector);
            sector.influence[rivalPole] = clampRange((sector.influence[rivalPole] || 0) - 2, 0, 100);
            adjustFactionRelation(sponsorPole, rivalPole, -1, `political operation in sector ${targetId}`);
        }
        if (mission.factionId === "sda" && sector.pirateThreat > 0) sector.pirateThreat = Math.max(0, sector.pirateThreat - 1);
        if (mission.factionId === "vc") sector.pirateThreat = Math.min(6, sector.pirateThreat + 1);
        if (mission.factionId === "hc" && sector.asteroids) {
            if (typeof sector.asteroids.maxOre !== "number") sector.asteroids.maxOre = Math.max(sector.asteroids.ore, 2500);
            sector.asteroids.maxOre += 80;
            sector.asteroids.ore = Math.min(sector.asteroids.maxOre, sector.asteroids.ore + 80);
        }
        if (mission.factionId === "fu" && planets[targetId] && planets[targetId].owner) planets[targetId].satisfaction = Math.min(100, (planets[targetId].satisfaction || 50) + 3);
        if (captain) {
            nudgeCaptainFaction(captain, mission.factionId, 4);
            addCaptainHistory(captain, `shifted local politics for ${FACTIONS[mission.factionId].short} in sector ${targetId}.`, captain.known);
        }
        addWorldEvent({ type: "political_outcome", factionId: mission.factionId, captainId: captain ? captain.id : null, sectorId: targetId, text: `${actor === "player" ? "You" : captain ? captain.name : "A captain"} completed a political operation for ${FACTIONS[mission.factionId].short} in sector ${targetId}.`, importance: actor === "player" ? 4 : 3, alert: actor === "player" || targetId === player.currentSector });
    }

    function maybeGrantPoliticalIntel() {
        ensureFactionState();
        const current = universe[player.currentSector];
        if (!current) return;
        const nearby = [player.currentSector].concat(current.warps || []);
        nearby.forEach(sectorId => {
            const sector = universe[sectorId];
            if (!sector) return;
            const spread = getInfluenceSpread(sectorId);
            const dominant = spread[0] ? spread[0].id : "fu";
            const interesting = getSectorStatusLabel(sectorId) === "Contested" || Boolean(sector.front) || (sector.pirateThreat || 0) >= 3;
            if (!interesting) return;
            if (player.factions.intel.some(item => item.type === "political_daily" && item.sectorId === sectorId && item.expiresDay >= player.time.day)) return;
            const chance = Math.min(0.34, BALANCE.POLITICAL_INTEL_BASE_CHANCE + Math.max(0, getFactionRep(dominant)) / 3500 + Math.max(0, getFactionTrust(dominant)) / 700 + (sectorId === player.currentSector ? 0.08 : 0.03));
            if (Math.random() > chance) return;
            let msg = `${FACTIONS[dominant].short} contacts report political movement in sector ${sectorId}.`;
            if (sector.front) msg = `Whispers point to a front operation in sector ${sectorId}; suspicion is around ${sector.front.suspicion}.`;
            else if (getSectorStatusLabel(sectorId) === "Contested") msg = `Local contacts say sector ${sectorId} is contested between ${spread.slice(0, 2).map(item => FACTIONS[item.id].short).join(" and ")}.`;
            else if ((sector.pirateThreat || 0) >= 3) msg = `Route chatter flags pirate pressure in sector ${sectorId} at threat ${sector.pirateThreat}.`;
            addIntel({ type: "political_daily", factionId: dominant, sectorId, value: 25 + Math.floor(Math.random() * 20), expiresDay: player.time.day + 5, text: msg });
        });
    }

    function restUntilMorning() {
        const minutesToMorning = player.time.minuteOfDay < player.time.wakeMinute
            ? player.time.wakeMinute - player.time.minuteOfDay
            : (BALANCE.DAY_MINUTES - player.time.minuteOfDay) + player.time.wakeMinute;
        advanceTime(minutesToMorning, "rest until morning");
        log(`Day ${player.time.day}. You rested until morning; the frontier kept moving without you.`);
        updateUI();
    }
    registerAction("restUntilMorning", restUntilMorning);

    function renderShipyardPanel() {
        if (player.currentSector !== 1) { log("Shipyard services are only available at StarDock."); return; }
        let html = `<h4>StarDock Shipyard</h4>`;
        html += `<button data-action="repairShip">Repair Hull/Shields</button>`;
        html += `<button data-action="buyFighters">Buy 10 Fighters</button>`;
        Object.keys(UPGRADE_DEFS).forEach(key => {
            const up = UPGRADE_DEFS[key];
            html += `<div class="commodity-row"><strong>${escapeHtml(up.name)}</strong><br>Cost: ${formatCredits(up.credits)} credits, ${up.minutes} minutes <button data-action="buyUpgrade" data-arg0="${key}">Buy</button></div>`;
        });
        html += renderMissionBoard();
        document.getElementById("actions").innerHTML = html;
    }

    function buyUpgrade(key) {
        const up = UPGRADE_DEFS[key];
        if (player.currentSector !== 1 || !up) return;
        let finalCost = up.credits;
        if (key === "mining") finalCost = Math.round(finalCost * (1 - getGuildTier("miners") * 0.05));
        if (key === "cargo" || key === "engine") finalCost = Math.round(finalCost * (1 - getGuildTier("traders") * 0.04));
        if (player.credits < finalCost) { log(`Not enough credits for that upgrade. Cost: ${formatCredits(finalCost)}.`); return; }
        if (!spendTime(up.minutes)) return;
        player.credits -= finalCost;
        if (key === "cargo") player.ship.maxHolds += 25;
        else if (key === "engine") player.ship.travelMinutesPerWarp = Math.max(15, player.ship.travelMinutesPerWarp - 5);
        else if (key === "scanner") player.ship.scannerLevel += 1;
        else if (key === "mining") player.ship.miningPower += 15;
        else if (key === "shields") { player.ship.maxShields += 100; player.shields = player.ship.maxShields; }
        else if (key === "fighters") player.ship.maxFighters += 500;
        applyPoliticalEffect({ factionId: "sda", publicRep: 1, trust: 1, sectorId: 1, influence: 1, reason: "licensed shipyard purchase" });
        if (key === "mining") addFactionRep("miners", 2, "mining upgrade purchase");
        if (key === "cargo" || key === "engine") addFactionRep("traders", 1, "commercial ship upgrade");
        log(`Installed upgrade: ${up.name}.`);
        updateUI();
    }
    registerAction("buyUpgrade", buyUpgrade);

    function repairShip() {
        if (player.currentSector !== 1) return;
        const shieldMissing = player.ship.maxShields - player.shields;
        const hullMissing = player.ship.maxHull - player.hull;
        const cost = Math.ceil(shieldMissing * BALANCE.REPAIR_SHIELD_COST + hullMissing * BALANCE.REPAIR_HULL_COST);
        if (cost <= 0) { log("Repairs are not needed."); return; }
        if (player.credits < cost) { log(`Full repairs cost ${formatCredits(cost)} credits.`); return; }
        if (!spendTime(120)) return;
        player.credits -= cost;
        player.shields = player.ship.maxShields;
        player.hull = player.ship.maxHull;
        addFactionRep("sda", 1, "registered repair work");
        log(`Completed repairs for ${formatCredits(cost)} credits.`);
        updateUI();
    }
    registerAction("repairShip", repairShip);

    function buyFighters() {
        if (player.currentSector !== 1) return;
        const amount = Math.min(10, player.ship.maxFighters - player.fighters);
        if (amount <= 0) { log("Your fighter bay is full."); return; }
        const cost = amount * BALANCE.FIGHTER_COST;
        if (player.credits < cost) { log(`Buying ${amount} fighters costs ${formatCredits(cost)} credits.`); return; }
        if (!spendTime(30)) return;
        player.credits -= cost;
        player.fighters += amount;
        addFactionHeat("sda", amount >= 10 && getPrivateFactionRep("vc") > 50 ? 1 : 0, "notable fighter purchase");
        log(`Bought ${amount} fighters for ${formatCredits(cost)} credits.`);
        updateUI();
    }
    registerAction("buyFighters", buyFighters);

    // =====================================================
    // MISSIONS
    // =====================================================
    function generateMissionPool(count) {
        const requested = count || 10;
        for (let i = 0; i < requested; i++) {
            const typeRoll = Math.random();
            let mission = null;
            if (typeRoll < 0.45) mission = makeDeliveryMission();
            else if (typeRoll < 0.70) mission = makeMiningMission();
            else if (typeRoll < 0.88) mission = makeSurveyMission();
            else mission = makeColonyMission();
            if (mission) missions.push(prepareMissionOpportunity(mission));
        }
    }

    function activePortSectors() { return Object.keys(ports).map(Number); }

    function makeBaseMission(title, originSector, rewardCredits, expiresInDays) {
        const port = ports[originSector];
        const dominant = getDominantInfluence(originSector);
        let factionId = port && port.factionId ? port.factionId : dominant;
        if (Math.random() < 0.25) factionId = dominant;
        if (port && port.hiddenFactionId && Math.random() < 0.12) factionId = port.hiddenFactionId;
        return {
            id: nextMissionId++,
            title, originSector, factionId,
            rewardCredits, rewardRep: 2,
            expiresDay: player.time.day + expiresInDays,
            status: "available",
            operationMinutes: 30  // BUGFIX: default fallback
        };
    }

    function makeDeliveryMission() {
        const sectors = activePortSectors().filter(s => s !== 1 && PORT_TYPES[ports[s].typeKey].sells.length > 0);
        if (sectors.length < 1) return null;
        const origin = sectors[Math.floor(Math.random() * sectors.length)];
        const commodity = PORT_TYPES[ports[origin].typeKey].sells[0];
        const destinations = activePortSectors().filter(s => s !== origin && PORT_TYPES[ports[s].typeKey].buys.includes(commodity));
        if (destinations.length < 1) return null;
        const destination = destinations[Math.floor(Math.random() * destinations.length)];
        const amount = 10 + Math.floor(Math.random() * 3) * 10;
        const distance = Math.abs(destination - origin) + 1;
        const reward = amount * ports[origin].basePrices[commodity] + distance * 180 + 600;
        const m = makeBaseMission(`Deliver ${amount} ${formatCommodity(commodity)} to sector ${destination}`, origin, reward, 4 + Math.ceil(distance / 6));
        m.type = "delivery";
        m.destinationSector = destination;
        m.commodity = commodity;
        m.amount = amount;
        return m;
    }

    function makeMiningMission() {
        const origin = activePortSectors()[Math.floor(Math.random() * activePortSectors().length)];
        const amount = 30 + Math.floor(Math.random() * 5) * 10;
        const m = makeBaseMission(`Mine ${amount} Ore for sector ${origin}`, origin, amount * 95 + 700, 5);
        m.factionId = PORT_TYPES[ports[origin].typeKey].factionId === "hc" ? "miners" : m.factionId;
        m.type = "mining";
        m.amount = amount;
        m.progress = 0;
        return m;
    }

    function makeSurveyMission() {
        const origin = activePortSectors()[Math.floor(Math.random() * activePortSectors().length)];
        const candidates = Object.values(universe).filter(s => !s.surveyed && s.id !== origin);
        if (candidates.length < 1) return null;
        const target = candidates[Math.floor(Math.random() * candidates.length)].id;
        const m = makeBaseMission(`Survey sector ${target}`, origin, 1200 + target * 25, 5);
        m.type = "survey";
        m.targetSector = target;
        return m;
    }

    function makeColonyMission() {
        const origin = activePortSectors()[Math.floor(Math.random() * activePortSectors().length)];
        const candidates = Object.keys(planets).map(Number).filter(s => !planets[s].owner);
        if (candidates.length < 1) return null;
        const target = candidates[Math.floor(Math.random() * candidates.length)];
        const m = makeBaseMission(`Found a colony in sector ${target}`, origin, 4500, 8);
        m.type = "colony";
        m.targetSector = target;
        return m;
    }

    function missionDescription(m) {
        if (m.type === "delivery") return `Pickup/source: sector ${m.originSector}. Deliver ${m.amount} ${formatCommodity(m.commodity)} to sector ${m.destinationSector}.`;
        if (m.type === "mining") return `Mine ${m.amount} Ore, then report back to sector ${m.originSector}.`;
        if (m.type === "survey") return `Survey sector ${m.targetSector}, then report back to sector ${m.originSector}.`;
        if (m.type === "colony") return `Found a colony in sector ${m.targetSector}, then report back to sector ${m.originSector}.`;
        if (m.type === "contest") return `${m.context || "Political conflict contract."} Travel to sector ${m.targetSector}, spend ${m.operationMinutes || 90} minutes on the operation, then report the result.`;
        return "Mission details unavailable.";
    }

    function isMissionVisible(m) {
        if (!m.factionId || !FACTIONS[m.factionId]) return true;
        const faction = FACTIONS[m.factionId];
        if (faction.type === "guild") return getGuildTier(m.factionId) > 0 || getFactionRep(m.factionId) >= 50 || getFactionTrust(m.factionId) >= 25;
        if (m.factionId === "vc") return getFactionRep("vc") > -250 || getPrivateFactionRep("vc") >= 25 || getGuildTier("smugglers") > 0;
        return getFactionRep(m.factionId) > -250;
    }

    function renderMissionBoard() {
        const available = missions.filter(m => m.status === "available" && m.originSector === player.currentSector && isMissionVisible(m));
        let html = `<h4>Mission Board</h4>`;
        if (available.length === 0) { html += `<span class="muted">No available missions here.</span>`; return html; }
        available.forEach(m => {
            const faction = FACTIONS[m.factionId] || null;
            const prefix = faction ? `<span class="faction-icon" style="color:${faction.color}">${faction.icon}</span> ` : "";
            html += `<div class="mission"><strong>${prefix}${escapeHtml(m.title)}</strong><br>${escapeHtml(missionDescription(m))}<br>`;
            html += `Expires: Day ${m.expiresDay} | Reward: ${formatCredits(m.rewardCredits)} credits`;
            if (faction) html += ` | ${faction.short} +${m.rewardRep}`;
            if (m.candidates && m.candidates.length > 0) {
                html += `<br><span class="small muted">Other interested captains: ${m.candidates.map(id => captains[id] ? escapeHtml(captains[id].name) : escapeHtml(id)).join(", ")}</span>`;
            }
            html += `<br><button data-action="acceptMission" data-arg0="${m.id}">Accept</button></div>`;
        });
        return html;
    }

    function renderAllMissionScreen() {
        let html = `<h4>Mission Board</h4>`;
        if (ports[player.currentSector]) html += renderMissionBoard();
        else html += `<div class="muted">No local mission board in this sector. Visit a port or StarDock.</div>`;
        html += `<div class="commodity-row"><strong>Accepted Missions</strong>`;
        const accepted = missions.filter(m => m.status === "accepted");
        if (accepted.length === 0) html += `<div class="muted">No accepted missions.</div>`;
        accepted.forEach(m => {
            const faction = FACTIONS[m.factionId] || null;
            html += `<div class="mission"><strong>${faction ? `<span style="color:${faction.color}">${faction.icon}</span> ` : ""}${escapeHtml(m.title)}</strong><br>${escapeHtml(missionDescription(m))}<br>`;
            html += `Expires Day ${m.expiresDay} | Reward ${formatCredits(m.rewardCredits)}<br>`;
            if (m.type === "mining") html += `Progress: ${m.progress}/${m.amount} ore<br>`;
            html += `<button data-action="completeMission" data-arg0="${m.id}">Try Complete</button></div>`;
        });
        html += `</div>`;
        const claimed = missions.filter(m => m.status === "captain_taken" || m.status === "completed_by_captain").slice(-8);
        html += `<div class="commodity-row"><strong>Captain Activity</strong>`;
        if (claimed.length === 0) html += `<div class="muted">No captain has claimed a board opportunity yet.</div>`;
        claimed.forEach(m => {
            const captain = captains[m.takenBy];
            html += `<div class="mission"><strong>${escapeHtml(m.title)}</strong><br>`;
            html += `${escapeHtml(missionDescription(m))}<br>Status: ${m.status === "captain_taken" ? `Taken by ${captain ? escapeHtml(captain.name) : "unknown"}, ETA Day ${m.completionDay}` : `Completed by ${captain ? escapeHtml(captain.name) : "a captain"}`}</div>`;
        });
        html += `</div>`;
        return html;
    }

    function acceptMission(id) {
        id = parseInt(id, 10);
        const m = missions.find(mn => mn.id === id);
        if (!m || m.status !== "available") return;
        if (m.originSector !== player.currentSector) { log("You must be at the mission origin to accept it."); return; }
        m.status = "accepted";
        m.takenBy = "player";
        (m.candidates || []).forEach(captainId => {
            const captain = captains[captainId];
            if (!captain) return;
            nudgeCaptainRelation(captainId, { rivalry: 2, opinion: -1 }, `you accepted an opportunity ${captain.name} was considering`);
        });
        log(`Accepted mission: ${m.title}.`);
        updateUI();
    }
    registerAction("acceptMission", acceptMission);

    function completeMission(id) {
        id = parseInt(id, 10);
        const m = missions.find(mn => mn.id === id);
        if (!m || m.status !== "accepted") return;
        if (m.expiresDay < player.time.day) {
            m.status = "expired";
            log(`Mission expired: ${m.title}.`);
            updateUI();
            return;
        }
        if (m.type === "delivery") {
            if (player.currentSector !== m.destinationSector) { log(`Delivery destination is sector ${m.destinationSector}.`); return; }
            if (player.cargo[m.commodity] < m.amount) { log(`You need ${m.amount} ${formatCommodity(m.commodity)} to complete this delivery.`); return; }
            if (!spendTime(30)) return;
            player.cargo[m.commodity] -= m.amount;
            addSectorInfluence(m.destinationSector, m.factionId || "fu", 2, "mission cargo delivery");
        } else if (m.type === "mining") {
            if (player.currentSector !== m.originSector) { log(`Report back to sector ${m.originSector}.`); return; }
            if (m.progress < m.amount) { log(`Mining progress is ${m.progress}/${m.amount} Ore.`); return; }
            if (!spendTime(30)) return;
        } else if (m.type === "survey") {
            if (player.currentSector !== m.originSector) { log(`Report back to sector ${m.originSector}.`); return; }
            if (!universe[m.targetSector].surveyed) { log(`Sector ${m.targetSector} has not been surveyed yet.`); return; }
            if (!spendTime(30)) return;
        } else if (m.type === "colony") {
            if (player.currentSector !== m.originSector) { log(`Report back to sector ${m.originSector}.`); return; }
            if (!planets[m.targetSector] || planets[m.targetSector].owner !== "Player") { log(`No player colony exists in sector ${m.targetSector} yet.`); return; }
            if (!spendTime(30)) return;
        } else if (m.type === "contest") {
            if (player.currentSector !== m.targetSector) { log(`Political operation target is sector ${m.targetSector}.`); return; }
            // BUGFIX: ensure operationMinutes has a fallback
            if (!spendTime(m.operationMinutes || 90)) return;
            applyContestMissionOutcome(m, "player");
        }
        m.status = "completed";
        player.credits += m.rewardCredits;
        player.reputation += m.rewardRep;
        addWorldEvent({
            type: "player_mission",
            factionId: m.factionId || "fu",
            sectorId: m.destinationSector || m.targetSector || m.originSector,
            text: `You completed ${m.title}; faction influence and relationships adjusted.`,
            importance: 3, alert: false
        });
        const factionId = m.factionId || "fu";
        applyPoliticalEffect({ factionId, publicRep: m.rewardRep, trust: 1, favors: m.rewardRep >= 3 ? 1 : 0, sectorId: m.destinationSector || m.targetSector || m.originSector, influence: 2, reason: "mission completed", memoryKey: "reliableJobs" });
        if (FACTIONS[factionId] && FACTIONS[factionId].type === "major") {
            Object.entries(FACTION_RELATIONS[factionId] || {}).forEach(([otherId, relation]) => {
                if (relation <= -50) recordFactionMemory(otherId, "helpedEnemies", 1);
            });
        }
        if (m.type === "survey" && Math.random() < 0.35) {
            addIntel({
                type: "survey", factionId,
                sectorId: m.targetSector,
                value: 25,
                expiresDay: player.time.day + 7,
                text: `Fresh survey data from sector ${m.targetSector}.`
            });
        }
        notifyCaptainsPlayerCompletedMission(m);
        log(`Completed mission: ${m.title}. Reward: ${formatCredits(m.rewardCredits)} credits.`);
        Notifications.show(`Mission complete: +${formatCredits(m.rewardCredits)}c`, 2);
        updateUI();
    }
    registerAction("completeMission", completeMission);

    function notifyCaptainsPlayerCompletedMission(mission) {
        normaliseCaptains();
        (mission.candidates || []).forEach(captainId => {
            const captain = captains[captainId];
            if (!captain) return;
            const sameFaction = mission.factionId && (getFactionPoliticalPole(mission.factionId) === getFactionPoliticalPole(captain.preferredFaction));
            if (sameFaction) {
                nudgeCaptainRelation(captainId, { opinion: 2, trust: 1 }, "respected your competent contract work");
            } else {
                nudgeCaptainRelation(captainId, { rivalry: 3 }, "noticed you shaping a faction outcome they care about");
            }
        });
    }

    function offerHelpToCaptain(id) {
        const captain = getCaptain(id);
        if (!captain || captain.currentSector !== player.currentSector) return;
        if (!spendTime(45)) return;
        nudgeCaptainRelation(id, { opinion: 8, trust: 3, debt: 1 }, "you offered practical help without demanding a contract");
        if (captain.archetype === "trader") addFactionRep("traders", 1, "helped a guild hauler");
        if (captain.archetype === "miner") addFactionRep("miners", 1, "helped a prospector");
        updateUI();
        hailCaptain(id);
    }
    registerAction("offerHelpToCaptain", offerHelpToCaptain);

    function tradeRumorsWithCaptain(id) {
        const captain = getCaptain(id);
        if (!captain || captain.currentSector !== player.currentSector) return;
        if (!spendTime(30)) return;
        const rel = captain.relationshipToPlayer;
        if ((rel.trust || 0) + (rel.opinion || 0) < 5 && Math.random() < 0.55) {
            nudgeCaptainRelation(id, { opinion: -2, rivalry: 1 }, "brushed off your attempt to trade rumors");
            log(`${captain.name} gives you nothing useful.`);
        } else {
            const factionId = getCaptainDominantFaction(captain);
            addIntel({
                type: "captain_rumor", factionId,
                sectorId: captain.currentSector,
                value: 20 + Math.floor(Math.random() * 25),
                expiresDay: player.time.day + 6,
                text: `${captain.name} shared a rumor about ${FACTIONS[factionId].name} activity near sector ${captain.currentSector}.`
            });
            nudgeCaptainRelation(id, { opinion: 3, trust: 1 }, "shared route rumors with you");
        }
        updateUI();
        hailCaptain(id);
    }
    registerAction("tradeRumorsWithCaptain", tradeRumorsWithCaptain);

    function supportCaptainJob(id) {
        const captain = getCaptain(id);
        if (!captain || captain.currentSector !== player.currentSector || !captain.currentPlan) return;
        if (!spendTime(60)) return;
        const mission = missions.find(m => m.id === captain.currentPlan.missionId);
        captain.currentPlan.completionDay = Math.max(player.time.day, captain.currentPlan.completionDay - 1);
        if (mission) mission.completionDay = captain.currentPlan.completionDay;
        nudgeCaptainRelation(id, { opinion: 12, trust: 5, debt: 1 }, "you helped advance their active job");
        if (mission && mission.factionId) addFactionRep(mission.factionId, 1, `assisted ${captain.name}'s contract`);
        updateUI();
        hailCaptain(id);
    }
    registerAction("supportCaptainJob", supportCaptainJob);

    function buyOffCaptain(id) {
        const captain = getCaptain(id);
        if (!captain || captain.currentSector !== player.currentSector || !captain.currentPlan) return;
        const cost = 900 + Math.max(0, captain.relationshipToPlayer.rivalry || 0) * 12;
        if (player.credits < cost) { log(`Buying off ${captain.name} would take ${formatCredits(cost)} credits.`); return; }
        if (!spendTime(30)) return;
        player.credits -= cost;
        const mission = missions.find(m => m.id === captain.currentPlan.missionId);
        if (mission && Math.random() < 0.65 + Math.max(0, captain.relationshipToPlayer.opinion || 0) / 200) {
            mission.status = "available";
            mission.takenBy = null;
            mission.completionDay = null;
            captain.currentPlan = null;
            nudgeCaptainRelation(id, { opinion: -4, rivalry: 3 }, "accepted your payoff but remembers the interference");
            log(`${captain.name} stepped away from the opportunity. It is back on the board.`);
        } else {
            nudgeCaptainRelation(id, { opinion: -10, rivalry: 8 }, "rejected your payoff attempt");
            log(`${captain.name} takes offense at the offer.`);
        }
        updateUI();
        hailCaptain(id);
    }
    registerAction("buyOffCaptain", buyOffCaptain);

    function provokeCaptain(id) {
        const captain = getCaptain(id);
        if (!captain || captain.currentSector !== player.currentSector) return;
        if (!spendTime(30)) return;
        nudgeCaptainRelation(id, { opinion: -12, rivalry: 14 }, "you deliberately needled them in open comms");
        updateUI();
        hailCaptain(id);
    }

    function renderPoliticalSimulationSummary() {
        const contested = Object.values(universe).filter(s => getSectorStatusLabel(s.id) === "Contested");
        const fronts = Object.values(universe).filter(s => Boolean(s.front));
        const politicalMissions = missions.filter(m => m.kind === "political_contest" && (m.status === "available" || m.status === "accepted" || m.status === "captain_taken"));

        html += `<span class="sector-chip">Known/suspected fronts: ${fronts.length}</span>`;
        html += `<span class="sector-chip">Conflict missions: ${politicalMissions.length}</span>`;

        if (fronts.length > 0) html += `<div class="small amber">Front suspicion: ${fronts.slice(0, 6).map(s => `S${s.id} ${FACTIONS[s.front.hiddenFactionId].short} ${s.front.suspicion}`).join(" | ")}</div>`;
        html += `</div>`;
        return html;
    }

    function updatePoliticalAsksForTrade(commodity, amount, mode) {
        ensureFactionState();
        player.factions.asks.forEach(ask => {
            if (ask.status !== "accepted") return;
            if (ask.type === "quiet_delivery" && mode === "sell" && commodity === ask.commodity && player.currentSector === ask.targetSector) {
                ask.progress = ask.amount;
            }
        });
    }

    function renderSectorInfluenceDetails(sectorId) {
        const sector = universe[sectorId];
        if (!sector) return `<span class="muted">No sector data.</span>`;
        const spread = getInfluenceSpread(sectorId);
        let html = `<div>Status: ${getSectorStatusLabel(sectorId)}</div>`;
        spread.forEach(item => {
            const faction = FACTIONS[item.id];
            html += `<div class="faction-line"><span style="color:${faction.color}">${faction.icon} ${faction.short}</span><span class="faction-bar"><span class="faction-fill" style="width:${item.value}%; background:${faction.color}"></span></span><span>${item.value}</span></div>`;
        });
        if (sector.front) {
            const publicFaction = FACTIONS[sector.front.publicFactionId];

    function renderFactionAsks() {
        ensureFactionState();
        const asks = player.factions.asks.filter(a => a.status === "available" || a.status === "accepted");
        if (asks.length === 0) return `<div class="muted">No current faction asks.</div>`;
        let html = "";
        asks.forEach(ask => {
            const faction = FACTIONS[ask.factionId];
            const state = ask.status === "accepted" ? "Accepted" : "Available";
            html += `<div class="mission"><strong style="color:${faction.color}">${faction.icon} ${escapeHtml(ask.title)}</strong><br>`;
            html += `${escapeHtml(ask.text)}<br>Status: ${state} | Expires: Day ${ask.expiresDay}`;
            if (typeof ask.progress === "number") html += ` | Progress: ${ask.progress}/${ask.amount}`;
            html += `<br>`;
            if (ask.status === "available") html += `<button data-action="acceptFactionAsk" data-arg0="${ask.id}">Accept</button>`;
            if (ask.status === "accepted") html += `<button data-action="completeFactionAsk" data-arg0="${ask.id}">Report Completion</button>`;
            html += `</div>`;

    function renderIntelPanel() {
        ensureFactionState();
        const intel = player.factions.intel.filter(i => i.expiresDay >= player.time.day);
        if (intel.length === 0) return `<div class="muted">No actionable intel.</div>`;

        intel.forEach(item => {
            const faction = item.factionId ? FACTIONS[item.factionId] : null;
            html += `<div class="mission">${faction ? `<span style="color:${faction.color}">${faction.icon}</span> ` : ""}${escapeHtml(item.text)}<br>`;
            html += `Sector ${item.sectorId} | Value ${item.value} | Expires Day ${item.expiresDay}<br>`;
            html += `<button data-action="sellIntel" data-arg0="${item.id}" data-arg1="sda">Give to SDA</button>`;
            html += `<button data-action="sellIntel" data-arg0="${item.id}" data-arg1="vc">Give to VC</button>`;
            html += `<button data-action="sellIntel" data-arg0="${item.id}" data-arg1="traders">Sell to Traders Guild</button>`;
