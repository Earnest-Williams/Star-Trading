    function acceptFactionAsk(id) {
        id = parseInt(id, 10);
        ensureFactionState();
        const ask = player.factions.asks.find(item => item.id === id);
        if (!ask || ask.status !== "available") return;
        ask.status = "accepted";
        addFactionTrust(ask.factionId, 1, "accepted faction ask");
        log(`Accepted political ask: ${ask.title}.`);
        updateUI();
    }
    registerAction("acceptFactionAsk", acceptFactionAsk);

    function completeFactionAsk(id) {
        id = parseInt(id, 10);
        ensureFactionState();
        const ask = player.factions.asks.find(item => item.id === id);
        if (!ask || ask.status !== "accepted") return;
        if (ask.expiresDay < player.time.day) {
            ask.status = "expired";
            addFactionTrust(ask.factionId, -2, "missed faction ask");
            log(`Faction ask expired: ${ask.title}.`);
            updateUI();
            return;
        }
        if (!isFactionAskComplete(ask)) {
            log(`Ask is not complete yet: ${ask.text}`);
            return;
        }
        if (ask.type === "quiet_delivery" && (ask.progress || 0) < ask.amount && player.cargo[ask.commodity] >= ask.amount) {
            player.cargo[ask.commodity] -= ask.amount;
        }
        ask.status = "completed";
        player.credits += ask.rewardCredits || 0;
        applyPoliticalEffect({ factionId: ask.factionId, publicRep: ask.publicRep || 0, privateRep: ask.privateRep || 0, trust: ask.trust || 1, favors: ask.favors || 1, sectorId: ask.sectorId || player.currentSector, influence: ask.influence || 2, reason: "completed political ask", memoryKey: "reliableJobs" });
        if (ask.heatFactionId && ask.heat) addFactionHeat(ask.heatFactionId, ask.heat, "questionable political ask");
        if (ask.intel) addIntel(ask.intel);
        log(`Completed political ask: ${ask.title}. Reward: ${formatCredits(ask.rewardCredits || 0)} credits.`);
        updateUI();
    }
    registerAction("completeFactionAsk", completeFactionAsk);

    function isFactionAskComplete(ask) {
        if (ask.type === "ore_quota") return (ask.progress || 0) >= ask.amount;
        if (ask.type === "survey_patrol") return universe[ask.targetSector] && universe[ask.targetSector].surveyed;
        if (ask.type === "frontier_charter") return planets[ask.targetSector] && planets[ask.targetSector].owner === "Player";
        if (ask.type === "quiet_delivery") return player.currentSector === ask.targetSector && ((ask.progress || 0) >= ask.amount || player.cargo[ask.commodity] >= ask.amount);
        if (ask.type === "market_intel") return player.currentSector === ask.targetSector && universe[ask.targetSector] && universe[ask.targetSector].surveyed;
        return false;
    }

    function generateFactionAsks() {
        ensureFactionState();
        player.factions.asks = player.factions.asks.filter(a => a.expiresDay >= player.time.day && a.status !== "completed");
        let attempts = 0;
        while (player.factions.asks.filter(a => a.status === "available" || a.status === "accepted").length < 3 && attempts < 8) {
            attempts += 1;
            const ask = makeFactionAsk();
            if (ask) player.factions.asks.push(ask);
        }
    }

    function makeFactionAsk() {
        ensureFactionState();
        const type = FACTION_ASK_TYPES[Math.floor(Math.random() * FACTION_ASK_TYPES.length)];
        const id = player.factions.nextAskId++;
        const sectors = Object.keys(universe).map(Number).filter(id => id !== 1);
        const sectorId = sectors[Math.floor(Math.random() * sectors.length)];
        if (type === "ore_quota") {
            return { id, type: "ore_quota", factionId: "miners", title: "Protect the Ore Floor",
                text: `Mine 60 Ore before Day ${player.time.day + 5}. The guild wants enough independent supply to resist Helion price pressure.`,
                amount: 60, progress: 0, rewardCredits: 1400, publicRep: 3, trust: 2, favors: 1, sectorId, influence: 3,
                expiresDay: player.time.day + 5, status: "available" };
        }
        if (type === "survey_patrol") {
            const target = sectors.find(id => !universe[id].surveyed) || sectorId;
            return { id, type: "survey_patrol", factionId: "sda", title: "Patrol Survey Request",
                text: `Survey sector ${target}. SDA wants updated lane data before it assigns patrols.`,
                targetSector: target, rewardCredits: 1100, publicRep: 3, trust: 1, favors: 1, sectorId: target, influence: 3,
                expiresDay: player.time.day + 4, status: "available" };
        }
        if (type === "frontier_charter") {
            const targets = Object.keys(planets).map(Number).filter(id => !planets[id].owner);
            if (targets.length === 0) return null;
            const target = targets[Math.floor(Math.random() * targets.length)];
            return { id, type: "frontier_charter", factionId: "fu", title: "Frontier Charter",
                text: `Found a colony in sector ${target}. The Frontier Union wants a friendly settlement before corporate claims arrive.`,
                targetSector: target, rewardCredits: 2600, publicRep: 4, trust: 2, favors: 1, sectorId: target, influence: 6,
                expiresDay: player.time.day + 9, status: "available" };
        }
        if (type === "quiet_delivery") {
            const target = sectorId;
            return { id, type: "quiet_delivery", factionId: "vc", title: "Quiet Equipment Run",
                text: `Bring 10 Equipment to sector ${target}. The manifest is intentionally vague.`,
                targetSector: target, commodity: "eq", amount: 10, rewardCredits: 2200,
                privateRep: 5, trust: 2, favors: 1, heatFactionId: "sda", heat: 4, sectorId: target, influence: 4,
                intel: { type: "front", factionId: "vc", targetFactionId: "sda", sectorId: target, value: 35,
                    expiresDay: player.time.day + 10, text: `Rumor: sector ${target} is being used as a Cartel back-channel.` },
                expiresDay: player.time.day + 5, status: "available" };
        }
        const target = sectorId;
        return { id, type: "market_intel", factionId: "traders", title: "Market Intel Sweep",
            text: `Survey sector ${target} and report the route conditions to the Traders Guild.`,
            targetSector: target, rewardCredits: 1200, publicRep: 2, trust: 1, favors: 1, sectorId: target, influence: 2,
            expiresDay: player.time.day + 5, status: "available" };
    }

    function updateFactionAskProgress(type, amount) {
        ensureFactionState();
        player.factions.asks.forEach(ask => {
            if (ask.status !== "accepted") return;
            if (ask.type === type && typeof ask.progress === "number") {
                ask.progress = Math.min(ask.amount, ask.progress + amount);
            }
        });
    }

    function sellIntel(intelId, factionId) {
        ensureFactionState();
        const idx = player.factions.intel.findIndex(item => item.id === intelId);
        if (idx < 0 || !FACTIONS[factionId]) return;
        const item = player.factions.intel[idx];
        if (item.expiresDay < player.time.day) {
            player.factions.intel.splice(idx, 1);
            log("That intel has expired.");
            updateUI();
            return;
        }
        const reward = item.value * (factionId === "traders" ? 18 : 12);
        player.credits += reward;
        if (factionId === "vc") {
            addFactionRep("vc", 3, "intel sold quietly", "private");
            addFactionHeat("sda", 3, "suspicious intel traffic");
        } else {
            addFactionRep(factionId, 2, "intel provided", "public");
            addFactionTrust(factionId, 1, "useful intel");
        }
        if (item.targetFactionId && item.targetFactionId !== factionId) {
            recordFactionMemory(item.targetFactionId, "helpedEnemies", 1);
        }
        player.factions.intel.splice(idx, 1);
        log(`Intel sold for ${formatCredits(reward)} credits.`);
        updateUI();
    }
    registerAction("sellIntel", sellIntel);

    function joinGuild(guildId) {
        if (!FACTIONS[guildId] || FACTIONS[guildId].type !== "guild") return;
        if (getGuildTier(guildId) > 0) {
            log(`You are already a ${FACTIONS[guildId].name} ${GUILD_TIER_NAMES[getGuildTier(guildId)]}.`);
            return;
        }
        const req = GUILD_REQUIREMENTS[guildId];
        if (!hasGuildJoinAccess(guildId)) { log(req.note); return; }
        if (!canAffordGuildRequirement(guildId)) {
            log(`Joining ${FACTIONS[guildId].name} requires ${formatCredits(req.credits)} credits and cargo: ${describeCost(req.cargo || {})}.`);
            return;
        }
        if (!spendTime(60)) return;
        player.credits -= req.credits;
        removeCargo(req.cargo || {});
        player.factions.membership[guildId] = 1;
        applyPoliticalEffect({ factionId: guildId, publicRep: 25, trust: 4, favors: 1, sectorId: player.currentSector, influence: 2, reason: "guild membership accepted", memoryKey: "reliableJobs" });
        const affinity = FACTIONS[guildId].majorAffinity;
        if (affinity) addFactionRep(affinity, 5, `${FACTIONS[guildId].short} sponsorship`);
        if (guildId === "smugglers") {
            addFactionRep("vc", 10, "smuggler introduction", "private");
            addFactionHeat("sda", 4, "suspicious guild paperwork");
        }
        log(`Joined ${FACTIONS[guildId].name} as a Member.`);
        Notifications.show(`Joined ${FACTIONS[guildId].name}`, 2);
        updateUI();
    }
    registerAction("joinGuild", joinGuild);

    function promoteGuild(guildId) {
        if (!FACTIONS[guildId] || FACTIONS[guildId].type !== "guild") return;
        const tier = getGuildTier(guildId);
        if (tier <= 0) { log(`Join ${FACTIONS[guildId].name} first.`); return; }
        if (tier >= 3) { log(`You already hold the highest ${FACTIONS[guildId].name} rank.`); return; }
        const requiredRep = tier === 1 ? 120 : 320;
        const cost = tier === 1 ? 2500 : 7500;
        if (getFactionRep(guildId) < requiredRep || player.credits < cost) {
            log(`Promotion requires ${requiredRep} ${FACTIONS[guildId].short} rep and ${formatCredits(cost)} credits.`);
            return;
        }
        if (!spendTime(120)) return;
        player.credits -= cost;
        player.factions.membership[guildId] = tier + 1;
        applyPoliticalEffect({ factionId: guildId, publicRep: 15, trust: 3, favors: 1, sectorId: player.currentSector, influence: 3, reason: "guild promotion", memoryKey: "reliableJobs" });
        if (guildId === "smugglers") addFactionLeverage("vc", 2, "deeper syndicate membership");
        log(`Promoted within ${FACTIONS[guildId].name}: ${GUILD_TIER_NAMES[tier + 1]}.`);
        updateUI();
    }
    registerAction("promoteGuild", promoteGuild);

    // SAVE / LOAD

    function saveGame() {
        const data = {
            version: SAVE_VERSION, player, universe, ports, planets, missions,
            captains, captainEventLog, nextCaptainEventId,
            worldEvents, nextWorldEventId,
            tradeRoutes, nextTradeRouteId, nextMissionId,
            factionRelations: FACTION_RELATIONS
        };
        try {
            localStorage.setItem(SAVE_KEY, JSON.stringify(data));
            log("Game saved.");
            Notifications.show("Game saved", 1);
        } catch (e) {
            log("Save failed: " + e.message);
        }
    }
    registerAction("saveGame", saveGame);

    function loadGame() {
        const saved = localStorage.getItem(SAVE_KEY);
        if (!saved) { log("No saved game found."); return; }
        try {
            const data = JSON.parse(saved);
            if (!data || !data.player || !data.universe || !data.ports || !data.planets) {
                log("Save data is missing required fields.");
                return;
            }
            player = data.player;
            universe = data.universe;
            ports = data.ports;
            planets = data.planets;
            missions = Array.isArray(data.missions) ? data.missions : [];
            captains = data.captains || {};
            captainEventLog = Array.isArray(data.captainEventLog) ? data.captainEventLog : [];
            nextCaptainEventId = data.nextCaptainEventId || (captainEventLog.length + 1);
            worldEvents = Array.isArray(data.worldEvents) ? data.worldEvents : [];
            nextWorldEventId = data.nextWorldEventId || (worldEvents.length + 1);
            tradeRoutes = Array.isArray(data.tradeRoutes) ? data.tradeRoutes : [];
            nextTradeRouteId = data.nextTradeRouteId || (tradeRoutes.length + 1);
            nextMissionId = data.nextMissionId || (missions.length + 1);
            if (data.factionRelations) {
                Object.keys(data.factionRelations).forEach(a => {
                    if (!FACTION_RELATIONS[a]) return;
                    Object.keys(data.factionRelations[a]).forEach(b => {
                        if (typeof FACTION_RELATIONS[a][b] === "number") FACTION_RELATIONS[a][b] = data.factionRelations[a][b];
                    });
                });
            }
            normaliseLoadedGame();
            selectedSectorId = player.currentSector;
            currentScreen = "sector";
            log("Game loaded.");
            Notifications.show("Game loaded", 2);
            updateUI();
        } catch (err) {
            log("Could not load save data. The saved JSON appears to be invalid.");
        }
    }
    registerAction("loadGame", loadGame);

    function normaliseLoadedGame() {
        if (!player.time) player.time = { day: 1, minuteOfDay: BALANCE.DEFAULT_WAKE, wakeMinute: BALANCE.DEFAULT_WAKE, sleepMinute: BALANCE.DEFAULT_SLEEP };
        if (!player.ship) player.ship = createPlayer().ship;
        if (!player.cargo) player.cargo = { ore: 0, org: 0, eq: 0 };
        ensureFactionState();
        if (!player.factions.contacts) player.factions.contacts = createContactState();
        COMMODITIES.forEach(c => { if (typeof player.cargo[c] !== "number") player.cargo[c] = 0; });
        Object.values(universe).forEach(sector => {
            if (typeof sector.surveyed !== "boolean") sector.surveyed = false;
            if (typeof sector.pirateThreat !== "number") sector.pirateThreat = 0;
            normaliseSectorInfluence(sector);
            if (typeof sector.front === "undefined") sector.front = null;
            if (!sector.politicalMemory) {
                sector.politicalMemory = {
                    dominantFactionId: getDominantInfluence(sector.id),
                    status: getSectorStatusLabel(sector.id),
                    contestedDays: 0
                };
            }
            if (sector.front && typeof sector.front.suspicion !== "number") sector.front.suspicion = 10;
            if (sector.asteroids && typeof sector.asteroids.maxOre !== "number") sector.asteroids.maxOre = Math.max(sector.asteroids.ore, 2500);
        });
        Object.values(ports).forEach(port => {
            if (!port.factionId) port.factionId = PORT_TYPES[port.typeKey].factionId;
            if (!port.publicFactionId) port.publicFactionId = port.factionId;
            if (typeof port.hiddenFactionId === "undefined") port.hiddenFactionId = null;
        });
        Object.values(planets).forEach(planet => {
            if (!planet.stock) planet.stock = { ore: 0, org: 0, eq: 0 };
            if (!planet.shortages) planet.shortages = { ore: 0, org: 0, eq: 0 };
            if (typeof planet.satisfaction !== "number") planet.satisfaction = planet.owner ? 60 : 0;
            if (!planet.buildings) planet.buildings = { habitat: 0, mine: 0, farm: 0, factory: 0, defense: 0 };
            if (typeof planet.factionId === "undefined") planet.factionId = null;
            if (planet.owner === "Player" && !planet.policy) {
                planet.policy = { registration: "registered", economy: "free_trade", security: "local_militia", hiddenInfluence: { vc: 0 } };
            }
        });
        normaliseCaptains();
        normaliseTradeRoutes();
        if (!Array.isArray(worldEvents)) worldEvents = [];
        if (typeof nextWorldEventId !== "number") nextWorldEventId = worldEvents.length + 1;
        missions.forEach(m => {
            if (typeof m.rewardRep !== "number") m.rewardRep = 2;
            // BUGFIX: backfill operationMinutes
            if (m.type === "contest" && typeof m.operationMinutes !== "number") m.operationMinutes = 90;
            if (m.status === "available") prepareMissionOpportunity(m);
        });
        clampPlayerState();
    }

    // showScreen needs to be exposed for actions
    registerAction("showScreen", showScreen);
    registerAction("selectSector", function(id) { selectSector(parseInt(id, 10)); });

    function startGame() {
        player = createPlayer();
        generateStars();
        generateUniverse();
        selectedSectorId = player.currentSector;
        setupMapInteraction();

        // Wire up persistent buttons (no inline handlers)
        document.querySelectorAll(".topbar button").forEach(btn => {
            btn.addEventListener("click", () => showScreen(btn.dataset.screen));
        });
        document.getElementById("btn-rest").addEventListener("click", restUntilMorning);
        document.getElementById("btn-save").addEventListener("click", saveGame);
        document.getElementById("btn-load").addEventListener("click", loadGame);
        document.getElementById("btn-intel").addEventListener("click", () => showScreen("reputation"));

        // Single delegated click handler for all data-action buttons
        document.body.addEventListener("click", handleActionClick);

        log("Welcome, captain. The frontier now has autonomous captains competing, cooperating, joining factions, and reshaping the map without waiting for you.");
        log("Trade, mine, colonize, and run missions; every profitable action also shifts influence, heat, trust, favors, leverage, and social relationships.");
        log("Watch the priority feed (left panel) and notifications (top right) to see what needs your attention.");
        addWorldEvent({ type: "start", sectorId: player.currentSector, text: "The frontier simulation started.", importance: 2, alert: false });
        Notifications.show("Welcome to the frontier", 2);
        updateUI();
    }

    window.onload = startGame;
</script>
</body>
