<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solo Space Trader - Political Frontier Prototype</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
        :root {
            --bg: #001122;
            --panel: #002233;
            --panel-dark: #000811;
            --cyan: #00ffcc;
            --green: #00ff88;
            --amber: #ffaa00;
            --blue: #44aaff;
            --red: #ff4444;
            --muted: #77ccb8;
        }
        * { box-sizing: border-box; }
        body {
            background: var(--bg);
            color: var(--cyan);
            font-family: 'VT323', monospace;
            margin: 0;
            padding: 20px;
            line-height: 1.35;
            font-size: 20px;
        }
        h1 {
            margin: 0 0 14px;
            text-align: center;
            color: var(--green);
            text-shadow: 0 0 10px var(--green);
            letter-spacing: 3px;
        }
        h3, h4 { margin: 6px 0 10px; color: var(--green); }
        #game {
            max-width: 1280px;
            margin: auto;
            display: grid;
            grid-template-columns: 280px 1fr 330px;
            gap: 15px;
        }
        .panel {
            background: var(--panel);
            border: 3px solid var(--cyan);
            padding: 14px;
            box-shadow: 0 0 18px rgba(0, 255, 204, 0.55);
        }
        .subpanel {
            background: var(--panel-dark);
            border: 2px solid rgba(0, 255, 204, 0.7);
            padding: 10px;
            margin-top: 10px;
        }
        #map {
            width: 100%;
            height: 420px;
            background: var(--panel-dark);
            border: 3px solid var(--cyan);
        }
        button, input {
            background: #003344;
            color: var(--cyan);
            border: 2px solid var(--green);
            padding: 7px 10px;
            margin: 3px;
            font-family: inherit;
            font-size: 18px;
        }
        button { cursor: pointer; }
        button:hover { background: var(--green); color: var(--bg); }
        button:disabled { opacity: 0.45; cursor: not-allowed; }
        input { width: 100%; }
        .log {
            height: 210px;
            overflow-y: auto;
            background: var(--panel-dark);
            padding: 10px;
            margin-top: 10px;
            border: 2px solid rgba(0, 255, 204, 0.7);
        }
        .green { color: var(--green); }
        .red { color: var(--red); }
        .amber { color: var(--amber); }
        .blue { color: var(--blue); }
        .muted { color: var(--muted); }
        .small { font-size: 0.9em; }
        .faction-line { display: grid; grid-template-columns: 48px 1fr 54px; gap: 6px; align-items: center; margin: 3px 0; }
        .faction-bar { height: 9px; background: rgba(119, 204, 184, 0.24); border: 1px solid rgba(0, 255, 204, 0.45); }
        .faction-fill { height: 100%; width: 0%; background: var(--green); }
        .faction-title { margin-top: 8px; color: var(--green); }
        .faction-icon { display:inline-block; min-width: 18px; text-align:center; }
        .row { margin: 4px 0; }
        .commodity-row {
            border-top: 1px solid rgba(0, 255, 204, 0.25);
            padding-top: 6px;
            margin-top: 6px;
        }
        .mission {
            border-top: 1px solid rgba(0, 255, 204, 0.25);
            padding-top: 8px;
            margin-top: 8px;
        }
        .topbar {
            max-width: 1280px;
            margin: 0 auto 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            justify-content: center;
        }
        .topbar button, .tab-button {
            min-width: 118px;
        }
        .active-tab {
            background: var(--green) !important;
            color: var(--bg) !important;
            box-shadow: 0 0 12px rgba(0, 255, 136, 0.75);
        }
        .map-wrap { position: relative; }
        #map { cursor: crosshair; }
        #mapInspector {
            margin-top: 10px;
            min-height: 92px;
        }
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }
        .menu-grid button { width: 100%; margin: 0; }
        .nav-card {
            border-top: 1px solid rgba(0, 255, 204, 0.25);
            padding: 8px 0;
        }
        .nav-card button { width: calc(50% - 8px); }
        .screen-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 10px;
        }
        .screen-tabs button { margin: 0; }
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 10px;
        }
        .card {
            background: var(--panel-dark);
            border: 2px solid rgba(0, 255, 204, 0.55);
            padding: 10px;
        }
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 6px;
            margin-top: 8px;
        }
        .stat-pill {
            border: 1px solid rgba(0, 255, 204, 0.45);
            padding: 5px 7px;
            background: rgba(0, 8, 17, 0.65);
        }
        .sector-chip {
            display: inline-block;
            border: 1px solid rgba(0, 255, 204, 0.45);
            padding: 2px 7px;
            margin: 2px;
            background: rgba(0, 8, 17, 0.7);
        }
        .relationship-row {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr 1fr;
            gap: 8px;
            align-items: start;
            border-top: 1px solid rgba(0, 255, 204, 0.25);
            padding: 8px 0;
        }
        .compact-actions button { margin: 2px; }
        .captain-chip {
            display: inline-block;
            border: 1px solid rgba(255, 255, 255, 0.35);
            padding: 2px 7px;
            margin: 2px;
            background: rgba(0, 8, 17, 0.75);
        }
        .captain-card {
            background: rgba(0, 8, 17, 0.82);
            border: 2px solid rgba(255, 255, 255, 0.28);
            padding: 10px;
        }
        .timeline-entry {
            border-top: 1px solid rgba(0, 255, 204, 0.22);
            padding: 6px 0;
        }
        /* NEW: Notification feed */
        #notificationFeed {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 300px;
            max-height: 80vh;
            overflow-y: auto;
            z-index: 100;
            pointer-events: none;
        }
        .notification {
            background: var(--panel-dark);
            border: 2px solid var(--cyan);
            padding: 8px 10px;
            margin-bottom: 6px;
            box-shadow: 0 0 12px rgba(0, 255, 204, 0.4);
            font-size: 16px;
            pointer-events: auto;
            cursor: pointer;
            opacity: 1;
            transition: opacity 0.5s;
        }
        .notification.priority-3 { border-color: var(--amber); box-shadow: 0 0 12px rgba(255, 170, 0, 0.5); }
        .notification.priority-4 { border-color: var(--red); box-shadow: 0 0 14px rgba(255, 68, 68, 0.6); }
        .notification.fading { opacity: 0; }
        .notification .small { display: block; color: var(--muted); margin-top: 2px; }
        #priorityFeed {
            margin-top: 10px;
        }
        .priority-item {
            border-left: 3px solid var(--amber);
            padding: 4px 8px;
            margin: 4px 0;
            background: rgba(0, 8, 17, 0.5);
            cursor: pointer;
        }
        .priority-item:hover { background: rgba(0, 255, 204, 0.1); }
        .priority-item.urgent { border-left-color: var(--red); }
        @media (max-width: 1000px) {
            #game { grid-template-columns: 1fr; }
            #notificationFeed { display: none; }
        }
    </style>
</head>
<body>
    <h1>SOLO SPACE TRADER: LOGISTICS, CONVOYS & POLITICAL ECONOMY</h1>
    <div id="notificationFeed"></div>
    <div class="topbar panel">
        <button id="top-sector" data-screen="sector">Sector</button>
        <button id="top-market" data-screen="market">Market</button>
        <button id="top-colony" data-screen="colony">Colonies</button>
        <button id="top-missions" data-screen="missions">Missions</button>
        <button id="top-logistics" data-screen="logistics">Logistics</button>
        <button id="top-reputation" data-screen="reputation">Network</button>
        <button id="top-shipyard" data-screen="shipyard">Shipyard</button>
    </div>
    <div id="game">
        <div class="panel">
            <h3>Captain</h3>
            <div><strong>Ship:</strong> <span id="shipName"></span></div>
            <div>Credits: <span id="credits" class="green"></span></div>
            <div>Day/Time: <span id="dayTime" class="green"></span></div>
            <div>Sector: <span id="sectorNum"></span> (<span id="sectorName"></span>)</div>
            <hr>
            <div>Cargo: <span id="cargoSummary"></span></div>
            <div>Holds: <span id="holds" class="green"></span></div>
            <div>Fighters: <span id="fighters"></span></div>
            <div>Shields: <span id="shields"></span></div>
            <div>Hull: <span id="hull"></span></div>
            <div id="factionPanel" class="subpanel"></div>
            <hr>
            <div class="menu-grid">
                <button id="btn-rest">Rest</button>
                <button id="btn-save">Save</button>
                <button id="btn-load">Load</button>
                <button id="btn-intel">Intel</button>
            </div>
            <div id="planetInfo" class="subpanel" style="display:none"></div>
            <div id="priorityFeed" class="subpanel">
                <strong>Attention</strong>
                <div id="priorityList"></div>
            </div>
        </div>

        <div>
            <div class="map-wrap">
                <canvas id="map" width="700" height="420"></canvas>
                <div id="mapInspector" class="subpanel"></div>
            </div>
            <div class="panel" style="margin-top:10px">
                <h3 id="screenTitle">Current Sector <span id="curSector"></span></h3>
                <div id="sectorContents"></div>
                <div id="actions" class="subpanel"></div>
            </div>
            <div class="log" id="log"></div>
        </div>

        <div class="panel">
            <h3>Navigation</h3>
            <div id="commandList" class="subpanel"></div>
            <h3>Accepted Missions</h3>
            <div id="acceptedMissions" class="subpanel"></div>
        </div>
    </div>

    <script>
        // =====================================================
        // CENTRALIZED TUNING CONSTANTS
        // All gameplay magic numbers live here so balancing
        // doesn't require grepping the entire file.
        // =====================================================
        const BALANCE = {
            // Time
            DAY_MINUTES: 24 * 60,
            DEFAULT_WAKE: 8 * 60,
            DEFAULT_SLEEP: 24 * 60,

            // Captains
            CAPTAIN_HOURLY_ACTION_CHANCE: 0.045,
            CAPTAIN_MISSION_INTEREST_THRESHOLD: 28,
            CAPTAIN_MISSION_TAKE_THRESHOLD: 55,

            // Trade
            TRADE_BATCH: 10,
            MIN_TRADE_PRICE: 5, // floor to prevent exploit loops
            TRADE_TIME_MINUTES: 30,

            // Routes
            TRADE_ROUTE_BASE_COST: 1200,
            TRADE_ROUTE_INTERVAL_DAYS: 1,
            TRADE_ROUTE_BASE_AMOUNT: 12,

            // Politics
            FRONT_EXPOSURE_THRESHOLD: 88,
            FACTION_EXPANSION_MIN_INFLUENCE: 68,
            POLITICAL_INTEL_BASE_CHANCE: 0.06,
            POLITICAL_MISSION_LIMIT: 14,
            CONTESTED_GAP: 8,

            // World
            WORLD_EVENT_LIMIT: 90,
            NOTIFICATION_LIFETIME_MS: 8000,
            MAX_NOTIFICATIONS: 5,
            PRIORITY_FEED_LIMIT: 8,

            // Sector
            SECTOR_COUNT: 30,

            // Price modifiers
            PRICE: {
                REP_DIVISOR: 3000,
                PRIVATE_DIVISOR: 7000,
                TRUST_DIVISOR: 2500,
                HEAT_DIVISOR: 1800,
                INFLUENCE_DIVISOR: 2500,
                TRADER_GUILD_BONUS: 0.025,
                AFFINITY_GUILD_BONUS: 0.015,
                MAX_BONUS: 0.35,
                MAX_PENALTY: 0.25,
                MIN_MULT: 0.68,
                MAX_MULT: 1.40
            },

            // Combat
            FIGHTER_COST: 80,
            REPAIR_SHIELD_COST: 2,
            REPAIR_HULL_COST: 35,
        };

        const SAVE_VERSION = 9;
        const SAVE_KEY = "soloSpaceTraderSaveV6";
        const COMMODITIES = ["ore", "org", "eq"];
        const COMMODITY_NAMES = { ore: "Ore", org: "Organics", eq: "Equipment" };
        const DEBUG_MODE = true;

        // =====================================================
        // EVENT BUS & RENDER SCHEDULER
        // Replaces the "mutate global + call updateUI() everywhere"
        // pattern with batched, deduplicated rendering.
        // =====================================================
        const EventBus = (function() {
            const listeners = {};
            return {
                on(event, fn) {
                    if (!listeners[event]) listeners[event] = [];
                    listeners[event].push(fn);
                },
                emit(event, payload) {
                    if (!listeners[event]) return;
                    listeners[event].forEach(fn => {
                        try { fn(payload); } catch (e) { console.error(`Listener for ${event} failed:`, e); }
                    });
                }
            };
        })();

        const Renderer = (function() {
            let dirty = new Set();
            let scheduled = false;
            const handlers = {};

            function flush() {
                scheduled = false;
                const toRender = Array.from(dirty);
                dirty.clear();
                toRender.forEach(key => {
                    if (handlers[key]) {
                        try { handlers[key](); } catch (e) { console.error(`Render ${key} failed:`, e); }
                    }
                });
            }

            return {
                register(key, fn) { handlers[key] = fn; },
                invalidate(key) {
                    dirty.add(key);
                    if (!scheduled) {
                        scheduled = true;
                        requestAnimationFrame(flush);
                    }
                },
                invalidateAll() {
                    Object.keys(handlers).forEach(k => dirty.add(k));
                    if (!scheduled) {
                        scheduled = true;
                        requestAnimationFrame(flush);
                    }
                }
            };
        })();

        // =====================================================
        // NOTIFICATION SYSTEM
        // Surfaces what needs attention; the world news ledger
        // is for browsing history, this is for "now".
        // =====================================================
        const Notifications = (function() {
            const active = [];
            let nextId = 1;

            function show(text, priority = 1, action = null) {
                const id = nextId++;
                const feed = document.getElementById("notificationFeed");
                if (!feed) return;
                const el = document.createElement("div");
                el.className = `notification priority-${priority}`;
                el.dataset.id = id;
                el.textContent = text;
                if (action) {
                    el.addEventListener("click", () => { action(); dismiss(id); });
                } else {
                    el.addEventListener("click", () => dismiss(id));
                }
                feed.appendChild(el);
                active.push({ id, el, priority });
                while (active.length > BALANCE.MAX_NOTIFICATIONS) {
                    const old = active.shift();
                    if (old.el.parentNode) old.el.parentNode.removeChild(old.el);
                }
                const lifetime = priority >= 3 ? BALANCE.NOTIFICATION_LIFETIME_MS * 1.5 : BALANCE.NOTIFICATION_LIFETIME_MS;
                setTimeout(() => {
                    el.classList.add("fading");
                    setTimeout(() => dismiss(id), 500);
                }, lifetime);
            }

            function dismiss(id) {
                const idx = active.findIndex(n => n.id === id);
                if (idx < 0) return;
                const n = active[idx];
                if (n.el.parentNode) n.el.parentNode.removeChild(n.el);
                active.splice(idx, 1);
            }

            return { show };
        })();

        // =====================================================
        // PRIORITY FEED
        // What the player should pay attention to right now.
        // =====================================================
        function getPriorityItems() {
            const items = [];
            // Accepted missions about to expire
            missions.filter(m => m.status === "accepted").forEach(m => {
                const daysLeft = m.expiresDay - player.time.day;
                if (daysLeft <= 1) {
                    items.push({
                        text: `${m.title} expires ${daysLeft <= 0 ? "today" : "tomorrow"}`,
                        urgent: daysLeft <= 0,
                        action: () => showScreen("missions"),
                        priority: 10 - daysLeft
                    });
                }
            });
            // Colony shortages
            Object.entries(planets).forEach(([sid, planet]) => {
                if (planet.owner !== "Player") return;
                if (planet.satisfaction < 40) {
                    items.push({
                        text: `Colony S${sid} satisfaction critical: ${planet.satisfaction}`,
                        urgent: planet.satisfaction < 25,
                        action: () => { player.currentSector = parseInt(sid, 10); showScreen("colony"); },
                        priority: 9
                    });
                }
            });
            // Failed routes
            tradeRoutes.filter(r => r.status === "active" && r.failures > r.runs * 0.4 && r.runs >= 3).forEach(r => {
                items.push({
                    text: `Route "${r.name}" failing: ${r.failures}/${r.runs + r.failures}`,
                    urgent: false,
                    action: () => showScreen("logistics"),
                    priority: 5
                });
            });
            // Active faction asks
            ensureFactionState();
            player.factions.asks.filter(a => a.status === "accepted" && a.expiresDay - player.time.day <= 1).forEach(a => {
                items.push({
                    text: `Ask "${a.title}" expires soon`,
                    urgent: a.expiresDay <= player.time.day,
                    action: () => { setReputationTab("asks"); },
                    priority: 8
                });
            });
            // High heat
            if (getFactionHeat("sda") >= 60) {
                items.push({
                    text: `SDA heat ${getFactionHeat("sda")} — inspections likely`,
                    urgent: getFactionHeat("sda") >= 80,
                    action: () => setReputationTab("factions"),
                    priority: 7
                });
            }
            // Low hull
            if (player.hull < player.ship.maxHull * 0.3) {
                items.push({
                    text: `Hull damaged: ${player.hull}/${player.ship.maxHull}`,
                    urgent: player.hull < player.ship.maxHull * 0.15,
                    action: () => { if (player.currentSector === 1) showScreen("shipyard"); else log("Return to StarDock for repairs."); },
                    priority: 9
                });
            }
            // Pirates in current sector
            const sec = universe[player.currentSector];
            if (sec && sec.pirateThreat >= 3) {
                items.push({
                    text: `Pirate threat ${sec.pirateThreat} in current sector`,
                    urgent: sec.pirateThreat >= 5,
                    action: () => showScreen("sector"),
                    priority: 6
                });
            }
            return items.sort((a, b) => b.priority - a.priority).slice(0, BALANCE.PRIORITY_FEED_LIMIT);
        }

        const FACTIONS = {
            sda: { id: "sda", type: "major", name: "StarDock Authority", short: "SDA", color: "#44aaff", icon: "★", description: "Core government enforcing law, traffic control, and StarDock access.", startingRep: 25 },
            fu: { id: "fu", type: "major", name: "Frontier Union", short: "FU", color: "#00ff88", icon: "☼", description: "Loose coalition of settlers, free ports, and frontier colonies.", startingRep: 15 },
            hc: { id: "hc", type: "major", name: "Helion Combine", short: "HC", color: "#ffaa00", icon: "⚒", description: "Industrial combines, ore processors, and hard-edged resource firms.", startingRep: 0 },
            vc: { id: "vc", type: "major", name: "Void Cartel", short: "VC", color: "#ff4444", icon: "☠", description: "Smugglers, protection rackets, and outlaw logistics networks.", startingRep: -20 },
            miners: { id: "miners", type: "guild", name: "Miners Guild", short: "MNG", color: "#ffaa00", icon: "⛏", description: "Hard-bitten asteroid prospectors with Helion Combine ties.", startingRep: 0, majorAffinity: "hc" },
            traders: { id: "traders", type: "guild", name: "Traders Guild", short: "TRD", color: "#00ffcc", icon: "¤", description: "Independent haulers, brokers, and market scouts.", startingRep: 0, majorAffinity: "fu" },
            colonists: { id: "colonists", type: "guild", name: "Colonists League", short: "COL", color: "#00ff88", icon: "⌂", description: "Settlement advocates and frontier mutual-aid networks.", startingRep: 0, majorAffinity: "fu" },
            smugglers: { id: "smugglers", type: "guild", name: "Smugglers Syndicate", short: "SMG", color: "#cc66ff", icon: "◆", description: "Quiet-route specialists and off-ledger freight brokers.", startingRep: 0, majorAffinity: "vc" }
        };

        const FACTION_RELATIONS = {
            sda: { fu: 30, hc: 10, vc: -80 },
            fu: { sda: 30, hc: -10, vc: -40 },
            hc: { sda: 10, fu: -10, vc: -60 },
            vc: { sda: -80, fu: -40, hc: -60 }
        };

        const FACTION_INTERESTS = {
            sda: { wants: "stable lanes, registered colonies, taxes, low piracy", dislikes: "smuggling, hidden ports, unregistered settlements", law: "Inspections and patrols rise where SDA influence is high." },
            fu: { wants: "autonomous colonies, frontier supply, local militias", dislikes: "corporate dependency and abandoned settlements", law: "Colonies grow faster where Frontier influence is high." },
            hc: { wants: "ore, equipment, fuel, industrial throughput", dislikes: "supply disruption and miner unrest", law: "Mining and factory production improve where Helion influence is high." },
            vc: { wants: "shadow markets, weak patrols, leverage, hidden routes", dislikes: "cargo scans and reliable state control", law: "Black-market opportunity rises where Cartel influence is high." },
            miners: { wants: "recognized claims, ore price floors, safer extraction", dislikes: "claim jumping and corporate underpayment", law: "Guild charters improve mining but can pull politics toward Helion." },
            traders: { wants: "route stability, market intel, bulk contracts", dislikes: "blockades, price shocks, unstable ports", law: "Guild members get better market terms and route information." },
            colonists: { wants: "population growth, food security, settlement autonomy", dislikes: "abandoned colonies and unsafe migration routes", law: "League charters improve growth and colony output." },
            smugglers: { wants: "quiet lanes, forged manifests, informal port access", dislikes: "scanners, audits, patrol schedules", law: "Syndicate ties reduce some pirate risk but raise official heat." }
        };

        const INFLUENCE_BASES = {
            Core: { sda: 58, fu: 18, hc: 14, vc: 6 },
            Frontier: { sda: 18, fu: 46, hc: 18, vc: 12 },
            Badlands: { sda: 6, fu: 16, hc: 28, vc: 36 }
        };

        const FACTION_ASK_TYPES = ["ore_quota", "survey_patrol", "frontier_charter", "quiet_delivery", "market_intel"];
        const MAJOR_FACTIONS = Object.keys(FACTIONS).filter(id => FACTIONS[id].type === "major");
        const GUILD_FACTIONS = Object.keys(FACTIONS).filter(id => FACTIONS[id].type === "guild");
        const GUILD_TIER_NAMES = ["None", "Member", "Officer", "Leader"];

        const GUILD_REQUIREMENTS = {
            miners: { credits: 500, cargo: { ore: 30 }, allowedPortTypes: ["mining", "refinery"], note: "Join at a mining or refinery port." },
            traders: { credits: 750, cargo: {}, allowedPortTypes: ["consumer", "stardock"], note: "Join at StarDock or a consumer hub." },
            colonists: { credits: 500, cargo: { org: 20 }, allowedPortTypes: ["agricultural"], allowsPlayerColony: true, note: "Join at an agricultural port or your own colony." },
            smugglers: { credits: 900, cargo: { eq: 10 }, allowedRegions: ["Badlands"], note: "Join from a Badlands sector." }
        };

        const PORT_TYPES = {
            stardock: { name: "StarDock Services", factionId: "sda", sells: [], buys: [], description: "Shipyard, repairs, upgrades, and mission brokerage." },
            mining: { name: "Mining Outpost", factionId: "hc", sells: ["ore"], buys: ["org", "eq"], description: "Exports ore and imports supplies." },
            agricultural: { name: "Agricultural Station", factionId: "fu", sells: ["org"], buys: ["ore", "eq"], description: "Exports organics and imports machinery." },
            industrial: { name: "Industrial Port", factionId: "hc", sells: ["eq"], buys: ["ore", "org"], description: "Exports equipment and imports raw materials." },
            consumer: { name: "Consumer Hub", factionId: "fu", sells: [], buys: ["ore", "org", "eq"], description: "Pays for almost anything the frontier needs." },
            refinery: { name: "Refinery", factionId: "hc", sells: ["eq"], buys: ["ore"], description: "Turns ore into high-value industrial goods." }
        };

        function createFactionState() {
            const reputation = {}, publicRep = {}, privateRep = {}, trust = {}, leverage = {}, heat = {}, favors = {}, membership = {}, memory = {};
            Object.keys(FACTIONS).forEach(id => {
                const start = FACTIONS[id].startingRep || 0;

                    relationship: contact.startingRelation || 0,
                    trust: contact.knownAtStart ? 2 : 0,

        function createCaptains() {

            Object.values(CAPTAIN_DEFS).forEach(def => {
                const captain = JSON.parse(JSON.stringify(def));
                captain.known = Boolean(def.knownAtStart);
                captain.status = "active";
                captain.currentPlan = null;
                captain.history = [];
                captain.relationshipToPlayer = {
                    opinion: def.knownAtStart ? 5 : 0,
                    trust: def.knownAtStart ? 2 : 0,
                    rivalry: 0, debt: 0, leverage: 0
                };
                captain.relations = {};
                captains[def.id] = captain;
            });
            // Second pass: build complete relations matrix (BUGFIX: ensures bilateral entries)
            allIds.forEach(idA => {
                allIds.forEach(idB => {
                    if (idA === idB) return;
                    const a = captains[idA], b = captains[idB];
                    const factionAffinity = a.preferredFaction === b.preferredFaction ? 10 : 0;
                    const outlawFriction = (a.archetype === "pirate" || b.archetype === "pirate") ? -12 : 0;
                    a.relations[idB] = {
                        opinion: factionAffinity + outlawFriction + Math.floor(Math.random() * 11) - 5,
                        trust: Math.max(0, factionAffinity / 2),
                        rivalry: outlawFriction < 0 ? 8 : 0,
                        debt: 0
                    };
                });
            });
        }

        function ensureCaptainRelation(captainA, captainBId) {
            if (!captainA.relations) captainA.relations = {};
            if (!captainA.relations[captainBId]) {
                captainA.relations[captainBId] = { opinion: 0, trust: 0, rivalry: 0, debt: 0 };
            }
            return captainA.relations[captainBId];
        }

        function normaliseCaptains() {
            if (!captains || Object.keys(captains).length === 0) createCaptains();
            const allIds = Object.keys(captains);
            Object.values(captains).forEach(captain => {
                if (!captain.relationshipToPlayer) captain.relationshipToPlayer = { opinion: 0, trust: 0, rivalry: 0, debt: 0, leverage: 0 };
                if (!captain.history) captain.history = [];
                if (!captain.relations) captain.relations = {};
                // BUGFIX: Ensure all captain pairs have relation entries
                allIds.forEach(otherId => {
                    if (otherId !== captain.id) ensureCaptainRelation(captain, otherId);
                });
                if (!captain.memberships) captain.memberships = {};
                if (!captain.factionStanding) captain.factionStanding = {};
                if (!captain.cargo) captain.cargo = { ore: 0, org: 0, eq: 0 };
                if (!captain.status) captain.status = "active";
            });

            if (score >= 70) return "Close Ally";
            if (score >= 35) return "Friendly";
            if (score >= 10) return "Cordial";
            if (score >= -15) return "Neutral";
            if (score >= -45) return "Rival";
            return "Enemy";
        }

        function addCaptainHistory(captain, text, important = false) {
            const entry = { day: player.time ? player.time.day : 1, text, important };
            captain.history.unshift(entry);
            captain.history = captain.history.slice(0, 12);

            if (important) {
                Notifications.show(`${captain.name}: ${text}`, captain.currentSector === player.currentSector ? 3 : 2);
            }
        }

        function nudgeCaptainRelation(captainId, deltas, reason) {
            const captain = getCaptain(captainId);
            if (!captain) return;
            const rel = captain.relationshipToPlayer;
            rel.opinion = clampRange((rel.opinion || 0) + (deltas.opinion || 0), -100, 100);
            rel.trust = clampRange((rel.trust || 0) + (deltas.trust || 0), -100, 100);
            rel.rivalry = clampRange((rel.rivalry || 0) + (deltas.rivalry || 0), 0, 100);
            rel.debt = clampRange((rel.debt || 0) + (deltas.debt || 0), -20, 20);
            rel.leverage = clampRange((rel.leverage || 0) + (deltas.leverage || 0), 0, 100);
            captain.known = true;
            if (reason) addCaptainHistory(captain, reason, Math.abs(deltas.opinion || 0) + Math.abs(deltas.rivalry || 0) >= 8);
            EventBus.emit("captain_changed", { captainId });
        }

        function nudgeCaptainFaction(captain, factionId, amount) {
            if (!FACTIONS[factionId] || !captain) return;
            captain.factionStanding[factionId] = clampRange((captain.factionStanding[factionId] || 0) + amount, -500, 1000);

            const faction = FACTIONS[factionId];
            if (!faction) return factionId;
            return faction.majorAffinity || factionId;
        }

        function getCaptainDominantFaction(captain) {
            let bestId = captain.preferredFaction || "traders";
            let best = -Infinity;
            Object.entries(captain.factionStanding || {}).forEach(([id, value]) => {
                if (!FACTIONS[id]) return;
                const adjusted = value + (captain.memberships && captain.memberships[id] ? 35 : 0);
                if (adjusted > best) { best = adjusted; bestId = id; }
            });
            return bestId;
        }

        function captainDistanceScore(fromSector, toSector) {
            if (fromSector === toSector) return 0;
            if (universe[fromSector] && universe[fromSector].warps.includes(toSector)) return 1;
            return Math.min(9, Math.abs(fromSector - toSector));
        }

        function captainMissionScore(captain, mission) {
            if (!mission || mission.status !== "available") return -9999;
            const distance = captainDistanceScore(captain.currentSector, mission.originSector);
            if (distance > 3 && Math.random() < 0.75) return -9999;
            let score = mission.rewardCredits / 220 - distance * 14;
            const standing = captain.factionStanding[mission.factionId] || 0;
            score += standing / 9;
            if (mission.type === "delivery" && ["trader", "industrialist", "smuggler"].includes(captain.archetype)) score += 35;
            if (mission.type === "mining" && captain.archetype === "miner") score += 55;
            if (mission.type === "survey" && ["fixer", "miner", "trader"].includes(captain.archetype)) score += 22;
            if (mission.type === "colony" && captain.archetype === "colonist") score += 60;
            if (mission.type === "contest") {
                const sponsorPole = getFactionPoliticalPole(mission.factionId);
                const captainPole = getFactionPoliticalPole(captain.preferredFaction);
                if (sponsorPole === captainPole || mission.factionId === captain.preferredFaction) score += 42;
                if (mission.factionId === "sda" && captain.archetype === "mercenary") score += 30;
                if (mission.factionId === "vc" && captain.archetype === "smuggler") score += 30;
                if (mission.factionId === "hc" && ["miner", "industrialist"].includes(captain.archetype)) score += 30;
                if (mission.factionId === "fu" && ["colonist", "trader", "fixer"].includes(captain.archetype)) score += 25;
            }
            if (mission.factionId === "vc" || mission.factionId === "smugglers") score += (captain.ethics.smuggling || 0) / 3;
            const destination = mission.destinationSector || mission.targetSector || mission.originSector;
            const danger = universe[destination] ? universe[destination].pirateThreat || 0 : 0;
            score -= danger * (18 - captain.riskTolerance * 18);
            return score;
        }

        function missionCandidateCaptains(mission) {
            normaliseCaptains();
            return Object.values(captains)
                .filter(c => c.status === "active")
                .map(c => ({ id: c.id, score: captainMissionScore(c, mission) }))
                .filter(item => item.score > BALANCE.CAPTAIN_MISSION_INTEREST_THRESHOLD)
                .sort((a, b) => b.score - a.score)
                .slice(0, 3)
                .map(item => item.id);
        }

        function prepareMissionOpportunity(mission) {
            mission.kind = mission.kind || "opportunity";
            mission.candidates = missionCandidateCaptains(mission);
            mission.visibility = mission.visibility || (mission.factionId === "vc" || mission.factionId === "smugglers" ? "quiet" : "public");
            mission.risk = mission.risk || (mission.visibility === "quiet" ? "inspection" : "normal");
            return mission;
        }

            const candidates = missions
                .filter(m => m.status === "available" && m.expiresDay >= player.time.day)

                .filter(item => item.score > BALANCE.CAPTAIN_MISSION_TAKE_THRESHOLD)
                .sort((a, b) => b.score - a.score);
            if (candidates.length === 0) return null;
            if (Math.random() > 0.62 && candidates[0].score < 95) return null;
            return candidates[0].mission;

        function startCaptainMission(captain, mission) {
            mission.status = "captain_taken";
            mission.takenBy = captain.id;
            const target = mission.destinationSector || mission.targetSector || mission.originSector;
            const distance = captainDistanceScore(captain.currentSector, target);
            const duration = Math.max(1, Math.min(4, 1 + Math.ceil(distance / 3) + Math.floor(Math.random() * 2)));
            mission.completionDay = player.time.day + duration;
            captain.currentPlan = { type: "mission", missionId: mission.id, completionDay: mission.completionDay, targetSector: target };
            captain.currentSector = mission.originSector;
            captain.known = captain.known || mission.originSector === player.currentSector;
            const playerWasCandidate = mission.candidates && mission.candidates.includes("player");
            addWorldEvent({
                type: "mission_taken", captainId: captain.id, factionId: mission.factionId, sectorId: mission.originSector,

            captain.currentSector = target;
