                ports[target].stock[mission.commodity] = Math.min(ports[target].maxStock[mission.commodity], ports[target].stock[mission.commodity] + mission.amount);
            }
            if (mission.type === "survey" && universe[mission.targetSector]) universe[mission.targetSector].surveyed = true;
            if (mission.type === "colony" && planets[mission.targetSector] && !planets[mission.targetSector].owner) {
                planets[mission.targetSector].owner = captain.name;
                planets[mission.targetSector].factionId = captain.preferredFaction;
                planets[mission.targetSector].colonists = 80 + Math.floor(Math.random() * 80);
                planets[mission.targetSector].buildings.habitat = 1;
                addSectorInfluence(mission.targetSector, getFactionPoliticalPole(captain.preferredFaction), 4, "captain-backed colony founded");
            }
            if (mission.type === "contest") applyContestMissionOutcome(mission, "captain", captain);
            mission.status = "completed_by_captain";
            captain.currentPlan = null;
            const playerWasCandidate = mission.candidates && mission.candidates.includes("player");
            addWorldEvent({
                type: "mission_completed", captainId: captain.id, factionId: mission.factionId, sectorId: target,
                text: `${captain.name} completed ${mission.title}; influence shifted in sector ${target}.`,
                importance: playerWasCandidate ? 3 : 2, alert: playerWasCandidate
            });
            addCaptainHistory(captain, `completed ${mission.title}.`, captain.known);
            if (playerWasCandidate) {
                Notifications.show(`${captain.name} beat you to: ${mission.title}`, 3);
                log(`${captain.name} beat you to an open opportunity: ${mission.title}.`);
            }
        }

        function moveCaptainTowardInterestingSector(captain) {
            const sector = universe[captain.currentSector];
            if (!sector || sector.warps.length === 0) return;
            let best = sector.warps[Math.floor(Math.random() * sector.warps.length)];
            let bestScore = -999;
            sector.warps.forEach(id => {
                const s = universe[id];
                let score = Math.random() * 10;
                if (ports[id] && ["trader", "industrialist", "fixer", "smuggler"].includes(captain.archetype)) score += 20;
                if (s.asteroids && captain.archetype === "miner") score += 30;
                if (planets[id] && captain.archetype === "colonist") score += 24;
                if (s.pirateThreat > 0 && captain.archetype === "mercenary") score += 35;
                if (s.pirateThreat > 0 && ["trader", "colonist"].includes(captain.archetype)) score -= 25;
                const dominant = getDominantInfluence(id);
                if (dominant === captain.preferredFaction || getFactionPoliticalPole(captain.preferredFaction) === dominant) score += 12;
                if (score > bestScore) { bestScore = score; best = id; }
            });
            captain.currentSector = best;
            if (best === player.currentSector) {
                captain.known = true;
                addCaptainHistory(captain, "arrived in your sector.", false);
            }
        }

        function captainTrade(captain) {
            const port = ports[captain.currentSector];
            if (!port) return false;
            const type = PORT_TYPES[port.typeKey];
            const factionId = port.factionId || type.factionId;
            let commodity = null;
            if (type.buys.length > 0) commodity = type.buys[Math.floor(Math.random() * type.buys.length)];
            else if (type.sells.length > 0) commodity = type.sells[Math.floor(Math.random() * type.sells.length)];
            if (!commodity) return false;
            const amount = 5 + Math.floor(Math.random() * 16);
            if (type.buys.includes(commodity)) port.stock[commodity] = Math.min(port.maxStock[commodity], port.stock[commodity] + amount);
            if (type.sells.includes(commodity)) port.stock[commodity] = Math.max(0, port.stock[commodity] - amount);
            captain.credits += Math.floor(amount * (port.basePrices[commodity] || 100) * 0.12);
            nudgeCaptainFaction(captain, factionId, 1);
            addSectorInfluence(captain.currentSector, factionId, 1, "captain trade volume");
            if (captain.currentSector === player.currentSector) addCaptainHistory(captain, `worked the ${type.name} market.`, false);
            return true;
        }

        function captainMine(captain) {
            const sector = universe[captain.currentSector];
            if (!sector || !sector.asteroids || sector.asteroids.ore <= 0) return false;
            const amount = Math.min(sector.asteroids.ore, Math.floor((captain.ship.miningRating || 10) * (0.6 + Math.random() * 0.8) * sector.asteroids.richness));
            sector.asteroids.ore -= amount;
            captain.cargo.ore = Math.min(captain.ship.cargoCapacity, (captain.cargo.ore || 0) + amount);
            nudgeCaptainFaction(captain, "miners", 2);
            nudgeCaptainFaction(captain, "hc", 1);
            addSectorInfluence(captain.currentSector, "hc", 1, "captain mining activity");
            if (captain.currentSector === player.currentSector) addCaptainHistory(captain, `mined ${amount} ore from the local field.`, false);
            return true;
        }

        function captainSmuggle(captain) {
            const sector = universe[captain.currentSector];
            if (!sector) return false;
            addSectorInfluence(sector.id, "vc", 2, "quiet captain traffic");
            if (ports[sector.id] && Math.random() < 0.25) ports[sector.id].hiddenFactionId = "vc";
            nudgeCaptainFaction(captain, "vc", 2);
            if (Math.random() < 0.30) sector.pirateThreat = Math.min(6, sector.pirateThreat + 1);
            if (sector.id === player.currentSector) addCaptainHistory(captain, "made a suspiciously quiet cargo exchange.", false);
            return true;
        }

        function captainFightPirates(captain) {
            const sector = universe[captain.currentSector];
            if (!sector || sector.pirateThreat <= 0) return false;
            sector.pirateThreat = Math.max(0, sector.pirateThreat - 1);
            nudgeCaptainFaction(captain, "sda", 2);
            addSectorInfluence(sector.id, "sda", 2, "captain security work");
            if (sector.id === player.currentSector) addCaptainHistory(captain, "cleared pirate pressure before you could cash the bounty.", true);
            return true;
        }

        function captainSupportColony(captain) {
            const planet = planets[captain.currentSector];
            if (!planet) return false;
            if (!planet.owner && captain.archetype === "colonist" && Math.random() < 0.18) {
                planet.owner = captain.name;
                planet.factionId = captain.preferredFaction;
                planet.colonists = 75 + Math.floor(Math.random() * 100);
                planet.buildings.habitat = 1;
                addSectorInfluence(captain.currentSector, "fu", 4, "captain-founded settlement");
                addCaptainHistory(captain, `founded a small settlement in sector ${captain.currentSector}.`, true);
                return true;
            }
            if (planet.owner) {
                planet.stock.org += 5 + Math.floor(Math.random() * 12);
                addSectorInfluence(captain.currentSector, "fu", 1, "captain colony relief");
                if (captain.currentSector === player.currentSector) addCaptainHistory(captain, "delivered relief supplies to the colony.", false);
                return true;
            }
            return false;
        }

        function captainPirateRaid(captain) {
            const sector = universe[captain.currentSector];
            if (!sector) return false;
            sector.pirateThreat = Math.min(6, sector.pirateThreat + 1);
            addSectorInfluence(sector.id, "vc", 3, "pirate captain raid");
            nudgeCaptainFaction(captain, "vc", 2);
            const localTraders = getCaptainsInSector(sector.id, false).filter(other => other.id !== captain.id && ["trader", "colonist", "industrialist"].includes(other.archetype));
            localTraders.forEach(other => {
                // BUGFIX: ensure relations exist before mutating
                const aRel = ensureCaptainRelation(captain, other.id);
                const bRel = ensureCaptainRelation(other, captain.id);
                aRel.rivalry = clampRange((aRel.rivalry || 0) + 8, 0, 100);
                bRel.rivalry = clampRange((bRel.rivalry || 0) + 10, 0, 100);
                addCaptainHistory(other, `${captain.name} hit traffic near their route.`, other.known);
            });
            if (sector.id === player.currentSector) addCaptainHistory(captain, "raided the lane while you were nearby.", true);
            return true;
        }

        function maybeCaptainJoinOrLeaveGuild(captain) {
            const guild = captain.preferredFaction;
            if (!FACTIONS[guild] || FACTIONS[guild].type !== "guild") return;
            const standing = captain.factionStanding[guild] || 0;
            if (!captain.memberships[guild] && standing > 110 && Math.random() < 0.18) {
                captain.memberships[guild] = 1;
                addCaptainHistory(captain, `joined ${FACTIONS[guild].name}.`, true);
                const major = FACTIONS[guild].majorAffinity;
                if (major) nudgeCaptainFaction(captain, major, 10);
            } else if (captain.memberships[guild] && standing < -60 && Math.random() < 0.25) {
                delete captain.memberships[guild];
                addCaptainHistory(captain, `left ${FACTIONS[guild].name} after a run of bad blood.`, true);
            }
        }

        function runCaptainDailyAction(captain) {
            maybeCaptainJoinOrLeaveGuild(captain);
            if (captain.currentPlan && captain.currentPlan.type === "mission") {
                const mission = missions.find(m => m.id === captain.currentPlan.missionId);
                if (!mission || mission.status !== "captain_taken") {
                    captain.currentPlan = null;
                } else if (player.time.day >= captain.currentPlan.completionDay) {
                    completeCaptainMission(captain, mission);
                    return;
                } else {
                    if (captain.currentPlan.targetSector && universe[captain.currentSector].warps.includes(captain.currentPlan.targetSector)) {
                        captain.currentSector = captain.currentPlan.targetSector;
                    } else {
                        moveCaptainTowardInterestingSector(captain);
                    }
                    return;
                }
            }
            const mission = chooseCaptainMission(captain);
            if (mission) { startCaptainMission(captain, mission); return; }
            moveCaptainTowardInterestingSector(captain);
            if (captain.archetype === "miner" && captainMine(captain)) return;
            if (captain.archetype === "mercenary" && captainFightPirates(captain)) return;
            if (captain.archetype === "pirate" && captainPirateRaid(captain)) return;
            if (captain.archetype === "smuggler" && captainSmuggle(captain)) return;
            if (captain.archetype === "colonist" && captainSupportColony(captain)) return;
            if (["trader", "industrialist", "fixer", "smuggler"].includes(captain.archetype) && captainTrade(captain)) return;
            if (Math.random() < 0.15) addCaptainHistory(captain, "kept a low profile and gathered local news.", false);
        }

        function resolveCaptainMeetings() {
            const bySector = {};
            Object.values(captains).forEach(c => {
                if (c.status !== "active") return;
                if (!bySector[c.currentSector]) bySector[c.currentSector] = [];
                bySector[c.currentSector].push(c);
            });
            Object.entries(bySector).forEach(([sectorIdText, group]) => {
                if (group.length < 2) return;
                for (let i = 0; i < group.length; i++) {
                    for (let j = i + 1; j < group.length; j++) {
                        const a = group[i], b = group[j];
                        if (Math.random() > 0.22) continue;
                        const aligned = a.preferredFaction === b.preferredFaction || getFactionPoliticalPole(a.preferredFaction) === getFactionPoliticalPole(b.preferredFaction);
                        // BUGFIX: ensure relations exist
                        const aRel = ensureCaptainRelation(a, b.id);
                        const bRel = ensureCaptainRelation(b, a.id);
                        if (aligned) {
                            aRel.opinion = clampRange((aRel.opinion || 0) + 3, -100, 100);
                            bRel.opinion = clampRange((bRel.opinion || 0) + 3, -100, 100);
                            if (Number(sectorIdText) === player.currentSector) log(`${a.name} and ${b.name} traded useful news at the port.`);
                        } else {
                            aRel.rivalry = clampRange((aRel.rivalry || 0) + 3, 0, 100);
                            bRel.rivalry = clampRange((bRel.rivalry || 0) + 3, 0, 100);
                            if (Number(sectorIdText) === player.currentSector) log(`${a.name} and ${b.name} had a tense exchange over local loyalties.`);
                        }
                    }
                }
            });
        }

        function updateCaptainsDaily(reason = "daily frontier cycle") {
            normaliseCaptains();
            Object.values(captains).forEach(c => {
                if (c.status !== "active") return;
                runCaptainDailyAction(c);
            });
            resolveCaptainMeetings();
            missions.filter(m => m.status === "available").forEach(prepareMissionOpportunity);
            EventBus.emit("captains_changed");
        }

        function makeStock(ore, org, eq) { return { ore, org, eq }; }

        function makePort(typeKey) {
            return {
                typeKey,
                factionId: PORT_TYPES[typeKey].factionId,
                publicFactionId: PORT_TYPES[typeKey].factionId,
                hiddenFactionId: null,
                stock: makeStock(1500 + Math.floor(Math.random() * 3500), 1200 + Math.floor(Math.random() * 3000), 800 + Math.floor(Math.random() * 2400)),
                maxStock: makeStock(6000, 5000, 4000),
                basePrices: { ore: 80, org: 150, eq: 300 }
            };
        }

        function makePlanet(typeKey) {
            return {
                typeKey, owner: null, factionId: null, colonists: 0,
                stock: makeStock(0, 0, 0), satisfaction: 60, shortages: makeStock(0, 0, 0),
                buildings: { habitat: 0, mine: 0, farm: 0, factory: 0, defense: 0 }
            };
        }

        function addWarp(a, b) {
            if (a === b) return;
            if (!universe[a].warps.includes(b)) universe[a].warps.push(b);
            if (!universe[b].warps.includes(a)) universe[b].warps.push(a);
        }
        function generateUniverse() {
            universe = {}; ports = {}; planets = {}; missions = []; nextMissionId = 1;
            for (let i = 1; i <= BALANCE.SECTOR_COUNT; i++) {
                let region = "Core";
                if (i > 20) region = "Badlands";
                else if (i > 10) region = "Frontier";
                universe[i] = {
                    id: i, name: i === 1 ? "StarDock" : `${region} Sector ${i}`,
                    region, warps: [], surveyed: i === 1,
                    pirateThreat: i <= 8 ? 0 : Math.floor(Math.random() * (region === "Badlands" ? 5 : 3)),
                    asteroids: null, influence: createBaseInfluence(region), front: null
                };
            }
            for (let i = 1; i <= BALANCE.SECTOR_COUNT; i++) addWarp(i, i === BALANCE.SECTOR_COUNT ? 1 : i + 1);
            for (let i = 1; i <= BALANCE.SECTOR_COUNT; i++) {
                const extraLinks = 1 + Math.floor(Math.random() * 2);
                for (let j = 0; j < extraLinks; j++) addWarp(i, 1 + Math.floor(Math.random() * BALANCE.SECTOR_COUNT));
            }
            ports[1] = makePort("stardock");
            ports[2] = makePort("mining");
            ports[3] = makePort("agricultural");
            ports[4] = makePort("industrial");
            ports[5] = makePort("consumer");
            const portKeys = ["mining", "agricultural", "industrial", "consumer", "refinery"];
            for (let i = 6; i <= BALANCE.SECTOR_COUNT; i++) {
                const chance = universe[i].region === "Core" ? 0.35 : 0.45;
                if (Math.random() < chance) ports[i] = makePort(portKeys[Math.floor(Math.random() * portKeys.length)]);
            }
            Object.keys(ports).forEach(sec => {
                const sectorId = Number(sec);
                const port = ports[sectorId];
                const dominant = universe[sectorId].region === "Badlands" && Math.random() < 0.18 ? "vc" : port.factionId;
                port.publicFactionId = port.factionId;
                port.hiddenFactionId = dominant === port.factionId ? null : dominant;
                addSectorInfluence(sectorId, port.factionId, 16, "");
                if (port.hiddenFactionId) {
                    universe[sectorId].front = {
                        publicFactionId: port.factionId,
                        hiddenFactionId: port.hiddenFactionId,
                        suspicion: 10 + Math.floor(Math.random() * 25)
                    };
                    addSectorInfluence(sectorId, port.hiddenFactionId, 10, "");
                }
            });
            const planetKeys = Object.keys(PLANET_TYPES);
            planets[6] = makePlanet("terran");
            for (let i = 7; i <= BALANCE.SECTOR_COUNT; i++) {
                const chance = universe[i].region === "Core" ? 0.18 : 0.32;
                if (Math.random() < chance) planets[i] = makePlanet(planetKeys[Math.floor(Math.random() * planetKeys.length)]);
            }
            universe[7].asteroids = { ore: 8000, maxOre: 8000, richness: 1.25, hazard: 0.08, surveyed: false };
            addSectorInfluence(7, "hc", 8, "");
            for (let i = 8; i <= BALANCE.SECTOR_COUNT; i++) {
                const chance = universe[i].region === "Badlands" ? 0.55 : 0.30;
                if (Math.random() < chance) {
                    const asteroidOre = 2500 + Math.floor(Math.random() * 9000);
                    universe[i].asteroids = {
                        ore: asteroidOre,
                        maxOre: asteroidOre,
                        richness: 0.7 + Math.random() * 1.1,
                        hazard: universe[i].region === "Badlands" ? 0.12 + Math.random() * 0.18 : Math.random() * 0.12,
                        surveyed: false
                    };
                    addSectorInfluence(i, "hc", 5, "");
                    if (universe[i].region === "Badlands" && Math.random() < 0.4) addSectorInfluence(i, "vc", 5, "");
                }
            }
            createCaptains();
            generateMissionPool();
            generateFactionAsks();
        }

    function generateStars() {
        starField = [];
        for (let i = 0; i < 100; i++) {
            starField.push({ x: Math.random() * 700, y: Math.random() * 420, size: Math.random() < 0.85 ? 1 : 2 });
        }
    }

    function getCargoUsed() { return COMMODITIES.reduce((sum, c) => sum + player.cargo[c], 0); }
    function getFreeHolds() { return Math.max(0, player.ship.maxHolds - getCargoUsed()); }
    function formatCredits(value) { return Math.floor(value).toLocaleString(); }
    function formatCommodity(commodity) { return COMMODITY_NAMES[commodity] || commodity; }
    function formatTime(minutes) {
        const h = Math.floor(minutes / 60);
        const m = minutes % 60;
        return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}`;
    }

    // =====================================================
    // TIME ENGINE
    // =====================================================
    function getAbsoluteMinute() {
        return (player.time.day - 1) * BALANCE.DAY_MINUTES + player.time.minuteOfDay;
    }

    function setTimeFromAbsoluteMinute(absoluteMinute) {
        player.time.day = Math.floor(absoluteMinute / BALANCE.DAY_MINUTES) + 1;
        player.time.minuteOfDay = absoluteMinute % BALANCE.DAY_MINUTES;
    }

    function canSpendTime(minutes) {
        if (player.time.minuteOfDay < player.time.wakeMinute || player.time.minuteOfDay >= player.time.sleepMinute) {
            log("Your useful day is over. Rest until morning before taking another action.");
            return false;
        }
        if (player.time.minuteOfDay + minutes > player.time.sleepMinute) {
            log("There is not enough useful time left today. Rest until morning or choose a shorter action.");
            return false;
        }
        return true;
    }

    function spendTime(minutes, reason = "player action") {
        if (!canSpendTime(minutes)) return false;
        advanceTime(minutes, reason);
        return true;
    }

    // BUGFIX: handle midnight start case correctly
    function advanceTime(minutes, reason = "time passes") {
        if (minutes <= 0) return;
        const startAbsolute = getAbsoluteMinute();
        const endAbsolute = startAbsolute + minutes;
        // If we start exactly on an hour boundary, the next boundary is +60.
        // If we're between boundaries, find the next one.
        let boundary;
        if (startAbsolute % 60 === 0) {
            boundary = startAbsolute + 60;
        } else {
            boundary = Math.ceil(startAbsolute / 60) * 60;
        }
        while (boundary <= endAbsolute) {
            setTimeFromAbsoluteMinute(boundary);
            if (player.time.minuteOfDay === 0) {
                runDailyWorldTick(reason);
            } else {
                runHourlyWorldTick(reason);
            }
            boundary += 60;
        }
        setTimeFromAbsoluteMinute(endAbsolute);
        EventBus.emit("time_advanced");
    }

    function runHourlyWorldTick(reason = "time passes") {
        updateCaptainsHourly(reason);
        missions.filter(m => m.status === "available").forEach(prepareMissionOpportunity);
        if (player.factions && Array.isArray(player.factions.intel)) {
            player.factions.intel = player.factions.intel.filter(item => item.expiresDay >= player.time.day);
        }
    }

    function runDailyWorldTick(reason = "daily frontier cycle") {
        produceColonies();
        runTradeRoutesDaily();
        updateColonyNeedsDaily();
        updatePortsDaily();
        updateThreatsDaily();
        updateFactionsDaily();
        expireMissions();
        updateCaptainsDaily(reason);
        addWorldEvent({
            type: "daily_tick",
            text: `Day ${player.time.day} opened: colonies produced goods, markets shifted, captains acted, factions moved, and sector threats advanced.`,
            importance: 2, alert: false
        });
    }

    function updateCaptainsHourly(reason = "time passes") {
        normaliseCaptains();
        let acted = false;
        Object.values(captains).forEach(c => {
            if (c.status !== "active") return;
            if (Math.random() > BALANCE.CAPTAIN_HOURLY_ACTION_CHANCE) return;
            runCaptainDailyAction(c);
            acted = true;
        });
        if (acted) resolveCaptainMeetings();
    }

    function addWorldEvent(event) {
        if (!event || !event.text) return;
        const time = player && player.time ? player.time : { day: 1, minuteOfDay: 0 };
        worldEvents.unshift({
            id: nextWorldEventId++,
            day: time.day, minute: time.minuteOfDay,
            type: event.type || "news",
            sectorId: event.sectorId || null,
            factionId: event.factionId || null,
            captainId: event.captainId || null,
            text: event.text,
            importance: event.importance || 1
        });
        worldEvents = worldEvents.slice(0, BALANCE.WORLD_EVENT_LIMIT);
        if (event.alert) {
            log(event.text);
            if (event.importance >= 3) Notifications.show(event.text, event.importance);
        }
    }

    function hasCargo(cost) { return COMMODITIES.every(c => player.cargo[c] >= (cost[c] || 0)); }
    function removeCargo(cost) { COMMODITIES.forEach(c => { player.cargo[c] -= cost[c] || 0; }); }
    function addCargo(commodity, amount) {
        const actual = Math.max(0, Math.min(amount, getFreeHolds()));
        player.cargo[commodity] += actual;
        return actual;
    }

    function ensureFactionState() {
        if (!player.factions) player.factions = createFactionState();
        const f = player.factions;
        if (!f.reputation) f.reputation = {};
        if (!f.publicRep) f.publicRep = {};
        if (!f.privateRep) f.privateRep = {};
        if (!f.trust) f.trust = {};
        if (!f.leverage) f.leverage = {};
        if (!f.heat) f.heat = {};
        if (!f.favors) f.favors = {};
        if (!f.membership) f.membership = {};
        if (!f.memory) f.memory = {};
        if (!Array.isArray(f.intel)) f.intel = [];
        if (!Array.isArray(f.asks)) f.asks = [];
        if (!f.contacts) f.contacts = createContactState();
        Object.values(CONTACT_DEFS).forEach(contact => {
            if (!f.contacts[contact.id]) {
                f.contacts[contact.id] = {
                    known: Boolean(contact.knownAtStart),
                    relationship: contact.startingRelation || 0,
                    trust: contact.knownAtStart ? 2 : 0,
                    leverage: 0, lastInteraction: "not met yet"
                };
            }
        });
        if (typeof f.nextAskId !== "number") f.nextAskId = 1;
        Object.keys(FACTIONS).forEach(id => {
            const start = FACTIONS[id].startingRep || 0;
            if (typeof f.publicRep[id] !== "number") f.publicRep[id] = typeof f.reputation[id] === "number" ? f.reputation[id] : start;
            if (typeof f.privateRep[id] !== "number") f.privateRep[id] = 0;
            if (typeof f.reputation[id] !== "number") f.reputation[id] = f.publicRep[id];
            if (typeof f.trust[id] !== "number") f.trust[id] = id === "sda" ? 15 : 0;
            if (typeof f.leverage[id] !== "number") f.leverage[id] = 0;
            if (typeof f.heat[id] !== "number") f.heat[id] = 0;
            if (typeof f.favors[id] !== "number") f.favors[id] = 0;
            if (!f.memory[id]) f.memory[id] = { helpedEnemies: 0, smugglingSuspicions: 0, unpaidFines: 0, reliableJobs: 0, betrayals: 0 };
            if (FACTIONS[id].type === "guild" && typeof f.membership[id] !== "number") f.membership[id] = 0;
            syncFactionReputation(id);
        });
    }

    function markFactionKnown(factionId, reason = "encountered") {
        if (!FACTIONS[factionId]) return;
        ensureFactionState();
        Object.values(CONTACT_DEFS).forEach(contact => {
            if (contact.factionId === factionId && player.factions.contacts[contact.id]) {
                player.factions.contacts[contact.id].known = true;
                player.factions.contacts[contact.id].lastInteraction = reason;
            }
        });
    }

    function isFactionKnown(factionId) {
        if (!FACTIONS[factionId]) return false;
        if (["sda", "fu", "hc"].includes(factionId)) return true;
        ensureFactionState();
        if (factionId === "vc") {
            return getFactionRep("vc") > -100 || getPrivateFactionRep("vc") > 0 || getFactionHeat("sda") > 20 || player.factions.intel.some(item => item.factionId === "vc" || item.targetFactionId === "vc") || getGuildTier("smugglers") > 0;
        }
        if (FACTIONS[factionId].type === "guild") {
            return getGuildTier(factionId) > 0 || getFactionRep(factionId) > 0 || getFactionTrust(factionId) > 0 || hasGuildJoinAccess(factionId);
        }
        return true;
    }

    function getKnownFactionIds() { return Object.keys(FACTIONS).filter(isFactionKnown); }

    function getContactScore(contact) {
        ensureFactionState();
        const state = player.factions.contacts[contact.id] || { relationship: 0, trust: 0, leverage: 0 };
        const factionScore = getFactionRep(contact.factionId) * 0.30 + getPrivateFactionRep(contact.factionId) * 0.20 + getFactionTrust(contact.factionId) * 1.4 - getFactionHeat(contact.factionId) * 0.30;
        return clampRange((state.relationship || 0) + factionScore, -100, 100);
    }

    function getKnownContacts() {
        ensureFactionState();
        return Object.values(CONTACT_DEFS).filter(contact => {
            const state = player.factions.contacts[contact.id];
            return Boolean(state && (state.known || isFactionKnown(contact.factionId)));
        });
    }

    function nudgeContact(contactId, relationshipDelta, trustDelta, reason) {
        ensureFactionState();
        const state = player.factions.contacts[contactId];
        if (!state) return;
        state.known = true;
        state.relationship = clampRange((state.relationship || 0) + relationshipDelta, -100, 100);
        state.trust = clampRange((state.trust || 0) + trustDelta, -100, 100);
        state.lastInteraction = reason || "recent business";
    }

    function getContactForFaction(factionId) {
        return Object.values(CONTACT_DEFS).find(contact => contact.factionId === factionId) || null;
    }

    function clampRange(value, min, max) { return Math.max(min, Math.min(max, Math.round(value))); }

    function syncFactionReputation(factionId) {
        if (!player || !player.factions || !FACTIONS[factionId]) return;
        const f = player.factions;
        const publicScore = typeof f.publicRep[factionId] === "number" ? f.publicRep[factionId] : 0;
        const privateScore = typeof f.privateRep[factionId] === "number" ? f.privateRep[factionId] : 0;
        f.reputation[factionId] = clampRange(publicScore + privateScore * 0.25, -500, 1000);
    }

    function getFactionRep(factionId) { ensureFactionState(); return player.factions.publicRep[factionId] || 0; }
    function getPrivateFactionRep(factionId) { ensureFactionState(); return player.factions.privateRep[factionId] || 0; }
    function getFactionTrust(factionId) { ensureFactionState(); return player.factions.trust[factionId] || 0; }
    function getFactionHeat(factionId) { ensureFactionState(); return player.factions.heat[factionId] || 0; }
    function getFactionLeverage(factionId) { ensureFactionState(); return player.factions.leverage[factionId] || 0; }
    function getFactionFavors(factionId) { ensureFactionState(); return player.factions.favors[factionId] || 0; }

    function setFactionRep(factionId, value) {
        ensureFactionState();
        if (!FACTIONS[factionId]) return;
        player.factions.publicRep[factionId] = clampRange(value, -500, 1000);
        syncFactionReputation(factionId);
    }

    function setPrivateFactionRep(factionId, value) {
        ensureFactionState();
        if (!FACTIONS[factionId]) return;
        player.factions.privateRep[factionId] = clampRange(value, -500, 1000);
        syncFactionReputation(factionId);
    }

    function addFactionRep(factionId, amount, reason, visibility = "public") {
        if (!FACTIONS[factionId] || amount === 0) return;
        ensureFactionState();
        const before = visibility === "private" ? getPrivateFactionRep(factionId) : getFactionRep(factionId);
        if (visibility === "private") setPrivateFactionRep(factionId, before + amount);
        else setFactionRep(factionId, before + amount);
        const after = visibility === "private" ? getPrivateFactionRep(factionId) : getFactionRep(factionId);
        if (after !== before && reason) {
            const label = visibility === "private" ? "private standing" : "public standing";
            log(`${FACTIONS[factionId].short} ${label} ${amount > 0 ? "+" : ""}${after - before}: ${reason}.`);
        }
        markFactionKnown(factionId, reason || "reputation changed");
        const contact = getContactForFaction(factionId);
        if (contact && amount !== 0) nudgeContact(contact.id, Math.trunc(amount / 2), visibility === "private" ? 1 : 0, reason || "reputation changed");
        applyFactionRipple(factionId, amount, visibility);
        EventBus.emit("faction_changed", { factionId });
    }

    function addFactionTrust(factionId, amount, reason) {
        if (!FACTIONS[factionId] || amount === 0) return;
        ensureFactionState();
        const before = getFactionTrust(factionId);
        player.factions.trust[factionId] = clampRange(before + amount, -100, 100);
        const after = getFactionTrust(factionId);
        if (after !== before && reason) log(`${FACTIONS[factionId].short} trust ${amount > 0 ? "+" : ""}${after - before}: ${reason}.`);
        markFactionKnown(factionId, reason || "trust changed");
        const contact = getContactForFaction(factionId);
        if (contact) nudgeContact(contact.id, Math.trunc(amount / 2), amount, reason || "trust changed");
    }

    function addFactionHeat(factionId, amount, reason) {
        if (!FACTIONS[factionId] || amount === 0) return;
        ensureFactionState();
        const before = getFactionHeat(factionId);
        player.factions.heat[factionId] = clampRange(before + amount, 0, 150);
        const after = getFactionHeat(factionId);
        if (after !== before && reason) log(`${FACTIONS[factionId].short} heat ${amount > 0 ? "+" : ""}${after - before}: ${reason}.`);
        markFactionKnown(factionId, reason || "heat changed");
        // Notify if SDA heat crosses dangerous threshold
        if (factionId === "sda" && before < 60 && after >= 60) {
            Notifications.show(`SDA heat reached ${after} — expect inspections`, 3);
        }
    }

    function addFactionLeverage(factionId, amount, reason) {
        if (!FACTIONS[factionId] || amount === 0) return;
        ensureFactionState();
        const before = getFactionLeverage(factionId);
        player.factions.leverage[factionId] = clampRange(before + amount, 0, 150);
        const after = getFactionLeverage(factionId);
        if (after !== before && reason) log(`${FACTIONS[factionId].short} leverage ${amount > 0 ? "+" : ""}${after - before}: ${reason}.`);
    }

    function addFactionFavor(factionId, amount, reason) {
        if (!FACTIONS[factionId] || amount === 0) return;
        ensureFactionState();
        const before = getFactionFavors(factionId);
        player.factions.favors[factionId] = clampRange(before + amount, 0, 99);
        const after = getFactionFavors(factionId);
        if (after !== before && reason) log(`${FACTIONS[factionId].short} favor ${amount > 0 ? "+" : ""}${after - before}: ${reason}.`);
    }

    function recordFactionMemory(factionId, key, amount = 1) {
        ensureFactionState();
        if (!player.factions.memory[factionId]) return;
        if (typeof player.factions.memory[factionId][key] !== "number") player.factions.memory[factionId][key] = 0;
        player.factions.memory[factionId][key] += amount;
    }

    function applyFactionRipple(factionId, amount, visibility) {
        const faction = FACTIONS[factionId];
        if (!faction) return;
        if (faction.type === "guild" && faction.majorAffinity) {
            const majorGain = Math.trunc(amount / 3);
            if (majorGain !== 0) addFactionRep(faction.majorAffinity, majorGain, `${faction.short} affinity`, visibility);
        } else if (faction.type === "major") {
            Object.entries(FACTION_RELATIONS[factionId] || {}).forEach(([otherId, relation]) => {
                if (Math.abs(relation) < 40) return;
                const ripple = Math.trunc(amount * relation / 500);
                if (ripple !== 0) {
                    if (visibility === "private") setPrivateFactionRep(otherId, getPrivateFactionRep(otherId) + ripple);
                    else setFactionRep(otherId, getFactionRep(otherId) + ripple);
                }
            });
        }
    }

    function applyPoliticalEffect(effect) {
        if (!effect || !effect.factionId || !FACTIONS[effect.factionId]) return;
        const factionId = effect.factionId;
        const reason = effect.reason || "political consequence";
        if (effect.publicRep) addFactionRep(factionId, effect.publicRep, reason, "public");
        if (effect.privateRep) addFactionRep(factionId, effect.privateRep, reason, "private");
        if (effect.trust) addFactionTrust(factionId, effect.trust, reason);
        if (effect.heat) addFactionHeat(factionId, effect.heat, reason);
        if (effect.leverage) addFactionLeverage(factionId, effect.leverage, reason);
        if (effect.favors) addFactionFavor(factionId, effect.favors, reason);
        if (effect.memoryKey) recordFactionMemory(factionId, effect.memoryKey, effect.memoryAmount || 1);
        if (effect.sectorId && effect.influence) addSectorInfluence(effect.sectorId, factionId, effect.influence, reason);
    }

    function createBaseInfluence(region) {
        const base = INFLUENCE_BASES[region] || INFLUENCE_BASES.Frontier;
        const influence = {};
        MAJOR_FACTIONS.forEach(id => { influence[id] = base[id] || 0; });
        return influence;
    }

    function normaliseSectorInfluence(sector) {
        if (!sector.influence) sector.influence = createBaseInfluence(sector.region || "Frontier");
        MAJOR_FACTIONS.forEach(id => {
            if (typeof sector.influence[id] !== "number") sector.influence[id] = 0;
            sector.influence[id] = clampRange(sector.influence[id], 0, 100);
        });
    }

    function addSectorInfluence(sectorId, factionId, amount, reason) {
        const sector = universe[sectorId];
        if (!sector || !MAJOR_FACTIONS.includes(factionId) || amount === 0) return;
        normaliseSectorInfluence(sector);
        const before = sector.influence[factionId] || 0;
        sector.influence[factionId] = clampRange(before + amount, 0, 100);
        MAJOR_FACTIONS.forEach(otherId => {
            if (otherId === factionId) return;
            const pressure = Math.max(0, Math.trunc(Math.abs(amount) / 3));
            if (amount > 0 && pressure > 0) sector.influence[otherId] = clampRange((sector.influence[otherId] || 0) - pressure, 0, 100);
        });
        if (reason && Math.abs(amount) >= 3) {
            const text = `${FACTIONS[factionId].short} influence ${amount > 0 ? "+" : ""}${amount} in sector ${sectorId}: ${reason}.`;
            addWorldEvent({ type: "influence", factionId, sectorId, text, importance: 2, alert: false });
            log(text);
        }
    }

    function getDominantInfluence(sectorId) {
        const sector = universe[sectorId];
        if (!sector) return "fu";
        normaliseSectorInfluence(sector);
        let bestId = "fu", bestValue = -Infinity;
        MAJOR_FACTIONS.forEach(id => {
            const value = sector.influence[id] || 0;
            if (value > bestValue) { bestValue = value; bestId = id; }
        });
        return bestId;
    }

    function getInfluenceSpread(sectorId) {
        const sector = universe[sectorId];
        if (!sector) return [];
        normaliseSectorInfluence(sector);
        return MAJOR_FACTIONS.map(id => ({ id, value: sector.influence[id] || 0 })).sort((a, b) => b.value - a.value);
    }

    function getSectorStatusLabel(sectorId) {
        const spread = getInfluenceSpread(sectorId);
        if (spread.length < 2) return "Stable";
        const gap = spread[0].value - spread[1].value;
        if (gap <= BALANCE.CONTESTED_GAP) return "Contested";
        if (spread[0].value >= 70) return "Controlled";
        if (spread[0].value >= 50) return "Dominated";
        return "Mixed";
    }

    function addIntel(intel) {
        ensureFactionState();
        const entry = {
            id: `intel-${player.time.day}-${Math.floor(Math.random() * 100000)}`,
            type: intel.type,
            factionId: intel.factionId || null,
            targetFactionId: intel.targetFactionId || null,
            sectorId: intel.sectorId || player.currentSector,
            value: intel.value || 25,
            expiresDay: intel.expiresDay || player.time.day + 8,
            text: intel.text || "Useful political information."
        };
        player.factions.intel.push(entry);
        log(`Intel acquired: ${entry.text}`);
        Notifications.show(`Intel: ${entry.text}`, 2);
    }

    function spendFavor(factionId, amount) {
        ensureFactionState();
        if (getFactionFavors(factionId) < amount) return false;
        player.factions.favors[factionId] -= amount;
        return true;
    }

    function getGuildTier(guildId) { ensureFactionState(); return player.factions.membership[guildId] || 0; }

    function getFactionLabel(rep) {
        if (rep >= 650) return "Trusted";
        if (rep >= 300) return "Friendly";
        if (rep >= 75) return "Warm";
        if (rep >= -50) return "Neutral";
        if (rep >= -200) return "Unfriendly";
        return "Hostile";
    }

    function getFactionBarPercent(rep) { return Math.max(0, Math.min(100, Math.round(((rep + 500) / 1500) * 100))); }

    function getSectorFactionId(sectorId) {
        const sector = universe[sectorId];
        if (!sector) return "fu";
        return getDominantInfluence(sectorId);
    }

    function getFactionPriceMultiplier(port, mode) {
        const factionId = port.factionId || PORT_TYPES[port.typeKey].factionId || "fu";
        const rep = getFactionRep(factionId);
        const privateRep = getPrivateFactionRep(factionId);
        const trust = getFactionTrust(factionId);
        const heat = factionId === "sda" ? getFactionHeat("sda") : 0;
        const sectorSpread = getInfluenceSpread(player.currentSector);
        const sectorInfluence = sectorSpread.find(item => item.id === factionId);
        const influenceBonus = sectorInfluence ? (sectorInfluence.value - 35) / BALANCE.PRICE.INFLUENCE_DIVISOR : 0;
        const repBonus = Math.max(-0.20, Math.min(0.25, rep / BALANCE.PRICE.REP_DIVISOR));
        const privateBonus = Math.max(-0.05, Math.min(0.08, privateRep / BALANCE.PRICE.PRIVATE_DIVISOR));
        const trustBonus = Math.max(-0.04, Math.min(0.05, trust / BALANCE.PRICE.TRUST_DIVISOR));
        const heatPenalty = Math.max(0, Math.min(0.08, heat / BALANCE.PRICE.HEAT_DIVISOR));
        const traderBonus = getGuildTier("traders") * BALANCE.PRICE.TRADER_GUILD_BONUS;
        let affinityBonus = 0;
        GUILD_FACTIONS.forEach(guildId => {
            const guild = FACTIONS[guildId];
            if (guild.majorAffinity === factionId) affinityBonus += getGuildTier(guildId) * BALANCE.PRICE.AFFINITY_GUILD_BONUS;
        });
        const totalBonus = Math.max(-BALANCE.PRICE.MAX_PENALTY, Math.min(BALANCE.PRICE.MAX_BONUS, repBonus + privateBonus + trustBonus + influenceBonus + traderBonus + affinityBonus - heatPenalty));
        if (mode === "buy") return Math.max(BALANCE.PRICE.MIN_MULT, Math.min(BALANCE.PRICE.MAX_MULT, 1 - totalBonus));
        return Math.max(BALANCE.PRICE.MIN_MULT, Math.min(BALANCE.PRICE.MAX_MULT, 1 + totalBonus));
    }

    function getMiningYieldMultiplier() { return 1 + getGuildTier("miners") * 0.08; }

    function getColonyProductionMultiplier(planet, commodity) {
        let multiplier = 1 + getGuildTier("colonists") * 0.08;
        if (commodity === "ore") multiplier += getGuildTier("miners") * 0.04;
        const alignedMajor = planet.factionId && FACTIONS[planet.factionId] ? (FACTIONS[planet.factionId].majorAffinity || planet.factionId) : null;
        if (commodity === "eq" && alignedMajor === "hc") multiplier += Math.max(0, getFactionRep("hc")) / 5000;
        if (planet.policy && planet.policy.security === "cartel_protection") multiplier += 0.03;
        return multiplier;
    }

    function getPirateIncidentMultiplier() {
        let multiplier = 1 - getGuildTier("smugglers") * 0.12;
        multiplier -= Math.max(0, getFactionRep("vc")) / 3500;
        multiplier -= Math.max(0, getPrivateFactionRep("vc")) / 2200;
        multiplier -= Math.max(0, getFactionTrust("vc")) / 1000;
        multiplier += Math.max(0, getFactionHeat("sda") - 60) / 1200;
        return Math.max(0.35, Math.min(1.35, multiplier));
    }

    function hasGuildJoinAccess(guildId) {
        const req = GUILD_REQUIREMENTS[guildId];
        if (!req) return false;
        const port = ports[player.currentSector];
        const planet = planets[player.currentSector];
        const sector = universe[player.currentSector];
        if (req.allowedPortTypes && port && req.allowedPortTypes.includes(port.typeKey)) return true;
        if (req.allowedRegions && sector && req.allowedRegions.includes(sector.region)) return true;
        if (req.allowsPlayerColony && planet && planet.owner === "Player") return true;
        return false;
    }

    function canAffordGuildRequirement(guildId) {
        const req = GUILD_REQUIREMENTS[guildId];
        return Boolean(req && player.credits >= req.credits && hasCargo(req.cargo || {}));
    }

    function factionName(id) { return FACTIONS[id] ? FACTIONS[id].name : "Independent"; }

    function clampPlayerState() {
        ensureFactionState();
        player.credits = Math.max(0, Math.floor(player.credits));
        player.fighters = Math.max(0, Math.min(player.fighters, player.ship.maxFighters));
        player.shields = Math.max(0, Math.min(player.shields, player.ship.maxShields));
        player.hull = Math.max(0, Math.min(player.hull, player.ship.maxHull));
        COMMODITIES.forEach(c => { player.cargo[c] = Math.max(0, Math.floor(player.cargo[c])); });
    }

    function log(msg) {
        const logEl = document.getElementById("log");
        if (!logEl) return;
        const line = document.createElement("div");
        line.innerHTML = `&gt; ${escapeHtml(msg)}`;
        logEl.appendChild(line);
        // Cap log length
        while (logEl.childNodes.length > 200) logEl.removeChild(logEl.firstChild);
        logEl.scrollTop = logEl.scrollHeight;
    }

    function getMapNodes() {
        const nodes = {};
        const ids = Object.keys(universe).map(Number);
        const angleStep = (2 * Math.PI) / ids.length;
        ids.forEach((id, idx) => {
            const radiusX = universe[id].region === "Core" ? 155 : universe[id].region === "Frontier" ? 220 : 280;
            const radiusY = universe[id].region === "Core" ? 105 : universe[id].region === "Frontier" ? 150 : 185;
            const x = 350 + Math.cos(idx * angleStep - Math.PI / 2) * radiusX;
            const y = 210 + Math.sin(idx * angleStep - Math.PI / 2) * radiusY;
            nodes[id] = { x, y };
        });
        mapNodeCache = nodes;
        return nodes;
    }

    function drawMap() {
        const canvas = document.getElementById("map");
        if (!canvas) return;
        const ctx = canvas.getContext("2d");
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#112233";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#ffffff";
        starField.forEach(star => ctx.fillRect(star.x, star.y, star.size, star.size));
        const nodes = getMapNodes();
        const ids = Object.keys(universe).map(Number);
        ctx.strokeStyle = "rgba(0, 204, 153, 0.45)";
        ctx.lineWidth = 1;
        ids.forEach(id => {
            universe[id].warps.forEach(target => {
                if (id < target && nodes[target]) {
                    ctx.beginPath();
                    ctx.moveTo(nodes[id].x, nodes[id].y);
                    ctx.lineTo(nodes[target].x, nodes[target].y);
                    ctx.stroke();
                }
            });
        });
        ids.forEach(id => {
            let fill = "#8888ff";
            if (universe[id].asteroids) fill = "#cccccc";
            if (planets[id]) fill = "#44aaff";
            if (ports[id]) fill = "#ffaa00";
            if (universe[id].pirateThreat > 0 && id !== player.currentSector) fill = "#ff4444";
            if (id === player.currentSector) fill = "#00ff88";
            const selected = id === selectedSectorId;
            if (selected) {
                ctx.strokeStyle = "#ffffff";
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(nodes[id].x, nodes[id].y, 17, 0, Math.PI * 2);
                ctx.stroke();
            }
            ctx.fillStyle = fill;
            ctx.beginPath();
            ctx.arc(nodes[id].x, nodes[id].y, 12, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#001122";
            ctx.font = "13px VT323";
            ctx.fillText(String(id), nodes[id].x - 6, nodes[id].y + 4);
            const faction = FACTIONS[getSectorFactionId(id)];
            if (faction) {
                ctx.fillStyle = faction.color;
                ctx.font = "14px VT323";
                ctx.fillText(faction.icon, nodes[id].x + 9, nodes[id].y - 9);
            }
            const localCaptains = getCaptainsInSector(id, true);
            if (localCaptains.length > 0) {
                ctx.fillStyle = "#ffffff";
                ctx.font = "13px VT323";
                ctx.fillText("C" + localCaptains.length, nodes[id].x - 18, nodes[id].y - 12);
            }
        });
    }

    function setupMapInteraction() {
        const canvas = document.getElementById("map");
        if (!canvas || canvas.dataset.bound === "1") return;
        canvas.dataset.bound = "1";
        canvas.addEventListener("click", event => {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const x = (event.clientX - rect.left) * scaleX;
            const y = (event.clientY - rect.top) * scaleY;
            const nodes = Object.keys(mapNodeCache).length ? mapNodeCache : getMapNodes();
            let closestId = null, closestDistance = Infinity;
            Object.entries(nodes).forEach(([id, node]) => {
                const dx = node.x - x, dy = node.y - y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                if (distance < closestDistance) { closestDistance = distance; closestId = Number(id); }
            });
            if (closestId && closestDistance <= 24) selectSector(closestId);
        });
    }

    function selectSector(sectorId) {
        if (!universe[sectorId]) return;
        selectedSectorId = sectorId;
        Renderer.invalidate("mapInspector");
        Renderer.invalidate("map");
    }

    function describeCargo() {
        return COMMODITIES.map(c => `${formatCommodity(c)} ${player.cargo[c]}`).join(" / ");
    }

    // =====================================================
    // ACTION DISPATCHER (for safe data-action buttons)
    // =====================================================
    const Actions = {};
    function registerAction(name, fn) { Actions[name] = fn; }

    function handleActionClick(event) {
        const target = event.target.closest("[data-action]");
        if (!target) return;
        const action = target.dataset.action;
        const fn = Actions[action];
        if (!fn) return;
        const args = [];
        for (let i = 0; i < 5; i++) {
            if (target.dataset["arg" + i] !== undefined) args.push(target.dataset["arg" + i]);
        }
        try { fn.apply(null, args); }
        catch (e) { console.error(`Action ${action} failed:`, e); }
    }

    // =====================================================
    // RENDER FUNCTIONS (registered with Renderer)
    // =====================================================
    function renderHeader() {
        clampPlayerState();
        const sector = universe[player.currentSector];
        document.getElementById("shipName").textContent = player.ship.name;
        document.getElementById("credits").textContent = formatCredits(player.credits);
        document.getElementById("dayTime").textContent = `Day ${player.time.day}, ${formatTime(player.time.minuteOfDay)}`;
        document.getElementById("sectorNum").textContent = player.currentSector;
        document.getElementById("sectorName").textContent = sector.name;
        const cs = document.getElementById("curSector");
        if (cs) cs.textContent = player.currentSector;
        document.getElementById("cargoSummary").textContent = describeCargo();
        document.getElementById("holds").textContent = `${getCargoUsed()}/${player.ship.maxHolds}`;
        document.getElementById("fighters").textContent = `${player.fighters}/${player.ship.maxFighters}`;
        document.getElementById("shields").textContent = `${player.shields}/${player.ship.maxShields}`;
        document.getElementById("hull").textContent = `${player.hull}/${player.ship.maxHull}`;
    }

    function renderSectorContents() {
        const sector = universe[player.currentSector];
        const port = ports[player.currentSector];
        const planet = planets[player.currentSector];
        const influence = FACTIONS[getSectorFactionId(player.currentSector)];
        let html = `<div><strong>Region:</strong> ${escapeHtml(sector.region)} | <strong>Status:</strong> ${escapeHtml(getSectorStatusLabel(player.currentSector))}</div>`;
        if (influence) html += `<div><strong>Dominant Influence:</strong> <span style="color:${influence.color}">${influence.icon} ${escapeHtml(influence.name)}</span></div>`;
        html += `<div class="small muted">${getInfluenceSpread(player.currentSector).map(item => `${FACTIONS[item.id].short}:${item.value}`).join(" | ")}</div>`;
        html += `<div><strong>Warps to:</strong> ${sector.warps.join(", ")}</div>`;
        html += `<div><strong>Survey:</strong> ${sector.surveyed ? "Complete" : "Not surveyed"}</div>`;
        const localRoutes = tradeRoutes.filter(r => r.status !== "closed" && (r.originSector === player.currentSector || r.destinationSector === player.currentSector));
        if (localRoutes.length > 0) html += `<div><strong>Routes:</strong> ${localRoutes.map(r => `${escapeHtml(r.name)} (${r.status})`).join(" | ")}</div>`;
        html += renderCaptainChipsForSector(player.currentSector);
        if (getSectorStatusLabel(player.currentSector) === "Contested") html += `<div class="amber"><strong>Political conflict:</strong> local factions are actively contesting control.</div>`;
        if (sector.front) html += `<div class="amber"><strong>Front suspicion:</strong> ${sector.front.suspicion}/100.</div>`;
        if (sector.pirateThreat > 0) html += `<div class="red"><strong>Pirate threat:</strong> ${sector.pirateThreat}</div>`;
        if (port) {
            const type = PORT_TYPES[port.typeKey];
            const faction = FACTIONS[port.factionId];
            html += `<div class="green"><strong>Port:</strong> ${escapeHtml(type.name)}</div>`;
            if (faction) html += `<div><strong>Public Authority:</strong> <span style="color:${faction.color}">${faction.icon} ${escapeHtml(faction.name)}</span></div>`;
            if (sector.front && sector.surveyed) {
                const hidden = FACTIONS[sector.front.hiddenFactionId];
                html += `<div class="amber"><strong>Rumors:</strong> front activity suspected${hidden ? ` (${hidden.short})` : ""}. Suspicion ${sector.front.suspicion}.</div>`;
            }
            html += `<div class="small muted">${escapeHtml(type.description)}</div>`;
        }
        if (sector.asteroids) {
            const a = sector.asteroids;
            if (a.surveyed) html += `<div class="amber"><strong>Asteroids:</strong> ${Math.floor(a.ore)} ore, richness ${a.richness.toFixed(2)}, hazard ${(a.hazard * 100).toFixed(0)}%</div>`;
            else html += `<div class="amber"><strong>Asteroids:</strong> detected, details unknown</div>`;
        }
        if (planet) {
            const type = PLANET_TYPES[planet.typeKey];
            html += `<div class="blue"><strong>Planet:</strong> ${escapeHtml(type.name)} (${planet.owner ? "Colony founded" : "Unclaimed"})</div>`;
            document.getElementById("planetInfo").style.display = "block";
            document.getElementById("planetInfo").innerHTML = renderPlanetSummary(planet);
        } else {
            document.getElementById("planetInfo").style.display = "none";
        }
        document.getElementById("sectorContents").innerHTML = html;
    }

    function renderPlanetSummary(planet) {
        const type = PLANET_TYPES[planet.typeKey];
        let html = `<strong>${escapeHtml(type.name)} Planet</strong><br>`;
        html += `Owner: ${escapeHtml(planet.owner || "Unclaimed")}<br>`;
        if (planet.factionId) html += `Alignment: ${FACTIONS[planet.factionId].icon} ${escapeHtml(FACTIONS[planet.factionId].name)}<br>`;
        if (planet.policy) {
            html += `Policy: ${escapeHtml(planet.policy.registration)}, ${escapeHtml(planet.policy.economy)}, ${escapeHtml(planet.policy.security)}`;
            if (planet.policy.hiddenInfluence && planet.policy.hiddenInfluence.vc > 0) html += ` | Hidden VC ${planet.policy.hiddenInfluence.vc}`;
            html += `<br>`;
        }
        html += `Colonists: ${planet.colonists}<br>`;
        if (planet.owner === "Player") {
            const shortages = planet.shortages || makeStock(0, 0, 0);
            html += `Satisfaction: ${planet.satisfaction || 0} | Shortages: Ore ${shortages.ore || 0} / Org ${shortages.org || 0} / Eq ${shortages.eq || 0}<br>`;
        }
        html += `Stock: Ore ${planet.stock.ore} / Org ${planet.stock.org} / Eq ${planet.stock.eq}<br>`;
        html += `Buildings: Hab ${planet.buildings.habitat}, Mine ${planet.buildings.mine}, Farm ${planet.buildings.farm}, Factory ${planet.buildings.factory}, Defense ${planet.buildings.defense}`;
        return html;
    }

    function renderTopTabs() {
        ["sector", "market", "colony", "missions", "logistics", "reputation", "shipyard"].forEach(screen => {
            const el = document.getElementById(`top-${screen}`);
            if (!el) return;
            if (screen === currentScreen) el.classList.add("active-tab");
            else el.classList.remove("active-tab");
        });
    }

    function showScreen(screen) {
        currentScreen = screen;
        if (screen === "colony" && !planets[player.currentSector]) currentScreen = "sector";
        if (screen === "market" && !ports[player.currentSector]) currentScreen = "sector";
        if (screen === "shipyard" && player.currentSector !== 1) currentScreen = "sector";
        if (currentScreen !== "reputation") selectedCaptainId = null; // BUGFIX: clear stale captain selection
        Renderer.invalidateAll();
    }

    function setReputationTab(tab) {
        reputationTab = tab;
        currentScreen = "reputation";
        selectedCaptainId = null; // BUGFIX
        Renderer.invalidateAll();
    }

    function renderCurrentScreen() {
        const title = document.getElementById("screenTitle");
        if (currentScreen === "market" && ports[player.currentSector]) {
            title.innerHTML = `Market - Sector <span id="curSector">${player.currentSector}</span>`;
            renderMarketPanel();
            return;
        }
        if (currentScreen === "colony" && planets[player.currentSector]) {
            title.innerHTML = `Colony - Sector <span id="curSector">${player.currentSector}</span>`;
            renderColonyPanel();
            return;
        }
        if (currentScreen === "shipyard" && player.currentSector === 1) {
            title.innerHTML = `StarDock Shipyard`;
            renderShipyardPanel();
            return;
        }
        if (currentScreen === "missions") {
            title.innerHTML = `Mission Board`;
            document.getElementById("actions").innerHTML = renderAllMissionScreen();
            return;
        }
        if (currentScreen === "reputation") {
            title.innerHTML = `Network & Intel`;
            renderReputationScreen();
            return;
        }
        if (currentScreen === "logistics") {
            title.innerHTML = `Trade Routes & Supply Chains`;
            document.getElementById("actions").innerHTML = renderLogisticsScreen();
            return;
        }
        currentScreen = "sector";
        title.innerHTML = `Current Sector <span id="curSector">${player.currentSector}</span>`;
        document.getElementById("actions").innerHTML = renderSectorActionMenu();
    }

        });

    function renderPriorityFeed() {

        const list = document.getElementById("priorityList");
        if (!list) return;
        if (items.length === 0) {
            list.innerHTML = `<div class="small muted">All clear.</div>`;

    // PLAYER ACTIONS
    // =====================================================
    function moveTo(target) {
        target = parseInt(target, 10);
        const sector = universe[player.currentSector];
        if (!sector.warps.includes(target)) { log("No warp to that sector."); return; }
        if (!spendTime(player.ship.travelMinutesPerWarp)) return;
        player.currentSector = target;
        selectedSectorId = target;
        log(`Warped to sector ${target}. Travel took ${player.ship.travelMinutesPerWarp} minutes.`);
        maybeTravelIncident();
        updateUI();
    }
    registerAction("moveTo", moveTo);

    function maybeTravelIncident() {
        const sector = universe[player.currentSector];
        if (sector.pirateThreat <= 0) return;
        const dominant = getDominantInfluence(player.currentSector);
        let chance = Math.min(0.08 * sector.pirateThreat * getPirateIncidentMultiplier(), 0.35);
        if (dominant === "sda") chance *= 0.65;
        if (dominant === "vc" && getPrivateFactionRep("vc") > 50) chance *= 0.55;
        if (Math.random() > chance) return;
        const damage = 8 + Math.floor(Math.random() * 15) + sector.pirateThreat * 2;
        applyShipDamage(damage);
        log(`Pirates harassed your approach. Shields absorbed ${damage} damage.`);
        Notifications.show(`Pirate attack — ${damage} damage`, 3);
        if (dominant === "vc" && Math.random() < 0.30) addFactionLeverage("vc", 1, "pirate crew recognized your transponder");
    }

    function applyShipDamage(amount) {
        let remaining = amount;
        const shieldHit = Math.min(player.shields, remaining);
        player.shields -= shieldHit;
        remaining -= shieldHit;
        if (remaining > 0) player.hull -= remaining;
        if (player.hull <= 0) {
            player.hull = 1;
            player.credits = Math.max(0, Math.floor(player.credits * 0.75));
            log("Your ship barely survived. Emergency repairs consumed a chunk of your credits.");
            Notifications.show("Emergency repairs! Lost 25% credits", 4);
        }
    }

    function surveySector() {
        const sector = universe[player.currentSector];
        if (sector.surveyed && (!sector.asteroids || sector.asteroids.surveyed)) {
            log("This sector is already surveyed.");
            return;
        }
        if (!spendTime(60)) return;
        sector.surveyed = true;
        if (sector.asteroids) sector.asteroids.surveyed = true;
        log(`Surveyed sector ${sector.id}.`);
        updateFactionAskProgress("market_intel", 1);
        if (sector.front && Math.random() < 0.45) {
            sector.front.suspicion = Math.min(100, sector.front.suspicion + 12);
            addIntel({
                type: "front",
                factionId: sector.front.hiddenFactionId,
                targetFactionId: sector.front.publicFactionId,
                sectorId: sector.id,
                value: 35 + sector.front.suspicion,
                expiresDay: player.time.day + 8,
                text: `Survey anomalies suggest ${FACTIONS[sector.front.hiddenFactionId].short} influence behind a public ${FACTIONS[sector.front.publicFactionId].short} operation in sector ${sector.id}.`
            });
        }
        if (sector.pirateThreat > 0) addFactionTrust("sda", 1, "useful patrol survey");
        updateUI();
    }
    registerAction("surveySector", surveySector);

    function getPortPrice(port, commodity, mode) {
        const stock = Math.max(0, port.stock[commodity]);
        const maxStock = Math.max(1, port.maxStock[commodity]);
        const stockRatio = Math.max(0, Math.min(1, stock / maxStock));
        const base = port.basePrices[commodity];
        const marketPrice = mode === "buy"
            ? base * (0.75 + (1 - stockRatio) * 0.90)
            : base * (0.65 + (1 - stockRatio) * 1.20);
        // BUGFIX: enforce minimum price floor to prevent exploit loops
        return Math.max(BALANCE.MIN_TRADE_PRICE, Math.round(marketPrice * getFactionPriceMultiplier(port, mode)));
    }

    function renderMarketPanel() {
        const port = ports[player.currentSector];
        if (!port) { log("No port here."); return; }
        const type = PORT_TYPES[port.typeKey];
        const faction = FACTIONS[port.factionId];
        let html = `<h4>${escapeHtml(type.name)}</h4>`;
        if (faction) html += `<div>Authority: <span style="color:${faction.color}">${faction.icon} ${escapeHtml(faction.name)}</span> (${getFactionLabel(getFactionRep(faction.id))}, rep ${getFactionRep(faction.id)})</div>`;
        if (port.typeKey === "stardock") {
            html += `<div>StarDock handles upgrades, repairs, fighters, and mission brokerage.</div>`;
            html += `<button data-action="showScreen" data-arg0="shipyard">Open Shipyard</button>`;
        }
        COMMODITIES.forEach(c => {
            const canBuy = type.sells.includes(c);
            const canSell = type.buys.includes(c);
            html += `<div class="commodity-row"><strong>${formatCommodity(c)}</strong>: stock ${port.stock[c]}/${port.maxStock[c]}<br>`;
            if (canBuy) {
                const price = getPortPrice(port, c, "buy");
                html += `Buy price: ${price} each <button data-action="tradeCommodity" data-arg0="${c}" data-arg1="buy">Buy ${BALANCE.TRADE_BATCH}</button> `;
            }
            if (canSell) {
                const price = getPortPrice(port, c, "sell");
                html += `Sell price: ${price} each <button data-action="tradeCommodity" data-arg0="${c}" data-arg1="sell">Sell ${BALANCE.TRADE_BATCH}</button>`;
            }
            if (!canBuy && !canSell) html += `<span class="muted">No trade in this commodity.</span>`;
            html += `</div>`;
        });
        html += renderMissionBoard();
        document.getElementById("actions").innerHTML = html;
    }

    function tradeCommodity(commodity, mode) {
        const port = ports[player.currentSector];
        if (!port) return;
        const type = PORT_TYPES[port.typeKey];
        const price = getPortPrice(port, commodity, mode);
        let amount = BALANCE.TRADE_BATCH;
        if (mode === "buy") {
            if (!type.sells.includes(commodity)) { log("This port does not sell that commodity."); return; }
            amount = Math.min(amount, port.stock[commodity], getFreeHolds(), Math.floor(player.credits / price));
            if (amount <= 0) { log("You cannot buy that right now. Check credits, port stock, and free holds."); return; }
            if (!spendTime(BALANCE.TRADE_TIME_MINUTES)) return;
            player.credits -= amount * price;
            player.cargo[commodity] += amount;
            port.stock[commodity] -= amount;
            log(`Bought ${amount} ${formatCommodity(commodity)} for ${formatCredits(amount * price)} credits. Trade took ${BALANCE.TRADE_TIME_MINUTES} minutes.`);
            if (amount >= BALANCE.TRADE_BATCH) {
                applyPoliticalEffect({ factionId: port.factionId, publicRep: 1, trust: 1, sectorId: player.currentSector, influence: 1, reason: "routine public trade", memoryKey: "reliableJobs" });
                if (port.hiddenFactionId && Math.random() < 0.18) {
                    addFactionRep(port.hiddenFactionId, 1, "quiet port relationship", "private");
                    universe[player.currentSector].front.suspicion = Math.min(100, universe[player.currentSector].front.suspicion + 2);
                }
            }
        } else {
            if (!type.buys.includes(commodity)) { log("This port does not buy that commodity."); return; }
            amount = Math.min(amount, player.cargo[commodity]);
            if (amount <= 0) { log("You do not have that cargo to sell."); return; }
            if (!spendTime(BALANCE.TRADE_TIME_MINUTES)) return;
            player.credits += amount * price;
            player.cargo[commodity] -= amount;
            port.stock[commodity] = Math.min(port.maxStock[commodity], port.stock[commodity] + amount);
            log(`Sold ${amount} ${formatCommodity(commodity)} for ${formatCredits(amount * price)} credits. Trade took ${BALANCE.TRADE_TIME_MINUTES} minutes.`);
            if (amount >= BALANCE.TRADE_BATCH) {
                applyPoliticalEffect({ factionId: port.factionId, publicRep: 1, trust: 1, sectorId: player.currentSector, influence: 2, reason: "supply-chain support", memoryKey: "reliableJobs" });
                if (commodity === "eq" && port.hiddenFactionId === "vc") {
                    addFactionRep("vc", 2, "off-ledger equipment supply", "private");
                    addFactionHeat("sda", 2, "unusual equipment routing");
                }
            }
        }
        updatePoliticalAsksForTrade(commodity, amount, mode);
        updateUI();
    }
    registerAction("tradeCommodity", tradeCommodity);

    function mineAsteroids() {
        const sector = universe[player.currentSector];
        const asteroids = sector.asteroids;
        if (!asteroids) { log("No asteroid field here."); return; }
        if (asteroids.ore <= 0) { log("This asteroid field has been depleted."); return; }
        if (getFreeHolds() <= 0) { log("Your cargo holds are full."); return; }
        if (!spendTime(120)) return;
        const randomFactor = 0.80 + Math.random() * 0.40;
        const influence = getDominantInfluence(player.currentSector);
        const influenceBoost = influence === "hc" ? 1.08 : influence === "vc" ? 1.03 : 1.0;
        const estimatedYield = Math.floor(player.ship.miningPower * getMiningYieldMultiplier() * influenceBoost * asteroids.richness * randomFactor);
        const mined = Math.min(estimatedYield, asteroids.ore, getFreeHolds());
        asteroids.ore -= mined;
        player.cargo.ore += mined;
        log(`Mined ${mined} Ore in sector ${sector.id}. Mining took 2 hours.`);
        if (mined > 0) {
            applyPoliticalEffect({ factionId: "miners", publicRep: 1, trust: 1, sectorId: player.currentSector, influence: 2, reason: "asteroid extraction", memoryKey: "reliableJobs" });
            addSectorInfluence(player.currentSector, "hc", 1, "industrial extraction");
            updateFactionAskProgress("ore_quota", mined);
            missions.filter(m => m.status === "accepted" && m.type === "mining").forEach(m => {
                m.progress = Math.min(m.amount, m.progress + mined);
            });
        }
        if (Math.random() < asteroids.hazard) {
            const damage = 6 + Math.floor(Math.random() * 22);
            applyShipDamage(damage);
            addFactionHeat("sda", 1, "hazard beacon traffic");
            log(`Mining debris hit the ship for ${damage} damage.`);
        }
        updateUI();
    }
    registerAction("mineAsteroids", mineAsteroids);

        if (!planet || planet.owner) return;

        if (player.credits < 2500 || !hasCargo(cost)) {
            log("Founding a colony requires 50 Organics, 20 Equipment, and 2,500 credits.");

        }

            registration: getFactionRep("sda") >= 0 ? "registered" : "informal",
            economy: "free_trade",
            security: "local_militia",
            hiddenInfluence: { vc: 0 }
        };
        planet.colonists = 100;
        planet.buildings.habitat = 1;
        applyPoliticalEffect({ factionId: "colonists", publicRep: 5, trust: 2, sectorId: player.currentSector, influence: 4, reason: "new colony founded", memoryKey: "reliableJobs" });
        applyPoliticalEffect({ factionId: "fu", publicRep: 2, trust: 1, sectorId: player.currentSector, influence: 7, reason: "frontier settlement" });
        addFactionHeat("sda", planet.policy.registration === "registered" ? 0 : 3, "informal colony paperwork");

        log(`Founded a colony on the ${PLANET_TYPES[planet.typeKey].name} planet in sector ${player.currentSector}.`);

            addFactionHeat("sda", 5, "unusual colony traffic");

    function setColonyPolicy(key, value) {

        if (!planet.policy) planet.policy = { registration: "registered", economy: "free_trade", security: "local_militia", hiddenInfluence: { vc: 0 } };
        if (!spendTime(60)) return;

        if (key === "registration" && value === "registered") {
