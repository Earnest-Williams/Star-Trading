<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solo Space Trader - Political Frontier Prototype</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="notificationFeed"></div>

    <div id="shellView">
        <div id="mainMenu" class="panel shell-menu">
            <h1>Solo Space Trader</h1>
            <div id="shellContinueInfo" class="shell-continue-info"></div>
            <div class="shell-actions">
                <button id="btn-menu-continue" hidden>Continue</button>
                <button id="btn-menu-new-game">New Game</button>
                <button id="btn-menu-load">Load Game</button>
                <button id="btn-menu-settings">Settings</button>
            </div>
        </div>
        <div id="newGamePanel" class="panel" hidden>
            <button id="btn-chargen-back" class="shell-back">&#8592; Menu</button>
            <h3>New Game Settings</h3>
            <label>Galaxy Archetype
                <select id="worldgen-archetype">
                    <option value="barred_spiral" selected>Barred Spiral</option>
                    <option value="four_arm_spiral">Four-Arm Spiral</option>
                    <option value="ring_spiral">Ring Spiral</option>
                    <option value="dwarf_irregular">Dwarf Irregular</option>
                </select>
            </label>
            <label>Occupied Sites
                <select id="worldgen-sites">
                    <option value="180">180</option>
                    <option value="240" selected>240</option>
                    <option value="360">360</option>
                    <option value="540">540</option>
                    <option value="720">720</option>
                </select>
            </label>
            <span class="advanced-settings">Advanced:</span>
            <label>Route Density
                <select id="worldgen-route-density">
                    <option value="0.85">Low</option>
                    <option value="1" selected>Standard</option>
                    <option value="1.15">High</option>
                </select>
            </label>
            <label>Known Space at Start
                <select id="worldgen-known-space">
                    <option value="0.20">20%</option>
                    <option value="0.28" selected>28%</option>
                    <option value="0.35">35%</option>
                </select>
            </label>
            <div id="chargenPanel" class="subpanel"></div>
        </div>
        <div id="loadGamePanel" class="panel" hidden>
            <button id="btn-load-back" class="shell-back">&#8592; Menu</button>
            <h3>Load Game</h3>
            <button id="btn-load-from-storage">Load Saved Game</button>
            <div>
                <button id="btn-import-save">Import Save File&hellip;</button>
                <input type="file" id="import-save-file" accept=".json" style="display:none">
            </div>
        </div>
        <div id="settingsPanel" class="panel" hidden>
            <button id="btn-settings-back" class="shell-back">&#8592; Menu</button>
            <h3>Settings</h3>
            <label><input type="checkbox" id="settings-reduced-motion"> Reduced Motion</label>
            <label><input type="checkbox" id="settings-compact-ui"> Compact UI</label>
            <label><input type="checkbox" id="settings-show-boot-tips"> Show Boot Tips</label>
            <label>Default Galaxy Archetype
                <select id="settings-default-archetype">
                    <option value="barred_spiral">Barred Spiral</option>
                    <option value="four_arm_spiral">Four-Arm Spiral</option>
                    <option value="ring_spiral">Ring Spiral</option>
                    <option value="dwarf_irregular">Dwarf Irregular</option>
                </select>
            </label>
            <label>Default Occupied Sites
                <select id="settings-default-sites">
                    <option value="180">180</option>
                    <option value="240">240</option>
                    <option value="360">360</option>
                    <option value="540">540</option>
                    <option value="720">720</option>
                </select>
            </label>
            <button id="btn-settings-save">Save Settings</button>
        </div>
    </div>

    <div id="gameShell" hidden>
        <div class="topbar panel">
            <button id="top-sector" data-action="showScreen" data-arg0="sector">Sector</button>
            <button id="top-market" data-action="showScreen" data-arg0="market">Market</button>
            <button id="top-colony" data-action="showScreen" data-arg0="colony">Colonies</button>
            <button id="top-missions" data-action="showScreen" data-arg0="missions">Missions</button>
            <button id="top-logistics" data-action="showScreen" data-arg0="logistics">Logistics</button>
            <button id="top-reputation" data-action="showScreen" data-arg0="reputation">Network</button>
            <button id="top-communications" data-action="showScreen" data-arg0="communications">Comms</button>
            <button id="top-spreadsheet" data-action="showScreen" data-arg0="spreadsheet">Ledger</button>
            <button id="top-property" data-action="showScreen" data-arg0="property">Property</button>
            <button id="top-character" data-action="showScreen" data-arg0="character">Character</button>
            <button id="top-shipyard" data-action="showScreen" data-arg0="shipyard">Shipyard</button>
        </div>
        <div id="game">
            <div class="left-sidebar panel">
                <button id="btn-toggle-left-sidebar" class="sidebar-toggle" type="button" aria-controls="game" aria-expanded="true">Collapse Captain</button>
                <div class="captain-rail" aria-label="Collapsed captain status">
                    <div id="captainRailWarning" class="captain-rail-warning" title="Priority warning"></div>
                    <div id="captainRailShip" class="captain-rail-ship" title="Ship">◆</div>
                    <div id="captainRailCredits" class="captain-rail-credit" title="Credits">0c</div>
                    <div class="captain-rail-meter" title="Hull"><span id="captainRailHull"></span></div>
                    <div class="captain-rail-meter shield" title="Shields"><span id="captainRailShields"></span></div>
                </div>
                <div class="sidebar-content">
                <section class="captain-header" aria-label="Captain overview">
                    <div class="captain-kicker">CAPTAIN</div>
                    <h3 id="captainTitle">Captain</h3>
                    <div class="captain-ship-name"><span id="shipName"></span></div>
                </section>
                <section class="captain-core-stats" aria-label="Captain core stats">
                    <div class="captain-stat"><span class="stat-label">Credits</span><span id="credits" class="green stat-value"></span></div>
                    <div class="captain-stat"><span class="stat-label">Day/Time</span><span id="dayTime" class="green stat-value"></span></div>
                    <div class="captain-stat sector-stat"><span class="stat-label">Sector</span><span class="stat-value">S<span id="sectorNum"></span> <span id="sectorName"></span></span></div>
                </section>
                <section class="cargo-mini-list" aria-label="Cargo manifest">
                    <div class="section-label">Cargo</div>
                    <div id="cargoSummary"></div>
                </section>
                <section class="ship-status-meters" aria-label="Ship status meters">
                    <div class="status-meter-row">
                        <span class="status-label">Hull</span>
                        <span class="status-meter"><span id="hullMeter" class="status-meter-fill hull-fill"></span></span>
                        <span id="hull" class="status-value"></span>
                    </div>
                    <div class="status-meter-row">
                        <span class="status-label">Shields</span>
                        <span class="status-meter"><span id="shieldsMeter" class="status-meter-fill shields-fill"></span></span>
                        <span id="shields" class="status-value"></span>
                    </div>
                    <div class="status-meter-row">
                        <span class="status-label">Holds</span>
                        <span class="status-meter"><span id="holdsMeter" class="status-meter-fill holds-fill"></span></span>
                        <span id="holds" class="green status-value"></span>
                    </div>
                    <div class="status-meter-row compact">
                        <span class="status-label">Fighters</span>
                        <span class="status-meter"><span id="fightersMeter" class="status-meter-fill fighters-fill"></span></span>
                        <span id="fighters" class="status-value"></span>
                    </div>
                </section>
                <div id="factionPanel" class="subpanel political-readout"></div>
                <section class="captain-actions" aria-label="Captain utility actions">
                    <div class="menu-grid">
                        <button id="btn-rest">Rest</button>
                        <button id="btn-save">Save</button>
                        <button id="btn-load">Load</button>
                        <button id="btn-intel">Intel</button>
                    </div>
                </section>
                <div id="planetInfo" class="subpanel" style="display:none"></div>
                <div id="priorityFeed" class="subpanel">
                    <strong>Attention</strong>
                    <div id="priorityList"></div>
                </div>
                <div id="nextStepsPanel" class="subpanel">
                    <strong>Priority Briefing</strong>
                    <div id="nextStepsList"></div>
                </div>
                </div>
            </div>

            <div class="main-viewport">
                <div class="map-wrap">
                    <div class="map-stage">
                        <div id="mapToolbar" class="map-toolbar"></div>
                        <canvas id="map" width="700" height="420"></canvas>
                        <canvas id="mapOverview" class="map-overview" width="180" height="110" aria-label="Known space overview"></canvas>
                        <div id="mapShortcutHelp" class="map-shortcut-help" hidden></div>
                        <div id="mapInspector" class="subpanel map-inspector-overlay"></div>
                        <button id="mapRailToggle" class="map-rail-toggle" type="button">Map</button>
                    </div>
                </div>
                <div class="panel screen-content-panel">
                    <div class="screen-panel-header">
                        <h3 id="screenTitle">Current Sector <span id="curSector"></span></h3>
                        <div class="screen-panel-controls" id="screenPanelControls">
                            <button type="button" data-screen-panel-mode="full">Full</button>
                            <button type="button" data-screen-panel-mode="summary">Summary</button>
                            <button type="button" data-screen-panel-mode="rail">Rail</button>
                        </div>
                    </div>
                    <div id="screenSummary" class="screen-summary" hidden></div>
                    <div id="sectorContents"></div>
                    <div id="actions" class="subpanel"></div>
                </div>
                <div id="actionHotbar" class="action-hotbar panel" hidden></div>
                <div class="log" id="log"></div>
            </div>

            <div class="right-sidebar panel">
                <button id="btn-toggle-right-sidebar" class="sidebar-toggle" type="button" aria-controls="game" aria-expanded="true">Collapse Navigation</button>
                <div class="sidebar-content">
                <h3>Command Console</h3>
                <div id="commandList" class="subpanel command-stack"></div>
                <section class="accordion-section subpanel is-open" data-accordion-id="accepted-missions">
                    <button class="accordion-header" type="button" data-accordion-toggle aria-expanded="true">
                        <span>Accepted Missions</span><span class="accordion-caret" aria-hidden="true">▾</span>
                    </button>
                    <div id="acceptedMissions" class="accordion-body"></div>
                </section>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
