<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solo Space Trader - Political Frontier Prototype</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
        :root {
            --bg: #001122;
            --panel: #002233;
            --panel-dark: #000811;
            --cyan: #00ffcc;
            --green: #00ff88;
            --amber: #ffaa00;
            --blue: #44aaff;
            --red: #ff4444;
            --muted: #77ccb8;
        }
        * { box-sizing: border-box; }
        body {
            background: var(--bg);
            color: var(--cyan);
            font-family: 'VT323', monospace;
            margin: 0;
            padding: 20px;
            line-height: 1.35;
            font-size: 20px;
        }
        h1 {
            margin: 0 0 14px;
            text-align: center;
            color: var(--green);
            text-shadow: 0 0 10px var(--green);
            letter-spacing: 3px;
        }
        h3, h4 { margin: 6px 0 10px; color: var(--green); }
        #game {
            max-width: 1280px;
            margin: auto;
            display: grid;
            grid-template-columns: 280px 1fr 330px;
            gap: 15px;
        }
        .panel {
            background: var(--panel);
            border: 3px solid var(--cyan);
            padding: 14px;
            box-shadow: 0 0 18px rgba(0, 255, 204, 0.55);
        }
        .subpanel {
            background: var(--panel-dark);
            border: 2px solid rgba(0, 255, 204, 0.7);
            padding: 10px;
            margin-top: 10px;
        }
        #map {
            width: 100%;
            height: 420px;
            background: var(--panel-dark);
            border: 3px solid var(--cyan);
        }
        button, input {
            background: #003344;
            color: var(--cyan);
            border: 2px solid var(--green);
            padding: 7px 10px;
            margin: 3px;
            font-family: inherit;
            font-size: 18px;
        }
        button { cursor: pointer; }
        button:hover { background: var(--green); color: var(--bg); }
        button:disabled { opacity: 0.45; cursor: not-allowed; }
        input { width: 100%; }
        .log {
            height: 210px;
            overflow-y: auto;
            background: var(--panel-dark);
            padding: 10px;
            margin-top: 10px;
            border: 2px solid rgba(0, 255, 204, 0.7);
        }
        .green { color: var(--green); }
        .red { color: var(--red); }
        .amber { color: var(--amber); }
        .blue { color: var(--blue); }
        .muted { color: var(--muted); }
        .small { font-size: 0.9em; }
        .faction-line { display: grid; grid-template-columns: 48px 1fr 54px; gap: 6px; align-items: center; margin: 3px 0; }
        .faction-bar { height: 9px; background: rgba(119, 204, 184, 0.24); border: 1px solid rgba(0, 255, 204, 0.45); }
        .faction-fill { height: 100%; width: 0%; background: var(--green); }
        .faction-title { margin-top: 8px; color: var(--green); }
        .faction-icon { display:inline-block; min-width: 18px; text-align:center; }
        .row { margin: 4px 0; }
        .commodity-row {
            border-top: 1px solid rgba(0, 255, 204, 0.25);
            padding-top: 6px;
            margin-top: 6px;
        }
        .mission {
            border-top: 1px solid rgba(0, 255, 204, 0.25);
            padding-top: 8px;
            margin-top: 8px;
        }
        .topbar {
            max-width: 1280px;
            margin: 0 auto 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            justify-content: center;
        }
        .topbar button, .tab-button {
            min-width: 118px;
        }
        .active-tab {
            background: var(--green) !important;
            color: var(--bg) !important;
            box-shadow: 0 0 12px rgba(0, 255, 136, 0.75);
        }
        .map-wrap { position: relative; }
        #map { cursor: crosshair; }
        #mapInspector {
            margin-top: 10px;
            min-height: 92px;
        }
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }
        .menu-grid button { width: 100%; margin: 0; }
        .nav-card {
            border-top: 1px solid rgba(0, 255, 204, 0.25);
            padding: 8px 0;
        }
        .nav-card button { width: calc(50% - 8px); }
        .screen-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 10px;
        }
        .screen-tabs button { margin: 0; }
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 10px;
        }
        .card {
            background: var(--panel-dark);
            border: 2px solid rgba(0, 255, 204, 0.55);
            padding: 10px;
        }
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 6px;
            margin-top: 8px;
        }
        .stat-pill {
            border: 1px solid rgba(0, 255, 204, 0.45);
            padding: 5px 7px;
            background: rgba(0, 8, 17, 0.65);
        }
        .sector-chip {
            display: inline-block;
            border: 1px solid rgba(0, 255, 204, 0.45);
            padding: 2px 7px;
            margin: 2px;
            background: rgba(0, 8, 17, 0.7);
        }
        .relationship-row {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr 1fr;
            gap: 8px;
            align-items: start;
            border-top: 1px solid rgba(0, 255, 204, 0.25);
            padding: 8px 0;
        }
        .compact-actions button { margin: 2px; }
        .captain-chip {
            display: inline-block;
            border: 1px solid rgba(255, 255, 255, 0.35);
            padding: 2px 7px;
            margin: 2px;
            background: rgba(0, 8, 17, 0.75);
        }
        .captain-card {
            background: rgba(0, 8, 17, 0.82);
            border: 2px solid rgba(255, 255, 255, 0.28);
            padding: 10px;
        }
        .timeline-entry {
            border-top: 1px solid rgba(0, 255, 204, 0.22);
            padding: 6px 0;
        }
        /* NEW: Notification feed */
        #notificationFeed {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 300px;
            max-height: 80vh;
            overflow-y: auto;
            z-index: 100;
            pointer-events: none;
        }
        .notification {
            background: var(--panel-dark);
            border: 2px solid var(--cyan);
            padding: 8px 10px;
            margin-bottom: 6px;
            box-shadow: 0 0 12px rgba(0, 255, 204, 0.4);
            font-size: 16px;
            pointer-events: auto;
            cursor: pointer;
            opacity: 1;
            transition: opacity 0.5s;
        }
        .notification.priority-3 { border-color: var(--amber); box-shadow: 0 0 12px rgba(255, 170, 0, 0.5); }
        .notification.priority-4 { border-color: var(--red); box-shadow: 0 0 14px rgba(255, 68, 68, 0.6); }
        .notification.fading { opacity: 0; }
        .notification .small { display: block; color: var(--muted); margin-top: 2px; }
        #priorityFeed {
            margin-top: 10px;
        }
        .priority-item {
            border-left: 3px solid var(--amber);
            padding: 4px 8px;
            margin: 4px 0;
            background: rgba(0, 8, 17, 0.5);
            cursor: pointer;
        }
        .priority-item:hover { background: rgba(0, 255, 204, 0.1); }
        .priority-item.urgent { border-left-color: var(--red); }
        @media (max-width: 1000px) {
            #game { grid-template-columns: 1fr; }
            #notificationFeed { display: none; }
        }
    </style>
</head>
<body>
    <h1>SOLO SPACE TRADER: LOGISTICS, CONVOYS & POLITICAL ECONOMY</h1>
    <div id="notificationFeed"></div>
    <div class="topbar panel">
        <button id="top-sector" data-screen="sector">Sector</button>
        <button id="top-market" data-screen="market">Market</button>
        <button id="top-colony" data-screen="colony">Colonies</button>
        <button id="top-missions" data-screen="missions">Missions</button>
        <button id="top-logistics" data-screen="logistics">Logistics</button>
        <button id="top-reputation" data-screen="reputation">Network</button>
        <button id="top-shipyard" data-screen="shipyard">Shipyard</button>
    </div>
    <div id="game">
        <div class="panel">
            <h3>Captain</h3>
            <div><strong>Ship:</strong> <span id="shipName"></span></div>
            <div>Credits: <span id="credits" class="green"></span></div>
            <div>Day/Time: <span id="dayTime" class="green"></span></div>
            <div>Sector: <span id="sectorNum"></span> (<span id="sectorName"></span>)</div>
            <hr>
            <div>Cargo: <span id="cargoSummary"></span></div>
            <div>Holds: <span id="holds" class="green"></span></div>
            <div>Fighters: <span id="fighters"></span></div>
            <div>Shields: <span id="shields"></span></div>
            <div>Hull: <span id="hull"></span></div>
            <div id="factionPanel" class="subpanel"></div>
            <hr>
            <div class="menu-grid">
                <button id="btn-rest">Rest</button>
                <button id="btn-save">Save</button>
                <button id="btn-load">Load</button>
                <button id="btn-intel">Intel</button>
            </div>
            <div id="planetInfo" class="subpanel" style="display:none"></div>
            <div id="priorityFeed" class="subpanel">
                <strong>Attention</strong>
                <div id="priorityList"></div>
            </div>
        </div>

        <div>
            <div class="map-wrap">
                <canvas id="map" width="700" height="420"></canvas>
                <div id="mapInspector" class="subpanel"></div>
            </div>
            <div class="panel" style="margin-top:10px">
                <h3 id="screenTitle">Current Sector <span id="curSector"></span></h3>
                <div id="sectorContents"></div>
                <div id="actions" class="subpanel"></div>
            </div>
            <div class="log" id="log"></div>
        </div>

        <div class="panel">
            <h3>Navigation</h3>
            <div id="commandList" class="subpanel"></div>
            <h3>Accepted Missions</h3>
            <div id="acceptedMissions" class="subpanel"></div>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
