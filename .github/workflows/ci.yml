name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      full_validation:
        description: Run full repository validation manually
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changed-validation:
    if: github.event_name != 'workflow_dispatch'
    timeout-minutes: 8
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 2

      - name: Detect changed files and select checks
        id: select
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            git fetch --no-tags --depth=1 origin "$BASE_SHA" "$HEAD_SHA"
          else
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
            if printf '%s' "$BASE_SHA" | grep -Eq '^0+$'; then
              BASE_SHA="${HEAD_SHA}^"
            fi
          fi

          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > changed-files.txt

          echo "Changed files:"
          cat changed-files.txt

          : > selected-tests.txt
          : > selected-lint-files.txt
          : > selected-syntax-files.txt

          needs_node=false
          package_changed=false

          while IFS= read -r file; do
            case "$file" in
              tests/*.js)
                printf '%s\n' "$file" >> selected-tests.txt
                printf '%s\n' "$file" >> selected-lint-files.txt
                needs_node=true
                ;;

              js/*.js|js/**/*.js)
                printf '%s\n' "$file" >> selected-lint-files.txt
                needs_node=true

                if [ -d tests ]; then
                  grep -RIlF "$file" tests --include='*.js' >> selected-tests.txt || true
                  grep -RIlF "${file%.js}" tests --include='*.js' >> selected-tests.txt || true

                  base_name="$(basename "$file" .js)"
                  find tests -type f -name "*${base_name}*.js" >> selected-tests.txt || true
                fi
                ;;

              scripts/*.js|scripts/*.mjs|*.js|*.mjs)
                printf '%s\n' "$file" >> selected-lint-files.txt
                printf '%s\n' "$file" >> selected-syntax-files.txt
                needs_node=true
                ;;

              package.json|package-lock.json|npm-shrinkwrap.json)
                package_changed=true
                needs_node=true
                ;;

              .github/workflows/*.yml|.github/workflows/*.yaml)
                echo "Workflow-only validation: no npm checks selected for $file"
                ;;

              docs/*|*.md)
                echo "Docs/markdown-only validation: no npm checks selected for $file"
                ;;
            esac
          done < changed-files.txt

          awk 'NF && !seen[$0]++' selected-tests.txt > selected-tests.unique
          mv selected-tests.unique selected-tests.txt

          awk 'NF && !seen[$0]++' selected-lint-files.txt > selected-lint-files.unique
          mv selected-lint-files.unique selected-lint-files.txt

          awk 'NF && !seen[$0]++' selected-syntax-files.txt > selected-syntax-files.unique
          mv selected-syntax-files.unique selected-syntax-files.txt

          echo "Selected tests:"
          cat selected-tests.txt || true

          echo "Selected lint files:"
          cat selected-lint-files.txt || true

          echo "Selected syntax files:"
          cat selected-syntax-files.txt || true

          echo "needs_node=$needs_node" >> "$GITHUB_OUTPUT"
          echo "package_changed=$package_changed" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        if: steps.select.outputs.needs_node == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.select.outputs.needs_node == 'true'
        run: npm ci

      - name: Validate package install only
        if: steps.select.outputs.package_changed == 'true'
        run: npm ls --depth=0

      - name: Syntax-check changed scripts
        if: steps.select.outputs.needs_node == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ -s selected-syntax-files.txt ]; then
            xargs -r -a selected-syntax-files.txt -n 1 node --check
          else
            echo "No changed standalone scripts to syntax-check."
          fi

      - name: Lint changed JavaScript files only
        if: steps.select.outputs.needs_node == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ -s selected-lint-files.txt ]; then
            xargs -r -a selected-lint-files.txt npx eslint --max-warnings=0
          else
            echo "No changed JavaScript files to lint."
          fi

      - name: Run selected tests only
        if: steps.select.outputs.needs_node == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ -s selected-tests.txt ]; then
            xargs -r -a selected-tests.txt node --test
          else
            echo "No directly affected tests selected."
          fi

      - name: No runtime checks selected
        if: steps.select.outputs.needs_node != 'true'
        run: echo "Only docs/workflow/non-runtime files changed; skipping npm validation."

  manual-full-validation:
    if: github.event_name == 'workflow_dispatch' && inputs.full_validation == true
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 2

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run full validation manually
        run: npm run validate

      - name: Docs drift guard manually
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
          HEAD_SHA="$(git rev-parse HEAD)"
          BASE_SHA="$BASE_SHA" HEAD_SHA="$HEAD_SHA" npm run docs:drift
